ПЗ критично важлива?</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Безпека програмного забезпечення (Software Security)</strong> - це комплекс заходів, практик та технологій, спрямованих на захист програмних систем від несанкціонованого доступу, модифікації, знищення даних та порушення функціонування.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> Безпека - це не функція, яку можна додати наприкінці розробки, а фундаментальна властивість системи, що має бути закладена з самого початку проєктування.</p>\n<h2>📊 Статистика інцидентів безпеки</h2>\n<table>\n<thead>\n<tr>\n<th>Показник</th>\n<th>Значення (2023-2024)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>💰 Середня вартість витоку даних</td>\n<td>$4.45 млн (IBM Security)</td>\n</tr>\n<tr>\n<td>⏱️ Середній час виявлення атаки</td>\n<td>204 дні</td>\n</tr>\n<tr>\n<td>🔓 Частка атак через вразливості ПЗ</td>\n<td>~70%</td>\n</tr>\n<tr>\n<td>📈 Зростання кібератак щорічно</td>\n<td>15-20%</td>\n</tr>\n</tbody></table>\n<div class=\"warning\"><strong>⚠️ Важливо</strong> <p>Вартість виправлення вразливості зростає експоненційно на кожному етапі SDLC: виправлення на етапі експлуатації коштує у 30-100 разів дорожче, ніж на етапі проєктування.</p>\n</div>\n\n","<h1>🏛️ CIA Triad - фундамент інформаційної безпеки</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>CIA Triad</strong> - це модель, що описує три ключові властивості захищеної інформаційної системи: Confidentiality (Конфіденційність), Integrity (Цілісність), Availability (Доступність).</p>\n</div>\n\n\n\n\n<img src=\"https://www.plantuml.com/plantuml/svg/XLBBJW8n5DttAwwwqGM9Zv3eZd6SmKa89aHNwg8u1Hg6ZYd5n9sAZus96mE97-0Q5U8RVw7z8syHmuWQqZIzkUUUU-wZcRgYKZLg4PaAMOaB1haWkxwvcjloOCPRyXVzjPz8jk1vUOIM_RItyXFQA3ZvBD9ytr_ovWcfLxdOfvBMe4ZtgcKPDqJenb4iCSIn9n4n1ALW4XRIX4YsfwWeHmoctLYKUCY4uZJYwd17pEeRtTVlvjIqT5Vtq3f7wndVbZas9-PoRXfe7TnHAybqWL2iB8U9Rf7uQcdZv23HRPBj750UqIB_hkHQzmUqfluOJ-4afqA82wdj2W-naLt9onMLWe04ltmE8I9M38gnKd4DuXAu142tTSUSwIUR7lIzxHki-rttiFGElY-36U1KyDuFF7tzeFisg3igqJG94o5OXLywmTyw4sLCsuQyeQEBHBkJ5qo2OGZyA-OCnVGTxkyHPzSp5tQJECCh2utSHsZTVQrtSaiPDF4lVm80\" alt=\"PlantUML diagram\" class=\"plantuml-diagram\">\n","<h1>🔒 Confidentiality - Конфіденційність</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Конфіденційність</strong> - забезпечення доступу до інформації лише авторизованим користувачам та системам.</p>\n</div>\n\n\n\n<h2>🛠️ Механізми забезпечення конфіденційності</h2>\n<table>\n<thead>\n<tr>\n<th>Механізм</th>\n<th>Опис</th>\n<th>Приклад застосування</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🔐 <strong>Шифрування</strong></td>\n<td>Криптографічний захист даних</td>\n<td>AES-256, RSA, TLS/SSL</td>\n</tr>\n<tr>\n<td>👤 <strong>Автентифікація</strong></td>\n<td>Підтвердження ідентичності</td>\n<td>MFA, OAuth 2.0, JWT</td>\n</tr>\n<tr>\n<td>🎫 <strong>Авторизація</strong></td>\n<td>Контроль прав доступу</td>\n<td>RBAC, ABAC, ACL</td>\n</tr>\n<tr>\n<td>🗂️ <strong>Класифікація даних</strong></td>\n<td>Категоризація за рівнем чутливості</td>\n<td>Public, Internal, Confidential, Secret</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Найкраща практика</strong> <p>Застосовуйте принцип <strong>шифрування за замовчуванням (Encryption by Default)</strong>: усі чутливі дані мають шифруватися як при передачі (in transit), так і при зберіганні (at rest).</p>\n</div>\n\n","<h1>✅ Integrity - Цілісність</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Цілісність</strong> - гарантія того, що дані не були змінені несанкціоновано під час зберігання, обробки або передачі.</p>\n</div>\n\n\n\n<h2>🔧 Методи забезпечення цілісності</h2>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    subgraph &quot;Методи контролю цілісності&quot;\n        A[&quot;🔢 Хеш-функції&lt;br/&gt;SHA-256, SHA-3&quot;]\n        B[&quot;✍️ Цифрові підписи&lt;br/&gt;RSA, ECDSA&quot;]\n        C[&quot;📋 Контрольні суми&lt;br/&gt;CRC, MD5*&quot;]\n        D[&quot;📝 Журналювання&lt;br/&gt;Audit Logs&quot;]\n    end\n\n    style A fill:#E8F5E9,stroke:#4CAF50\n    style B fill:#E3F2FD,stroke:#2196F3\n    style C fill:#FFF3E0,stroke:#FF9800\n    style D fill:#F3E5F5,stroke:#9C27B0\"><svg id=\"exp-1766518040755-5-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 983.7578125px;\" viewBox=\"0 0 983.7578125 163\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1766518040755-5-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1766518040755-5-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1766518040755-5-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#exp-1766518040755-5-0 .error-icon{fill:#552222;}#exp-1766518040755-5-0 .error-text{fill:#552222;stroke:#552222;}#exp-1766518040755-5-0 .edge-thickness-normal{stroke-width:1px;}#exp-1766518040755-5-0 .edge-thickness-thick{stroke-width:3.5px;}#exp-1766518040755-5-0 .edge-pattern-solid{stroke-dasharray:0;}#exp-1766518040755-5-0 .edge-thickness-invisible{stroke-width:0;fill:none;}#exp-1766518040755-5-0 .edge-pattern-dashed{stroke-dasharray:3;}#exp-1766518040755-5-0 .edge-pattern-dotted{stroke-dasharray:2;}#exp-1766518040755-5-0 .marker{fill:#333333;stroke:#333333;}#exp-1766518040755-5-0 .marker.cross{stroke:#333333;}#exp-1766518040755-5-0 svg{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;}#exp-1766518040755-5-0 p{margin:0;}#exp-1766518040755-5-0 .label{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;color:#333;}#exp-1766518040755-5-0 .cluster-label text{fill:#333;}#exp-1766518040755-5-0 . an></text></g></g></g></g><g class=\"edgePaths\"></g><g class=\"edgeLabels\"></g><g class=\"nodes\"><g class=\"node default  \" id=\"flowchart-A-0\" transform=\"translate(129.2109375, 81.5)\"><rect class=\"basic label-container\" style=\"fill:#E8F5E9 !important;stroke:#4CAF50 !important\" x=\"-86.2109375\" y=\"-36\" width=\"172.421875\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-62.2109375, -24)\"><rect></rect><foreignObject width=\"124.421875\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>🔢 Хеш-функції<br>SHA-256, SHA-3</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"flowchart-B-1\" transform=\"translate(363.23046875, 81.5)\"><rect class=\"basic label-container\" style=\"fill:#E3F2FD !important;stroke:#2196F3 !important\" x=\"-97.80859375\" y=\"-36\" width=\"195.6171875\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-73.80859375, -24)\"><rect></rect><foreignObject width=\"147.6171875\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>✍️ Цифрові підписи<br>RSA, ECDSA</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"flowchart-C-2\" transform=\"translate(608.69140625, 81.5)\"><rect class=\"basic label-container\" style=\"fill:#FFF3E0 !important;stroke:#FF9800 !important\" x=\"-97.65234375\" y=\"-36\" width=\"195.3046875\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-73.65234375, -24)\"><rect></rect><foreignObject width=\"147.3046875\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>📋 Контрольні суми<br>CRC, MD5*</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"flowchart-D-3\" transform=\"translate(848.55078125, 81.5)\"><rect class=\"basic label-container\" style=\"fill:#F3E5F5 !important;stroke:#9C27B0 !important\" x=\"-92.20703125\" y=\"-36\" width=\"184.4140625\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-68.20703125, -24)\"><rect></rect><foreignObject width=\"136.4140625\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>📝 Журналювання<br>Audit Logs</p></span></div></foreignObject></g></g></g></g></g></g></g></svg></div>\n<div class=\"warning\"><strong>⚠️ Застереження</strong> <p>MD5 та SHA-1 вважаються криптографічно небезпечними для критичних застосувань. Використовуйте SHA-256 або SHA-3 для хешування паролів та цифрових підписів.</p>\n</div>\n\n\n\n<p><strong>Приклад:</strong> Git використовує SHA-1 (переходить на SHA-256) для забезпечення цілісності історії комітів - будь-яка зміна файлу змінює хеш усього ланцюжка.</p>\n","<h1>🌐 Availability - Доступність</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Доступність</strong> - забезпечення безперебійного доступу авторизованих користувачів до системи та даних у необхідний момент часу.</p>\n</div>\n\n\n\n<h2>📊 Метрики доступності</h2>\n<table>\n<thead>\n<tr>\n<th>Рівень доступності</th>\n<th>Допустимий downtime на рік</th>\n<th>Типове застосування</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>99% (\"two nines\")</td>\n<td>3.65 дні</td>\n<td>Внутрішні системи</td>\n</tr>\n<tr>\n<td>99.9% (\"three nines\")</td>\n<td>8.76 годин</td>\n<td>Бізнес-застосунки</td>\n</tr>\n<tr>\n<td>99.99% (\"four nines\")</td>\n<td>52.6 хвилин</td>\n<td>E-commerce, банкінг</td>\n</tr>\n<tr>\n<td>99.999% (\"five nines\")</td>\n<td>5.26 хвилин</td>\n<td>Критична інфраструктура</td>\n</tr>\n</tbody></table>\n<h2>🛡️ Загрози доступності та захист</h2>\n<table>\n<thead>\n<tr>\n<th>Загроза</th>\n<th>Опис</th>\n<th>Методи захисту</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>💥 <strong>DDoS-атаки</strong></td>\n<td>Перевантаження ресурсів</td>\n<td>CDN, Rate Limiting, WAF</td>\n</tr>\n<tr>\n<td>🔧 <strong>Відмова обладнання</strong></td>\n<td>Апаратні збої</td>\n<td>Резервування, кластеризація</td>\n</tr>\n<tr>\n<td>🐛 <strong>Програмні помилки</strong></td>\n<td>Баги, витоки пам'яті</td>\n<td>Тестування, моніторинг</td>\n</tr>\n<tr>\n<td>🌊 <strong>Стихійні лиха</strong></td>\n<td>Фізичне пошкодження</td>\n<td>Geo-розподілені ЦОД</td>\n</tr>\n</tbody></table>\n","<h1>⚠️ OWASP Top 10:2025 - критичні вразливості веб-застосунків</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>OWASP (Open Web Application Security Project)</strong> - некомерційна організація, що розробляє стандарти та інструменти безпеки ПЗ. <strong>OWASP Top 10</strong> - перелік найбільш критичних ризиків безпеки веб-застосунків.</p>\n</div>\n\n\n\n\n<img src=\"https://www.plantuml.com/plantuml/svg/TPBFJXin4CRlVee13gK79CYV0paHDgIir5oWd5eEPjSa9ekzykwgoYqGb782gQfIYGkl416gHa38AupVY34aj550Fgpt6sj-yttsHf9oasR74Li8nQ5K0hmT_ullbJ_3KhNgLIgvryAs_sdRYLkhc__4sbR5twivkRhk5HXBcbB5tF1ZEE11isvqfa9FHzhGaR9RZ1aHf5pL8m6BvTMr4cmQtHGAoa4WaWGyhLAZeszg6Q_nqRPjnvxZ7npXo5u2tk4ZRKvjcxxtzWBmbiwSaD31iUryN0IU03LzDJ4BovLWLmIPaMaBQZ89j3gKzSpmL6er0U833l6UECCfxCpsS41JjB5lkxPdVqyfkNSeUQ9aSHorm6jmgQ3APPGPaJZ2JzS6_n9XY3UJqNj0ltqYTUq53h0FE7wf4F27ApZhKsZ--HfcWOKIUAOLfxfkUDoGmGpnYeX32kUKp0oUJP0XwZjotF7_XgU8mXk8OWbyTKJA9AakZZxONtWtcqXnyXmOStUmyhKXmr2e_L1_LoikCEP2cvFppDcQamlCZJ8d5ndR42ga5_i4\" alt=\"PlantUML diagram\" class=\"plantuml-diagram\">\n<div class=\"note\"><strong>📝 Актуальна версія</strong> <p>OWASP Top 10 оновлюється кожні 3-4 роки. Поточна версія - <strong>OWASP Top 10:2025</strong>.</p>\n</div>\n\n","<h1>💉 A05:2025 Injection - Ін'єкційні атаки</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Ін'єкція (Injection)</strong> - клас вразливостей, при яких зловмисник може впровадити шкідливий код або команди через вхідні дані застосунку.</p>\n</div>\n\n\n\n<h2>🔍 Типи ін'єкцій</h2>\n<table>\n<thead>\n<tr>\n<th>Тип</th>\n<th>Вектор атаки</th>\n<th>Наслідки</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>💾 <strong>SQL Injection</strong></td>\n<td>SQL-запити</td>\n<td>Витік/модифікація БД</td>\n</tr>\n<tr>\n<td>🖥️ <strong>Command Injection</strong></td>\n<td>Системні команди</td>\n<td>Контроль над сервером</td>\n</tr>\n<tr>\n<td>📜 <strong>XSS</strong></td>\n<td>JavaScript-код</td>\n<td>Викрадення сесій</td>\n</tr>\n<tr>\n<td>📂 <strong>Path Traversal</strong></td>\n<td>Шляхи файлової системи</td>\n<td>Доступ до файлів</td>\n</tr>\n<tr>\n<td>🔗 <strong>LDAP Injection</strong></td>\n<td>LDAP-запити</td>\n<td>Обхід автентифікації</td>\n</tr>\n</tbody></table>\n<h2>❌ Вразливий код (SQL Injection)</h2>\n<pre><code class=\"language-typescript hljs\" data-highlighted=\"yes\"><span class=\"hljs-comment\">// 🚫 НЕБЕЗПЕЧНО - конкатенація рядків</span>\n<span class=\"hljs-keyword\">async</span> <span class=\"hljs-keyword\">function</span> <span class=\"hljs-title function_\">getUser</span>(<span class=\"hljs-params\">username: <span class=\"hljs-built_in\">string</span></span>): <span class=\"hljs-title class_\">Promise</span>&lt;<span class=\"hljs-title class_\">User</span> | <span class=\"hljs-literal\">null</span>&gt; {\n  <span class=\"hljs-keyword\">const</span> query = <span class=\"hljs-string\">\"SELECT * FROM users WHERE name = '\"</span> + username + <span class=\"hljs-string\">\"'\"</span>;\n  <span class=\"hljs-keyword\">return</span> <span class=\"hljs-keyword\">await</span> db.<span class=\"hljs-title function_\">query</span>(query);\n}\n\n<span class=\"hljs-comment\">// Атака: username = \"admin' OR '1'='1' --\"</span>\n<span class=\"hljs-comment\">// Результат: SELECT * FROM users WHERE name = 'admin' OR '1'='1' --'</span></code></pre>","<h1>🛡️ Захист від SQL Injection</h1>\n<h2>✅ Безпечний код - параметризовані запити</h2>\n<pre><code class=\"language-typescript hljs\" data-highlighted=\"yes\"><span class=\"hljs-comment\">// ✅ БЕЗПЕЧНО - параметризований запит (Prepared Statement)</span>\n<span class=\"hljs-keyword\">async</span> <span class=\"hljs-keyword\">function</span> <span class=\"hljs-title function_\">getUserSafe</span>(<span class=\"hljs-params\">username: <span class=\"hljs-built_in\">string</span></span>): <span class=\"hljs-title class_\">Promise</span>&lt;<span class=\"hljs-title class_\">User</span> | <span class=\"hljs-literal\">null</span>&gt; {\n  <span class=\"hljs-keyword\">const</span> query = <span class=\"hljs-string\">\"SELECT * FROM users WHERE name = $1\"</span>;\n  <span class=\"hljs-keyword\">return</span> <span class=\"hljs-keyword\">await</span> db.<span class=\"hljs-title function_\">query</span>(query, [username]);\n}\n\n<span class=\"hljs-comment\">// Або з використанням ORM (Prisma)</span>\n<span class=\"hljs-keyword\">async</span> <span class=\"hljs-keyword\">function</span> <span class=\"hljs-title function_\">getUserOrm</span>(<span class=\"hljs-params\">username: <span class=\"hljs-built_in\">string</span></span>): <span class=\"hljs-title class_\">Promise</span>&lt;<span class=\"hljs-title class_\">User</span> | <span class=\"hljs-literal\">null</span>&gt; {\n  <span class=\"hljs-keyword\">return</span> <span class=\"hljs-keyword\">await</span> prisma.<span class=\"hljs-property\">user</span>.<span class=\"hljs-title function_\">findFirst</span>({\n    <span class=\"hljs-attr\">where</span>: { <span class=\"hljs-attr\">name</span>: username }\n  });\n}</code></pre><h2>🔐 Комплексний захист від ін'єкцій</h2>\n\n<div class=\"mermaid\" data-source=\"graph TB\n    subgraph &quot;Багаторівневий захист&quot;\n        A[&quot;🔍 Валідація вводу&lt;br/&gt;(Input Validation)&quot;] --&gt; B[&quot;🧹 Санітизація даних&lt;br/&gt;(Data Sanitization)&quot;]\n        B --&gt; C[&quot;📝 Параметризовані запити&lt;br/&gt;(Prepared Statements)&quot;]\n        C --&gt; D[&quot;👤 Принцип мінімальних привілеїв&lt;br/&gt;(Least Privilege)&quot;]\n        D --&gt; E[&quot;🛡️ WAF&lt;br/&gt;(Web Application Firewall)&quot;]\n    end\n\n    style A fill:#E8F5E9,stroke:#4CAF50\n    style B fill:#E3F2FD,stroke:#2196F3\n    style C fill:#FFF3E0,stroke:#FF9800\n    style D fill:#F3E5F5,stroke:#9C27B0\n    style E fill:#FFEBEE,stroke:#F44336\"><svg id=\"exp-1766518040799-9-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 1517.421875px;\" viewBox=\"0 0 1517.421875 182\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1766518040799-9-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1766518040799-9-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1766518040799-9-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#exp-1766518040799-9-0 .error-icon{fill:#552222;}#exp-1766518040799-9-0 .error-text{fill:#552222;stroke:#552222;}#exp-1766518040799-9-0 .edge-thickness-normal{stroke-width:1px;}#exp-1766518040799-9-0 .edge-thickness-thick{stroke-width:3.5px;}#exp-1766518040799-9-0 .edge-pattern-solid{stroke-dasharray:0;}#exp-1766518040799-9-0 .edge-thickness-invisible{stroke-width:0;fill:none;}#exp-1766518040799-9-0 .edge-pattern-dashed{stroke-dasharray:3;}#exp-1766518040799-9-0 .edge-pattern-dotted{stroke-dasharray:2;}#exp-1766518040799-9-0 .marker{fill:#333333;stroke:#333333;}#exp-1766518040799-9-0 .marker.cross{stroke:#333333;}#exp-1766518040799-9-0 svg{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;}#exp-1766518040799-9-0 p{margin:0;}# 0078125\" y=\"-36\" width=\"236.6015625\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-94.30078125, -24)\"><rect></rect><foreignObject width=\"188.6015625\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>🛡️ WAF<br>(Web Application Firewall)</p></span></div></foreignObject></g></g></g></g></g></g></g></svg></div>\n<div class=\"tip\"><strong>💡 Золоте правило</strong> <p><strong>Ніколи не довіряйте вхідним даним.</strong> Усі дані від користувача потенційно небезпечні та мають проходити валідацію, санітизацію та екранування.</p>\n</div>\n\n","<h1>🌐 XSS - Cross-Site Scripting</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>XSS (Cross-Site Scripting)</strong> - вразливість, що дозволяє зловмиснику впроваджувати шкідливий JavaScript-код у веб-сторінки, які переглядають інші користувачі.</p>\n</div>\n\n\n\n<h2>📊 Типи XSS-атак</h2>\n<table>\n<thead>\n<tr>\n<th>Тип</th>\n<th>Механізм</th>\n<th>Приклад</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>💾 <strong>Stored XSS</strong></td>\n<td>Код зберігається на сервері</td>\n<td>Коментар з <code>&lt;script&gt;</code></td>\n</tr>\n<tr>\n<td>🔄 <strong>Reflected XSS</strong></td>\n<td>Код у параметрах URL</td>\n<td><code>?search=&lt;script&gt;alert(1)&lt;/script&gt;</code></td>\n</tr>\n<tr>\n<td>🖥️ <strong>DOM-based XSS</strong></td>\n<td>Маніпуляція DOM на клієнті</td>\n<td>Вразливий JavaScript</td>\n</tr>\n</tbody></table>\n<h2>❌ Вразливий код</h2>\n<pre><code class=\"language-javascript hljs\" data-highlighted=\"yes\"><span class=\"hljs-comment\">// 🚫 НЕБЕЗПЕЧНО - пряме вставлення HTML</span>\n<span class=\"hljs-variable language_\">document</span>.<span class=\"hljs-title function_\">getElementById</span>(<span class=\"hljs-string\">'output'</span>).<span class=\"hljs-property\">innerHTML</span> = userInput;\n\n<span class=\"hljs-comment\">// 🚫 НЕБЕЗПЕЧНО - React з dangerouslySetInnerHTML</span>\n<span class=\"language-xml\"><span class=\"hljs-tag\">&lt;<span class=\"hljs-name\">div</span> <span class=\"hljs-attr\">dangerouslySetInnerHTML</span>=<span class=\"hljs-string\">{{__html:</span> <span class=\"hljs-attr\">userInput</span>}} /&gt;</span></span></code></pre><h2>✅ Безпечний код</h2>\n<pre><code class=\"language-javascript hljs\" data-highlighted=\"yes\"><span class=\"hljs-comment\">// ✅ БЕЗПЕЧНО - текстовий контент замість HTML</span>\n<span class=\"hljs-variable language_\">document</span>.<span class=\"hljs-title function_\">getElementById</span>(<span class=\"hljs-string\">'output'</span>).<span class=\"hljs-property\">textContent</span> = userInput;\n\n<span class=\"hljs-comment\">// ✅ БЕЗПЕЧНО - React автоматично екранує</span>\n<span class=\"language-xml\"><span class=\"hljs-tag\">&lt;<span class=\"hljs-name\">div</span>&gt;</span>{userInput}<span class=\"hljs-tag\">&lt;/<span class=\"hljs-name\">div</span>&gt;</span></span></code></pre><div class=\"warning\"><strong>⚠️ Наслідки XSS</strong> <p>Викрадення cookies та сесій, перенаправлення на фішингові сайти, модифікація вмісту сторінки, keylogging, криптомайнінг у браузері.</p>\n</div>\n\n","<h1>🔐 Безпечна автентифікація та управління сесіями</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Автентифікація (Authentication)</strong> - процес підтвердження ідентичності користувача. <strong>Авторизація (Authorization)</strong> - процес визначення прав доступу автентифікованого користувача.</p>\n</div>\n\n\n\n<h2>🔑 Фактори автентифікації</h2>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    subgraph &quot;Багатофакторна автентифікація (MFA)&quot;\n        A[&quot;🧠 **Знання**&lt;br/&gt;Пароль, PIN&quot;]\n        B[&quot;📱 **Володіння**&lt;br/&gt;Телефон, токен&quot;]\n        C[&quot;👆 **Біометрія**&lt;br/&gt;Відбиток, обличчя&quot;]\n    end\n\n    style A fill:#E3F2FD,stroke:#2196F3\n    style B fill:#E8F5E9,stroke:#4 eignObject></g></g></g></g></g></g></g></svg></div>\n<h2>🔒 Безпечне зберігання паролів</h2>\n<table>\n<thead>\n<tr>\n<th>Підхід</th>\n<th>Безпека</th>\n<th>Рекомендація</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🚫 Відкритий текст</td>\n<td>Критично небезпечно</td>\n<td>Ніколи</td>\n</tr>\n<tr>\n<td>🚫 MD5/SHA-1</td>\n<td>Небезпечно (rainbow tables)</td>\n<td>Ніколи</td>\n</tr>\n<tr>\n<td>⚠️ SHA-256 без солі</td>\n<td>Вразливо</td>\n<td>Не рекомендовано</td>\n</tr>\n<tr>\n<td>✅ bcrypt/scrypt/Argon2</td>\n<td>Безпечно</td>\n<td><strong>Рекомендовано</strong></td>\n</tr>\n</tbody></table>\n<pre><code class=\"language-typescript hljs\" data-highlighted=\"yes\"><span class=\"hljs-comment\">// ✅ Безпечне хешування пароля з bcrypt</span>\n<span class=\"hljs-keyword\">import</span> bcrypt <span class=\"hljs-keyword\">from</span> <span class=\"hljs-string\">'bcrypt'</span>;\n\n<span class=\"hljs-keyword\">async</span> <span class=\"hljs-keyword\">function</span> <span class=\"hljs-title function_\">hashPassword</span>(<span class=\"hljs-params\">password: <span class=\"hljs-built_in\">string</span></span>): <span class=\"hljs-title class_\">Promise</span>&lt;<span class=\"hljs-built_in\">string</span>&gt; {\n  <span class=\"hljs-keyword\">const</span> saltRounds = <span class=\"hljs-number\">12</span>; <span class=\"hljs-comment\">// Коефіцієнт складності</span>\n  <span class=\"hljs-keyword\">return</span> <span class=\"hljs-keyword\">await</span> bcrypt.<span class=\"hljs-title function_\">hash</span>(password, saltRounds);\n}\n\n<span class=\"hljs-keyword\">async</span> <span class=\"hljs-keyword\">function</span> <span class=\"hljs-title function_\">verifyPassword</span>(<span class=\"hljs-params\">password: <span class=\"hljs-built_in\">string</span>, hash: <span class=\"hljs-built_in\">string</span></span>): <span class=\"hljs-title class_\">Promise</span>&lt;<span class=\"hljs-built_in\">boolean</span>&gt; {\n  <span class=\"hljs-keyword\">return</span> <span class=\"hljs-keyword\">await</span> bcrypt.<span class=\"hljs-title function_\">compare</span>(password, hash);\n}</code></pre>","<h1>🛡️ SDL - Secure Development Lifecycle</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>SDL (Secure Development Lifecycle)</strong> - методологія розробки ПЗ, що інтегрує практики безпеки на кожному етапі життєвого циклу розробки, від планування до виведення з експлуатації.</p>\n</div>\n\n\n\n\n<img src=\"https://www.plantuml.com/plantuml/svg/PPFFRjD04CRl-nHBEN2XLI6Ae1ogflKwhPGshkCM8VbYugsxQZ8kwms8MniahfKGVuuWdY0K8KAWuHLctuXP9xInAalUiRxTdx_vnjueJABDeDzZTr9vf43oravpEzfi7GX-LzJyXxvNLPgX47iaFVRhOgqgjSF6NfEE-RvV4wjLBJW8WvRJQgBkrwjQA3ntI6mAKHMUYLQh_RG4Uk8HOyM9WjD49tt-FEcUP3eVGBgLzt9DMnhkMjWn5pL8pH-iCgPbroIGzIHVmdSunZyunUyuZg4ZkmEjp6iUoXS3fMLVWYbYY8wrJ0pVpLFPKv0jyQJWeTY_YQT2_6pFS6hVuyGExHkyn15UuPMzcDCbR-ZkiJ9qW1vYy6IXCg0NlbJoLKdsH6SXtWhw2ndzwV3u3ISukaPkvIdvYe5MMKKTBewZmlgAF-pvBOkDJdIVUtIF8P0WZKwCoe57iZ3_Euz49reSv6s75ERKdjdX3NSxqQc4kKSuKjbW1fwx31PdNE5ze1ZFyI_-9fyZHxHlxKT7tCr1cLoNo1teAi8RQhqupQ6G9ROTTAw_ASRSl9QNrrswp2Kygm-PYyZLhYjMjZPJ0kPikPeupB5MLjRBgJ_X-8aocvPZ7bA7O_p5gUdBU_Q2bYbE6DkGaDAFz0y0\" alt=\"PlantUML diagram\" class=\"plantuml-diagram\">\n<div class=\"success\"><strong>✅ Microsoft SDL</strong> <p>Microsoft впровадила SDL у 2004 році після масових вірусних атак на Windows. Результат: кількість критичних вразливостей у Windows Vista знизилась на 45% порівняно з Windows XP.</p>\n</div>\n\n","<h1>🔍 SAST vs DAST - методи тестування безпеки</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>SAST (Static Application Security Testing)</strong> - аналіз безпеки вихідного коду без його виконання.<br><strong>DAST (Dynamic Application Security Testing)</strong> - тестування безпеки працюючого застосунку.</p>\n</div>\n\n\n\n<h2>📊 Порівняння підходів</h2>\n<table>\n<thead>\n<tr>\n<th>Характеристика</th>\n<th>🔬 SAST</th>\n<th>🌐 DAST</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Етап застосування</strong></td>\n<td>Розробка</td>\n<td>Тестування/Продакшн</td>\n</tr>\n<tr>\n<td><strong>Що аналізує</strong></td>\n<td>Вихідний код</td>\n<td>Працюючий застосунок</td>\n</tr>\n<tr>\n<td><strong>Швидкість</strong></td>\n<td>Швидко</td>\n<td>Повільніше</td>\n</tr>\n<tr>\n<td><strong>False Positives</strong></td>\n<td>Більше</td>\n<td>Менше</td>\n</tr>\n<tr>\n<td><strong>Покриття коду</strong></td>\n<td>100% коду</td>\n<td>Тільки доступні endpoints</td>\n</tr>\n<tr>\n<td><strong>Знання архітектури</strong></td>\n<td>Потрібне</td>\n<td>Не потрібне</td>\n</tr>\n<tr>\n<td><strong>Приклади інструментів</strong></td>\n<td>SonarQube, Checkmarx, Semgrep</td>\n<td>OWASP ZAP, Burp Suite, Nikto</td>\n</tr>\n</tbody></table>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    subgraph &quot;CI/CD Pipeline з безпекою&quot;\n        A[&quot;📝 Commit&quot;] --&gt; B[&quot;🔬 SAST&quot;]\n        B --&gt; C[&quot;🏗️ Build&quot;]\n        C --&gt; D[&quot;🌐 DAST&quot;]\n        D --&gt; E[&quot;🚀 Deploy&quot;]\n    end\n\n    style A fill:#E3F2FD,stroke:#2196F3\n    style B fill:#FFEBEE,stroke:#F44336\n    style C fill:#E8F5E9,stroke:#4CAF50\n    style D fill:#FFEBEE,stroke:#F44336\n    style E fill:#FFF3E0,stroke:#FF9800\"><svg id=\"exp-1766518040834-13-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 218.1484375px;\" viewBox=\"0 0 218.1484375 631\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1766518040834-13-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1766518040834-13-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1766518040834-13-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-lineca <foreignObject width=\"56.3046875\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>🏗️ Build</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"flowchart-D-5\" transform=\"translate(105.4140625, 438.5)\"><rect class=\"basic label-container\" style=\"fill:#FFEBEE !important;stroke:#F44336 !important\" x=\"-54.56640625\" y=\"-24\" width=\"109.1328125\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-30.56640625, -12)\"><rect></rect><foreignObject width=\"61.1328125\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>🌐 DAST</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"flowchart-E-7\" transform=\"translate(105.4140625, 561.5)\"><rect class=\"basic label-container\" style=\"fill:#FFF3E0 !important;stroke:#FF9800 !important\" x=\"-59.359375\" y=\"-24\" width=\"118.71875\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-35.359375, -12)\"><rect></rect><foreignObject width=\"70.71875\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>🚀 Deploy</p></span></div></foreignObject></g></g></g></g></g></g></g></svg></div>\n<div class=\"tip\"><strong>💡 DevSecOps</strong> <p>Інтеграція SAST/DAST у CI/CD pipeline - основа підходу <strong>DevSecOps</strong>, що забезпечує безперервну перевірку безпеки на кожному етапі розробки.</p>\n</div>\n\n","<h1>🏗️ Принципи безпечного проєктування</h1>\n<div class=\"info\"><strong>ℹ️ Головна ідея</strong> <p>Безпечна архітектура базується на перевірених принципах, що мінімізують поверхню атаки та обмежують наслідки потенційного компрометування.</p>\n</div>\n\n\n\n<h2>🎯 Ключові принципи</h2>\n<table>\n<thead>\n<tr>\n<th>Принцип</th>\n<th>Опис</th>\n<th>Приклад</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🔒 <strong>Least Privilege</strong></td>\n<td>Мінімально необхідні права</td>\n<td>Сервіс має доступ тільки до своєї БД</td>\n</tr>\n<tr>\n<td>🛡️ <strong>Defense in Depth</strong></td>\n<td>Багаторівневий захист</td>\n<td>Firewall + WAF + AppSec + DB Security</td>\n</tr>\n<tr>\n<td>🚫 <strong>Fail Secure</strong></td>\n<td>Безпечна поведінка при збоях</td>\n<td>Відмова в доступі при помилці</td>\n</tr>\n<tr>\n<td>🔍 <strong>Complete Mediation</strong></td>\n<td>Перевірка кожного запиту</td>\n<td>Валідація на кожному рівні</td>\n</tr>\n<tr>\n<td>📦 <strong>Separation of Concerns</strong></td>\n<td>Ізоляція компонентів</td>\n<td>Мікросервісна архітектура</td>\n</tr>\n<tr>\n<td>🤫 <strong>Economy of Mechanism</strong></td>\n<td>Простота реалізації</td>\n<td>Менше коду = менше вразливостей</td>\n</tr>\n</tbody></table>\n<div class=\"warning\"><strong>⚠️ Антипатерн: Security by Obscurity</strong> <p>Приховування деталей реалізації НЕ є надійним захистом. Безпека має базуватися на криптографічних примітивах та перевірених механізмах, а не на секретності алгоритмів.</p>\n</div>\n\n","<h1>🔐 Принцип Defense in Depth</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Defense in Depth (Ешелонований захист)</strong> - стратегія безпеки, що передбачає використання множинних рівнів захисту, де кожен рівень забезпечує резервний захист у разі компрометації іншого.</p>\n</div>\n\n\n\n\n<img src=\"https://www.plantuml.com/plantuml/svg/NL9DRzGm4BtxLmpbcWfe6WaueAQDlRlIgbrjA5noCOaRh6R7AySBujQFlu3QIoLkd5U8ebMX_GtEFsAoAz44MR97UlEUtpnxhtRIkiMiOayATQ9HmNWq6BxT7nzpUCf3iIEIFZAOSdv8q4iHyLTzw6WQ7mw89eG8-VC-DZcUJiOj5l98H7riofEMnFSvPwm-rJYNLixWWynFIsiMM1oOobXgYTl5c5MvarXM2hRyDt_RdFcL_qFdHNEMeT1MVPPL5K2Ic1GcrZXgrmQtGDOmVl4uNq_dPgrpwt_vPOQZ97qscgG1fAgSANJoaR_JIQ4hC3Irop16fpzfkwW3E4fXA6sXK6EveORTb7gNN_jbSzvS-0VQB_szV_1t6RwFHG0Zd2ySl9ELBZecThkPzfI--gM_Rwuov9ZRB_EM4a2SvwgkuS2WiwRQI4J_ecUCGjdUVaEpCHflNOMCtAwhNKQthQk8CQGimUhoemDpqcRv6iZxR_BxWnvWrPoJzvM_-xylQlk-DrU4aZVmFpSc6TjJMD3N-mi0\" alt=\"PlantUML diagram\" class=\"plantuml-diagram\">\n<div class=\"success\"><strong>✅ Приклад з практики</strong> <p><strong>Netflix</strong> використовує концепцію \"Chaos Engineering\" та Defense in Depth: навіть якщо один із захисних механізмів відмовить, інші рівні продовжують захищати систему. Їхній інструмент Chaos Monkey навмисно \"вбиває\" сервіси для перевірки стійкості.</p>\n</div>\n\n","<h1>💼 Case Study: Equifax Data Breach (2017)</h1>\n<div class=\"danger\"><strong>🚫 Критичний інцидент</strong> <p>У 2017 році кредитне бюро <strong>Equifax</strong> зазнало витоку персональних даних <strong>147 мільйонів</strong> американців через невиправлену вразливість Apache Struts.</p>\n</div>\n\n\n\n<h2>📋 Хронологія інциденту</h2>\n<table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Подія</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🔴 Березень 2017</td>\n<td>Apache випустив патч для CVE-2017-5638</td>\n</tr>\n<tr>\n<td>🟡 Травень 2017</td>\n<td>Equifax не встановив патч</td>\n</tr>\n<tr>\n<td>🔴 Травень-Липень</td>\n<td>Зловмисники експлуатували вразливість</td>\n</tr>\n<tr>\n<td>🟠 29 Липня</td>\n<td>Виявлено підозрілу активність</td>\n</tr>\n<tr>\n<td>⚫ 7 Вересня</td>\n<td>Публічне оголошення про витік</td>\n</tr>\n</tbody></table>\n<h2>📊 Наслідки</h2>\n<table>\n<thead>\n<tr>\n<th>Категорія</th>\n<th>Вплив</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>👥 Постраждалі</td>\n<td>147 млн осіб</td>\n</tr>\n<tr>\n<td>💰 Фінансові втрати</td>\n<td>$1.4 млрд (штрафи + компенсації)</td>\n</tr>\n<tr>\n<td>📉 Падіння акцій</td>\n<td>35% за тиждень</td>\n</tr>\n<tr>\n<td>👔 Кадрові наслідки</td>\n<td>CEO, CIO, CSO звільнені</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Уроки</strong> <ol>\n<li><strong>Patch Management</strong> - критично важливий</li>\n<li>Інвентаризація активів та залежностей</li>\n<li>Моніторинг аномальної активності</li>\n<li>План реагування на інциденти (Incident Response Plan)</li>\n</ol>\n</div>\n\n","<h1>🔧 Інструменти безпеки розробника</h1>\n<h2>🛠️ Категорії інструментів</h2>\n\n<div class=\"mermaid\" data-source=\"graph TB\n    subgraph &quot;Інструментарій безпеки&quot;\n        A[&quot;🔬 **SAST**&lt;br/&gt;SonarQube, Semgrep&lt;br/&gt;CodeQL, Checkmarx&quot;]\n        B[&quot;🌐 **DAST**&lt;br/&gt;OWASP ZAP, Burp Suite&lt;br/&gt;Nikto, Nuclei&quot;]\n        C[&quot;📦 **SCA**&lt;br/&gt;Dependabot, Snyk&lt;br/&gt;OWASP Dependency-Check&quot;]\n        D[&quot;🔐 **Secrets Scanning**&lt;br/&gt;GitLeaks, TruffleHog&lt;br/&gt;git-secrets&quot;]\n        E[&quot;🐳 **Container Security**&lt;br/&gt;Trivy, Clair&lt;br/&gt;Anchore&quot;]\n    end\n\n    style A fill:#E3F2FD,stroke:#2196F3\n    style B fill:#E8F5E9,stroke:#4CAF50\n    style C fill:#FFF3E0,stroke:#FF9800\n    style D fill:#F3E5F5,stroke:#9C27B0\n    style E fill:#FFEBEE,stroke:#F44336\"><svg id=\"exp-1766518040842-17-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 339px;\" viewBox=\"0 0 339 790\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1766518040842-17-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1766518040842-17-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1766518040842-17-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#exp-1766518040842-17-0 .error-icon{fill:#552222;}#exp-1766518040842-17-0 .error-text{fill:#552222;stroke:#552222;}#exp-1766518040842-17-0 .edge-thickness-normal{stroke-width:1px;}#exp-1766518040842-17-0 .edge-thickness-thick{stro enter;\"><span class=\"nodeLabel \"><p>🐳 <strong>Container Security</strong><br>Trivy, Clair<br>Anchore</p></span></div></foreignObject></g></g></g></g></g></g></g></svg></div>\n<div class=\"info\"><strong>ℹ️ SCA</strong> <p><strong>SCA (Software Composition Analysis)</strong> - аналіз сторонніх залежностей (бібліотек, фреймворків) на наявність відомих вразливостей.</p>\n</div>\n\n\n\n<h2>📊 Безкоштовні інструменти для студентів</h2>\n<table>\n<thead>\n<tr>\n<th>Інструмент</th>\n<th>Призначення</th>\n<th>Ліцензія</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🔍 <strong>OWASP ZAP</strong></td>\n<td>DAST, сканування веб-застосунків</td>\n<td>Open Source</td>\n</tr>\n<tr>\n<td>📝 <strong>Semgrep</strong></td>\n<td>SAST, пошук патернів у коді</td>\n<td>Open Source</td>\n</tr>\n<tr>\n<td>🐙 <strong>GitHub Advanced Security</strong></td>\n<td>SAST, SCA, Secrets</td>\n<td>Безкоштовно для public repos</td>\n</tr>\n<tr>\n<td>🐋 <strong>Trivy</strong></td>\n<td>Сканування контейнерів</td>\n<td>Open Source</td>\n</tr>\n</tbody></table>\n","<h1>📝 Чекліст безпечної розробки</h1>\n<div class=\"tip\"><strong>💡 Практичний чекліст</strong> <p>Використовуйте цей чекліст на кожному етапі розробки для забезпечення базового рівня безпеки.</p>\n</div>\n\n\n\n<h2>✅ Вхідні дані</h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 🔍 Валідація всіх вхідних даних (whitelist &gt; blacklist)</li>\n<li><input disabled=\"\" type=\"checkbox\"> 🧹 Санітизація даних перед використанням</li>\n<li><input disabled=\"\" type=\"checkbox\"> 📏 Обмеження довжини та типу даних</li>\n<li><input disabled=\"\" type=\"checkbox\"> 🔢 Параметризовані запити для БД</li>\n</ul>\n<h2>✅ Автентифікація та сесії</h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 🔐 Хешування паролів (bcrypt/Argon2)</li>\n<li><input disabled=\"\" type=\"checkbox\"> 📱 Підтримка MFA</li>\n<li><input disabled=\"\" type=\"checkbox\"> ⏱️ Таймаут сесій</li>\n<li><input disabled=\"\" type=\"checkbox\"> 🍪 Secure, HttpOnly, SameSite cookies</li>\n</ul>\n<h2>✅ Криптографія</h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 🔒 TLS 1.3 для всіх з'єднань</li>\n<li><input disabled=\"\" type=\"checkbox\"> 🔑 Сучасні алгоритми (AES-256, RSA-2048+)</li>\n<li><input disabled=\"\" type=\"checkbox\"> 🎲 Криптографічно стійкий ГПВЧ</li>\n<li><input disabled=\"\" type=\"checkbox\"> 🗄️ Безпечне зберігання ключів (HSM, Vault)</li>\n</ul>\n<h2>✅ Логування та моніторинг</h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 📊 Логування security-подій</li>\n<li><input disabled=\"\" type=\"checkbox\"> 🚫 Без чутливих даних у логах</li>\n<li><input disabled=\"\" type=\"checkbox\"> 🔔 Алерти на аномалії</li>\n</ul>\n","<h1>🎯 Найкращі практики безпечного кодування</h1>\n<div class=\"info\"><strong>ℹ️ Головна ідея</strong> <p>Безпечний код - це код, що написаний з урахуванням потенційних загроз та дотриманням перевірених практик на рівні архітектури, дизайну та імплементації.</p>\n</div>\n\n\n\n<h2>🏆 Top-10 практик</h2>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>Практика</th>\n<th>Приклад реалізації</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>🛡️ <strong>Валідація вводу</strong></td>\n<td>Whitelist, регулярні вирази</td>\n</tr>\n<tr>\n<td>2</td>\n<td>🔐 <strong>Параметризовані запити</strong></td>\n<td>Prepared Statements, ORM</td>\n</tr>\n<tr>\n<td>3</td>\n<td>🔒 <strong>Безпечні налаштування за замовчуванням</strong></td>\n<td>Deny by default</td>\n</tr>\n<tr>\n<td>4</td>\n<td>🔑 <strong>Безпечне управління секретами</strong></td>\n<td>Environment variables, Vault</td>\n</tr>\n<tr>\n<td>5</td>\n<td>📝 <strong>Правильне логування</strong></td>\n<td>Без паролів та PII у логах</td>\n</tr>\n<tr>\n<td>6</td>\n<td>⚠️ <strong>Безпечна обробка помилок</strong></td>\n<td>Загальні повідомлення користувачу</td>\n</tr>\n<tr>\n<td>7</td>\n<td>🔄 <strong>Оновлення залежностей</strong></td>\n<td>Dependabot, регулярний аудит</td>\n</tr>\n<tr>\n<td>8</td>\n<td>🧪 <strong>Security тестування</strong></td>\n<td>SAST/DAST у CI/CD</td>\n</tr>\n<tr>\n<td>9</td>\n<td>📖 <strong>Code Review з фокусом на безпеку</strong></td>\n<td>Security champions</td>\n</tr>\n<tr>\n<td>10</td>\n<td>📚 <strong>Навчання команди</strong></td>\n<td>OWASP, secure coding guidelines</td>\n</tr>\n</tbody></table>\n<div class=\"warning\"><strong>⚠️ Помилка новачків</strong> <p>Обробка помилок не повинна розкривати деталі реалізації: <code>Error: Connection to MySQL server at 192.168.1.100:3306 failed</code> - інформація для зловмисника.</p>\n</div>\n\n","<h1>🎓 Висновки</h1>\n<h2>📌 Ключові тези лекції</h2>\n<div class=\"success\"><strong>✅ Що варто запам'ятати</strong> <ol>\n<li><strong>CIA Triad</strong> - фундамент безпеки: Конфіденційність, Цілісність, Доступність</li>\n<li><strong>OWASP Top 10</strong> - must-know для кожного розробника</li>\n<li><strong>Security by Design</strong> - безпека закладається на етапі проєктування</li>\n<li><strong>Defense in Depth</strong> - багаторівневий захист критично важливий</li>\n<li><strong>Ніколи не довіряйте вхідним даним</strong> - валідація обов'язкова</li>\n</ol>\n</div>\n\n\n\n<h2>🔄 Безпека як процес</h2>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    A[&quot;📋 Планування&quot;] --&gt; B[&quot;🛠️ Реалізація&quot;]\n    B --&gt; C[&quot;🔍 Перевірка&quot;]\n    C --&gt; D[&quot;🔧 Покращення&quot;]\n    D --&gt; A\n\n    style A fill:#E3F2FD,stroke:#2196F3\n    style B fill:#E8F5E9,stroke:#4CAF50\n    style C fill:#FFF3E0,stroke:#FF9800\n    style D fill:#F3E5F5,stroke:#9C27B0\"><svg id=\"exp-1766518040847-20-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 782.375px;\" viewBox=\"0 0 782.375 99\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1766518040847-20-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1766518040847-20-0 .edge-anima \n<tr>\n<td><strong>SDL</strong></td>\n<td>Secure Development Lifecycle - безпечний життєвий цикл розробки</td>\n</tr>\n<tr>\n<td><strong>WAF</strong></td>\n<td>Web Application Firewall - міжмережевий екран веб-застосунків</td>\n</tr>\n<tr>\n<td><strong>TLS</strong></td>\n<td>Transport Layer Security - протокол захисту з'єднань</td>\n</tr>\n</tbody></table>\n"];let currentSlideIndex=0;
function showSlide(i){if(i<0||i>=slides.length)return;currentSlideIndex=i;const el=document.getElementById("current-slide");el.innerHTML=slides[i];el.scrollTop=0;document.getElementById("progress-bar").style.width=((i+1)/slides.length*100)+"%";document.getElementById("slide-number").textContent=(i+1)+" / "+slides.length;updateSidebarActive();}
function nextSlide(){if(currentSlideIndex<slides.length-1)showSlide(currentSlideIndex+1);}
function previousSlide(){if(currentSlideIndex>0)showSlide(currentSlideIndex-1);}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open");}
function toggleHelp(){document.getElementById("help-overlay").classList.toggle("hidden");}
function toggleFullscreen(){if(!document.fullscreenElement){const pc=document.getElementById("presentation-container");if(pc.requestFullscreen)pc.requestFullscreen();else if(pc.webkitRequestFullscreen)pc.webkitRequestFullscreen();else if(pc.msRequestFullscreen)pc.msRequestFullscreen();else if(pc.mozRequestFullScreen)pc.mozRequestFullScreen();}else{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();else if(document.msExitFullscreen)document.msExitFullscreen();else if(document.mozCancelFullScreen)document.mozCancelFullScreen();}}
function generateSidebar(){const sc=document.getElementById("sidebar-content");sc.innerHTML="";slides.forEach((html,idx)=>{const t=document.createElement("div");t.className="slide-thumbnail";if(idx===0)t.classList.add("active");const tmp=document.createElement("div");tmp.innerHTML=html;const title=tmp.querySelector("h1,h2");const titleText=title?title.textContent:("Слайд "+(idx+1));const textContent=tmp.textContent.replace(/s+/g," ").trim();const preview=textContent.substring(0,100)+(textContent.length>100?"...":"");t.innerHTML="<div class=\"slide-thumbnail-number\">"+(idx+1)+"</div><div class=\"slide-thumbnail-title\">"+titleText+"</div><div class=\"slide-thumbnail-content\">"+preview+"</div>";t.onclick=()=>{showSlide(idx);if(window.innerWidth<1024)toggleSidebar();};sc.appendChild(t);});}
function updateSidebarActive(){document.querySelectorAll(".slide-thumbnail").forEach((th,idx)=>{if(idx===currentSlideIndex){th.classList.add("active");th.scrollIntoView({behavior:"smooth",block:"nearest"});}else th.classList.remove("active");});}
document.addEventListener("keydown",e=>{switch(e.key){case"ArrowLeft":previousSlide();break;case"ArrowRight":case" ":e.preventDefault();nextSlide();break;case"f":case"F":toggleFullscreen();break;case"s":case"S":toggleSidebar();break;case"?":toggleHelp();break;case"Escape":const sb=document.getElementById("sidebar");const ho=document.getElementById("help-overlay");if(sb.classList.contains("open"))toggleSidebar();else if(!ho.classList.contains("hidden"))ho.classList.add("hidden");break;}});
generateSidebar();showSlide(0);</script></body></html>
