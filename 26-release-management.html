ss=\"tip\"><strong>💡 Коли використовувати</strong> <p>Підходить для <strong>dev/staging середовищ</strong> або систем з запланованими вікнами обслуговування.</p>\n</div>\n\n","<h1>🔵🟢 Blue-Green Deployment</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Blue-Green Deployment</strong> — стратегія з двома ідентичними середовищами, де одне активне (обслуговує трафік), інше — неактивне (готується до оновлення).</p>\n</div>\n\n\n\n\n<img src=\"https://www.plantuml.com/plantuml/svg/TPBDIiD058NtynJNTAEB5bEqZIvAapPnuqxSkPaaOorDPifaKX4Hj29kXBgGBaJfAuXGwCO-m-GLV05z12Vf3_snX8GxSxuvvyubrKXWBk8mG5lYWeG4sW5kKXIrchIDEGx1nLwhmLbC_HeB68USOwVF0k6niCqeeS9QHMt3sNECVr76VSAds7xThDl51GnppYwdOjanQaOT8IzWiG_Qx-3f6KuZmYCDS0HnMcKz7TXbDBS7xVkr_pFgmJ73FbWumDGZF3iHk7CSSU89J1i10SqAOW8sxJGvew5oo5WttSoPThtaw72D01O2EdfXTmBfcuGYkbdAEEA4qBMGHhQRCotRgfNMKefJiuQ-ISXI9dF8volgVaXTCQsoxW_LADuUmFH4iqEqL2eKAjFCLEkDqZ6Tg1Pzzqf3Y391m6L2i13O-Sn33kGuwQhtKNx93v2VSfZS9dT9F-cjdfXPotSvLjmoV4QtbSrGBRh9VVAYla-gxkqWL2NKLt_X7m00\" alt=\"PlantUML diagram\" class=\"plantuml-diagram\">\n<div class=\"success\"><strong>✅ Netflix</strong> <p>Netflix використовує Blue-Green для деплойменту мікросервісів, забезпечуючи <strong>zero-downtime</strong> оновлення для 200+ млн користувачів.</p>\n</div>\n\n","<h1>🐦 Canary Deployment</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Canary Deployment</strong> — поступове розгортання нової версії на невелику частину інфраструктури з моніторингом метрик перед повним релізом.</p>\n</div>\n\n\n\n<p><strong>Походження назви:</strong> Термін походить від практики використання канарок у шахтах для раннього виявлення небезпечних газів.</p>\n\n<div class=\"mermaid\" data-source=\"%%{init: {'theme': 'base', 'themeVariables': { 'primaryColor': '#e8f4f8', 'primaryTextColor': '#2c3e50', 'primaryBorderColor': '#5dade2', 'lineColor': '#7f8c8d'}}}%%\ngraph TB\n    subgraph &quot;📊 Поступове розгортання&quot;\n        A[🚀 Старт: 5%] --&gt; B[📈 Аналіз метрик]\n gn: center;\"><span class=\"nodeLabel \"><p>🐛 Bug fixes<br>Виправлення помилок</p></span></div></foreignObject></g></g></g></g></g></svg></div>\n<h2>📋 Приклади версій</h2>\n<pre><code class=\"language-plaintext hljs\" data-highlighted=\"yes\">1.0.0      → Перший стабільний реліз\n1.0.1      → Виправлення бага (backward compatible)\n1.1.0      → Нова функція (backward compatible)\n2.0.0      → Breaking change в API\n2.0.0-beta → Передрелізна версія\n2.0.0+build.123 → Build metadata</code></pre>","<h1>🎛️ Feature Flags</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Feature Flags (Feature Toggles)</strong> — техніка, що дозволяє вмикати/вимикати функціонал без зміни коду чи повторного деплойменту.</p>\n</div>\n\n\n\n<pre><code class=\"language-javascript hljs\" data-highlighted=\"yes\"><span class=\"hljs-comment\">// 💡 Приклад використання Feature Flag</span>\n<span class=\"hljs-keyword\">const</span> featureFlags = {\n  <span class=\"hljs-attr\">newCheckout</span>: <span class=\"hljs-literal\">true</span>,\n  <span class=\"hljs-attr\">darkMode</span>: <span class=\"hljs-literal\">false</span>,\n  <span class=\"hljs-attr\">aiRecommendations</span>: <span class=\"hljs-string\">'beta_users'</span>\n};\n\n<span class=\"hljs-keyword\">function</span> <span class=\"hljs-title function_\">renderCheckout</span>(<span class=\"hljs-params\"></span>) {\n  <span class=\"hljs-keyword\">if</span> (featureFlags.<span class=\"hljs-property\">newCheckout</span>) {\n    <span class=\"hljs-keyword\">return</span> <span class=\"language-xml\"><span class=\"hljs-tag\">&lt;<span class=\"hljs-name\">NewCheckoutFlow</span> /&gt;</span></span>;\n  }\n  <span class=\"hljs-keyword\">return</span> <span class=\"language-xml\"><span class=\"hljs-tag\">&lt;<span class=\"hljs-name\">LegacyCheckout</span> /&gt;</span></span>;\n}</code></pre><h2>🏷️ Типи Feature Flags</h2>\n<table>\n<thead>\n<tr>\n<th>Тип</th>\n<th>Тривалість</th>\n<th>Приклад</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🚀 <strong>Release</strong></td>\n<td>Короткочасні</td>\n<td>Поступовий rollout</td>\n</tr>\n<tr>\n<td>🧪 <strong>Experiment</strong></td>\n<td>Тимчасові</td>\n<td>A/B тести</td>\n</tr>\n<tr>\n<td>⚙️ <strong>Ops</strong></td>\n<td>Постійні</td>\n<td>Kill switch</td>\n</tr>\n<tr>\n<td>🎫 <strong>Permission</strong></td>\n<td>Постійні</td>\n<td>Premium features</td>\n</tr>\n</tbody></table>\n<div class=\"success\"><strong>✅ Amazon</strong> <p>Amazon виконує деплоймент <strong>кожні 11.7 секунди</strong> завдяки масивному використанню feature flags.</p>\n</div>\n\n","<h1>🛠️ CI/CD Pipeline для деплойменту</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>CI/CD (Continuous Integration / Continuous Delivery)</strong> — практика автоматизації збірки, тестування та доставки програмного забезпечення.</p>\n</div>\n\n\n\n\n<img src=\"https://www.plantuml.com/plantuml/svg/ZPBBJi9058RtynJ7kC6jqKXWuOMB2nUQ61-WGeK6w91fqRZ3IuokT65mIV09Ye9S57o5Cs_aFuKgA0lJfktC-Szt_dEcMvvlARzMAOiblsXNRAgMBSSLNibngvQoAdHivKe59MjkFYNBKj5oDcEk6OMLyvrJnp_V-QtCnBDhsVWYfLHvMqrLw-djT6PrLgMKF9i6DxBnL3mjHEXI97OTdmvgNZ4f4lp4RTtGTHvoWEMHYv2-vAw-mBDl10yyue3VTODx1DMOE_egAOHpGZ5-ZeJ4ds2CUQ1l-Ptxcok4CRWKGopWuOeWId0BYnSUGzS5SgJlYGDT3ujT6vM-D62ZdF54QPahsOh0RcCdu5uaUWJc4yLGb8n5ElIjWkCM9j4R502PNqsIle7x0NOQSxqHuJPzJ3DfVs-1SKDh8hyJsk-2r-6tg8NaLF37p86I-HhEIRgHf1dcTldbkxLmPZ27pHwW0GgCC1-uqur9bkVBAZxiicTZsl0V6MgXsZX4tVrCqnpE1soF0ElF0zoySoBcCV-5X8W9G6pXZP_y2m00\" alt=\"PlantUML diagram\" class=\"plantuml-diagram\">\n","<h1>🔙 Rollback стратегії</h1>\n<div class=\"warning\"><strong>⚠️ Золоте правило</strong> <p><strong>Завжди майте план відкату!</strong> Жоден деплоймент не повинен відбуватись без перевіреної rollback процедури.</p>\n</div>\n\n\n\n<h2>📋 Типи rollback</h2>\n\n<div class=\"mermaid\" data-source=\"%%{init: {'theme': 'base', 'themeVariables': { 'primaryColor': '#e8f4f8', 'primaryTextColor': '#2c3e50'}}}%%\nflowchart LR\n    subgraph &quot;🔙 Rollback Options&quot;\n        A[⚡ Instant&lt;br/&gt;Blu ></div></foreignObject></g></g><g class=\"node default  \" id=\"flowchart-C-2\" transform=\"translate(595.16796875, 81.5)\"><rect class=\"basic label-container\" style=\"fill:#f9e79f !important;stroke:#f39c12 !important\" x=\"-88.87109375\" y=\"-36\" width=\"177.7421875\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-64.87109375, -24)\"><rect></rect><foreignObject width=\"129.7421875\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>🔢 Database<br>Migration rollback</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"flowchart-D-3\" transform=\"translate(813.03515625, 81.5)\"><rect class=\"basic label-container\" style=\"fill:#e8daef !important;stroke:#8e44ad !important\" x=\"-78.99609375\" y=\"-36\" width=\"157.9921875\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-54.99609375, -24)\"><rect></rect><foreignObject width=\"109.9921875\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>🎛️ Feature Flag<br>Toggle off</p></span></div></foreignObject></g></g></g></g></g></g></g></svg></div>\n<h2>⚠️ Складності з database rollback</h2>\n<pre><code class=\"language-sql hljs\" data-highlighted=\"yes\"><span class=\"hljs-comment\">-- 🔼 Migration UP</span>\n<span class=\"hljs-keyword\">ALTER</span> <span class=\"hljs-keyword\">TABLE</span> users <span class=\"hljs-keyword\">ADD</span> <span class=\"hljs-keyword\">COLUMN</span> phone <span class=\"hljs-type\">VARCHAR</span>(<span class=\"hljs-number\">20</span>);\n\n<span class=\"hljs-comment\">-- 🔽 Migration DOWN (може бути проблемою!)</span>\n<span class=\"hljs-keyword\">ALTER</span> <span class=\"hljs-keyword\">TABLE</span> users <span class=\"hljs-keyword\">DROP</span> <span class=\"hljs-keyword\">COLUMN</span> phone;\n<span class=\"hljs-comment\">-- ⚠️ Втрата даних, якщо колонка вже заповнена!</span></code></pre><div class=\"tip\"><strong>💡 Best Practice</strong> <p>Використовуйте <strong>expand-contract pattern</strong>: спочатку додайте нову структуру, мігруйте дані, потім видаліть стару.</p>\n</div>\n\n","<h1>⚡ Best Practices</h1>\n<div class=\"success\"><strong>✅ Ключові принципи успішного деплойменту</strong> </div>\n\n\n\n<h2>✅ Чеклист деплойменту</h2>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>Практика</th>\n<th>Опис</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1️⃣</td>\n<td><strong>Automate everything</strong></td>\n<td>Жодних ручних дій у production</td>\n</tr>\n<tr>\n<td>2️⃣</td>\n<td><strong>Deploy frequently</strong></td>\n<td>Менші зміни = менший ризик</td>\n</tr>\n<tr>\n<td>3️⃣</td>\n<td><strong>Monitor actively</strong></td>\n<td>Метрики, логи, алерти</td>\n</tr>\n<tr>\n<td>4️⃣</td>\n<td><strong>Test in production-like env</strong></td>\n<td>Staging ≈ Production</td>\n</tr>\n<tr>\n<td>5️⃣</td>\n<td><strong>Have rollback plan</strong></td>\n<td>Перевірений план відкату</td>\n</tr>\n<tr>\n<td>6️⃣</td>\n<td><strong>Use feature flags</strong></td>\n<td>Відокремлення deploy від release</td>\n</tr>\n<tr>\n<td>7️⃣</td>\n<td><strong>Document runbooks</strong></td>\n<td>Чіткі інструкції для інцидентів</td>\n</tr>\n</tbody></table>\n<div class=\"danger\"><strong>🚫 Антипатерни</strong> <ul>\n<li>🚫 \"Пʼятничний деплой\" — уникайте деплойментів перед вихідними</li>\n<li>🚫 \"Big bang release\" — великі зміни = великі ризики</li>\n<li>🚫 \"Manual hotfix\" — всі зміни через pipeline</li>\n</ul>\n</div>\n\n","<h1>📈 Метрики деплойменту (DORA)</h1>\n<div class=\"info\"><strong>ℹ️ DORA Metrics</strong> <p><strong>DORA (DevOps Research and Assessment)</strong> — чотири ключові метрики для оцінки ефективності DevOps.</p>\n</div>\n\n\n\n\n<div class=\"mermaid\" data-source=\"%%{init: {'theme': 'base', 'themeVariables': { 'primaryColor': -family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;}#exp-1766518110024-15-0 p{margin:0;}#exp-1766518110024-15-0 :root{--mermaid-font-family:\"trebuchet ms\",verdana,arial,sans-serif;}</style><g></g><g class=\"main\"><g class=\"quadrants\"><g class=\"quadrant\"><rect x=\"263\" y=\"45\" width=\"232\" height=\"212\" fill=\"#e8f4f8\"></rect><text x=\"0\" y=\"0\" fill=\"#2c3e50\" font-size=\"16\" dominant-baseline=\"hanging\" text-anchor=\"middle\" transform=\"translate(379, 50) rotate(0)\">Elite Performers</text></g><g class=\"quadrant\"><rect x=\"31\" y=\"45\" width=\"232\" height=\"212\" fill=\"#edf9fd\"></rect><text x=\"0\" y=\"0\" fill=\"#27394b\" font-size=\"16\" dominant-baseline=\"hanging\" text-anchor=\"middle\" transform=\"translate(147, 50) rotate(0)\">High Performers</text></g><g class=\"quadrant\"><rect x=\"31\" y=\"257\" width=\"232\" height=\"212\" fill=\"#f2feff\"></rect><text x=\"0\" y=\"0\" fill=\"#223446\" font-size=\"16\" dominant-baseline=\"hanging\" text-anchor=\"middle\" transform=\"translate(147, 262) rotate(0)\">Medium Performers</text></g><g class=\"quadrant\"><rect x=\"263\" y=\"257\" width=\"232\" height=\"212\" fill=\"#f7ffff\"></rect><text x=\"0\" y=\"0\" fill=\"#1d2f41\" font-size=\"16\" dominant-baseline=\"hanging\" text-anchor=\"middle\" transform=\"translate(379, 262) rotate(0)\">Low Performers</text></g></g><g class=\"border\"><line x1=\"30\" y1=\"45\" x2=\"496\" y2=\"45\" style=\"stroke: rgb(209, 217, 220); stroke-width: 2;\"></line><line x1=\"495\" y1=\"46\" x2=\"495\" y2=\"468\" style=\"stroke: rgb(209, 217, 220); stroke-width: 2;\"></line><line x1=\"30\" y1=\"469\" x2=\"496\" y2=\"469\" style=\"stroke: rgb(209, 217, 220); stroke-width: 2;\"></line><line x1=\"31\" y1=\"46\" x2=\"31\" y2=\"468\" style=\"stroke: rgb(209, 217, 220); stroke-width: 2;\"></line><line x1=\"263\" y1=\"46\" x2=\"263\" y2=\"468\" style=\"stroke: rgb(209, 217, 220); stroke-width: 1;\"></line><line x1=\"32\" y1=\"257\" x2=\"494\" y2=\"257\" style=\"stroke: rgb(209, 217, 220); stroke-width: 1;\"></line></g><g class=\"data-points\"><g class=\"data-point\"><circle cx=\"100.6\" cy=\"384.20000000000005\" r=\"5\" fill=\"hsl(195, 53.3333333333%, NaN%)\" stroke=\"hsl(195, 53.3333333333%, NaN%)\" stroke-width=\"0px\"></circle><text x=\"0\" y=\"0\" fill=\"#2c3e50\" font-size=\"12\" dominant-baseline=\"hanging\" text-anchor=\"middle\" transform=\"translate(100.6, 389.20000000000005) rotate(0)\">Low</text></g><g class=\"data-point\"><circle cx=\"216.6\" cy=\"278.20000000000005\" r=\"5\" fill=\"hsl(195, 53.3333333333%, NaN%)\" stroke=\"hsl(195, 53.3333333333%, NaN%)\" stroke-width=\"0px\"></circle><text x=\"0\" y=\"0\" fill=\"#2c3e50\" font-size=\"12\" dominant-baseline=\"hanging\" text-anchor=\"middle\" transform=\"translate(216.6, 283.20000000000005) rotate(0)\">Medium</text></g><g class=\"data-point\"><circle cx=\"332.6\" cy=\"172.20000000000002\" r=\"5\" fill=\"hsl(195, 53.3333333333%, NaN%)\" stroke=\"hsl(195, 53.3333333333%, NaN%)\" stroke-width=\"0px\"></circle><text x=\"0\" y=\"0\" fill=\"#2c3e50\" font-size=\"12\" dominant-baseline=\"hanging\" text-anchor=\"middle\" transform=\"translate(332.6, 177.20000000000002) rotate(0)\">High</text></g><g class=\"data-point\"><circle cx=\"425.4\" cy=\"87.39999999999999\" r=\"5\" fill=\"hsl(195, 53.3333333333%, NaN%)\" stroke=\"hsl(195, 53.3333333333%, NaN%)\" stroke-width=\"0px\"></circle><text x=\"0\" y=\"0\" fill=\"#2c3e50\" font-size=\"12\" dominant-baseline=\"hanging\" text-anchor=\"middle\" transform=\"translate(425.4, 92.39999999999999) rotate(0)\">Elite</text></g></g><g class=\"labels\"><g class=\"label\"><text x=\"0\" y=\"0\" fill=\"#2c3e50\" font-size=\"16\" dominant-baseline=\"hanging\" text-anchor=\"middle\" transform=\"translate(147, 479) rotate(0)\">Low Frequency</text></g><g class=\"label\"><text x=\"0\" y=\"0\" fill=\"#2c3e50\" font-size=\"16\" dominant-baseline=\"hanging\" text-anchor=\"middle\" transform=\"translate(379, 479) rotate(0)\">High Frequency</text></g><g class=\"label\"><text x=\"0\" y=\"0\" fill=\"#2c3e50\" font-size=\"16\" dominant-baseline=\"hanging\" text-anchor=\"middle\" transform=\"translate(5, 363) rotate(-90)\">Slow Recovery</text></g><g class=\"label\"><text x=\"0\" y=\"0\" fill=\"#2c3e50\" font-size=\"16\" dominant-baseline=\"hanging\" text-anchor=\"middle\" transform=\"translate(5, 151) rotate(-90)\">Fast Recovery</text></g></g><g class=\"title\"><text x=\"0\" y=\"0\" fill=\"#2c3e50\" font-size=\"20\" dominant-baseline=\"hanging\" text-anchor=\"middle\" transform=\"translate(250, 10) rotate(0)\">DORA Metrics Performance</text></g></g></svg></div>\n<table>\n<thead>\n<tr>\n<th>Метрика</th>\n<th>Elite</th>\n<th>High</th>\n<th>Medium</th>\n<th>Low</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🚀 <strong>Deployment Frequency</strong></td>\n<td>Кілька разів/день</td>\n<td>Раз/тиждень</td>\n<td>Раз/місяць</td>\n<td>Раз/6 міс</td>\n</tr>\n<tr>\n<td>⏱️ <strong>Lead Time for Changes</strong></td>\n<td>&lt; 1 години</td>\n<td>&lt; 1 тижня</td>\n<td>&lt; 1 місяця</td>\n<td>&gt; 6 місяців</td>\n</tr>\n<tr>\n<td>📉 <strong>Change Failure Rate</strong></td>\n<td>0-15%</td>\n<td>16-30%</td>\n<td>31-45%</td>\n<td>&gt; 45%</td>\n</tr>\n<tr>\n<td>🔧 <strong>Time to Restore</strong></td>\n<td>&lt; 1 години</td>\n<td>&lt; 1 дня</td>\n<td>&lt; 1 тижня</td>\n<td>&gt; 6 місяців</td>\n</tr>\n</tbody></table>\n","<h1>📝 Ключові висновки</h1>\n<div class=\"success\"><strong>✅ Головне з лекції</strong> </div>\n\n\n\n<h2>🎯 Основні тези</h2>\n<ol>\n<li><p><strong>Deployment ≠ Release</strong> — технічна операція vs бізнес-рішення</p>\n</li>\n<li><p><strong>Стратегії мають trade-offs</strong> — немає універсального рішення:</p>\n<ul>\n<li>Blue-Green для критичних систем</li>\n<li>Canary для поступової валідації</li>\n<li>Rolling для resource-efficient оновлень</li>\n</ul>\n</li>\n<li><p><strong>Автоматизація — обовʼязкова</strong> — CI/CD pipeline знижує людський фактор</p>\n</li>\n<li><p><strong>Feature Flags</strong> — потужний інструмент для розділення deploy та release</p>\n</li>\n<li><p><strong>Моніторинг та rollback</strong> — завжди майте план Б</p>\n</li>\n</ol>\n<div class=\"tip\"><strong>💡 Практична порада</strong> <p>Почніть з простого (Recreate), еволюціонуйте до складнішого (Canary) по мірі зростання потреб та зрілості команди.</p>\n</div>\n\n","<h1>❓ Контрольні питання</h1>\n<ol>\n<li><p><strong>Чим відрізняється deployment від release?</strong></p>\n</li>\n<li><p><strong>Яку стратегію деплойменту обрати для критичної системи?</strong></p>\n</li>\n<li><p><strong>Що означає версія 2.0.0 у SemVer?</strong></p>\n</li>\n<li><p><strong>Для чого потрібні feature flags?</strong></p>\n</li>\n<li><p><strong>Назвіть 3 антипатерни деплойменту.</strong></p>\n</li>\n</ol>\n","<h1>📚 Глосарій</h1>\n<table>\n<thead>\n<tr>\n<th>Термін</th>\n<th>Визначення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>CI/CD</strong></td>\n<td>Continuous Integration / Continuous Delivery — автоматизація збірки, тестування та доставки ПЗ</td>\n</tr>\n<tr>\n<td><strong>SemVer</strong></td>\n<td>Semantic Versioning — стандарт версіонування MAJOR.MINOR.PATCH</td>\n</tr>\n<tr>\n<td><strong>Feature Flag</strong></td>\n<td>Механізм увімкнення/вимкнення функцій без редеплою</td>\n</tr>\n<tr>\n<td><strong>Rollback</strong></td>\n<td>Повернення до попередньої стабільної версії</td>\n</tr>\n<tr>\n<td><strong>DORA</strong></td>\n<td>DevOps Research and Assessment — метрики ефективності DevOps</td>\n</tr>\n<tr>\n<td><strong>Canary</strong></td>\n<td>Поступове розгортання на малу частину користувачів</td>\n</tr>\n<tr>\n<td><strong>Blue-Green</strong></td>\n<td>Стратегія з двома ідентичними середовищами</td>\n</tr>\n<tr>\n<td><strong>Staging</strong></td>\n<td>Передпродакшн середовище для тестування</td>\n</tr>\n</tbody></table>\n"];let currentSlideIndex=0;
function showSlide(i){if(i<0||i>=slides.length)return;currentSlideIndex=i;const el=document.getElementById("current-slide");el.innerHTML=slides[i];el.scrollTop=0;document.getElementById("progress-bar").style.width=((i+1)/slides.length*100)+"%";document.getElementById("slide-number").textContent=(i+1)+" / "+slides.length;updateSidebarActive();}
function nextSlide(){if(currentSlideIndex<slides.length-1)showSlide(currentSlideIndex+1);}
function previousSlide(){if(currentSlideIndex>0)showSlide(currentSlideIndex-1);}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open");}
function toggleHelp(){document.getElementById("help-overlay").classList.toggle("hidden");}
function toggleFullscreen(){if(!document.fullscreenElement){const pc=document.getElementById("presentation-container");if(pc.requestFullscreen)pc.requestFullscreen();else if(pc.webkitRequestFullscreen)pc.webkitRequestFullscreen();else if(pc.msRequestFullscreen)pc.msRequestFullscreen();else if(pc.mozRequestFullScreen)pc.mozRequestFullScreen();}else{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();else if(document.msExitFullscreen)document.msExitFullscreen();else if(document.mozCancelFullScreen)document.mozCancelFullScreen();}}
function generateSidebar(){const sc=document.getElementById("sidebar-content");sc.innerHTML="";slides.forEach((html,idx)=>{const t=document.createElement("div");t.className="slide-thumbnail";if(idx===0)t.classList.add("active");const tmp=document.createElement("div");tmp.innerHTML=html;const title=tmp.querySelector("h1,h2");const titleText=title?title.textContent:("Слайд "+(idx+1));const textContent=tmp.textContent.replace(/s+/g," ").trim();const preview=textContent.substring(0,100)+(textContent.length>100?"...":"");t.innerHTML="<div class=\"slide-thumbnail-number\">"+(idx+1)+"</div><div class=\"slide-thumbnail-title\">"+titleText+"</div><div class=\"slide-thumbnail-content\">"+preview+"</div>";t.onclick=()=>{showSlide(idx);if(window.innerWidth<1024)toggleSidebar();};sc.appendChild(t);});}
function updateSidebarActive(){document.querySelectorAll(".slide-thumbnail").forEach((th,idx)=>{if(idx===currentSlideIndex){th.classList.add("active");th.scrollIntoView({behavior:"smooth",block:"nearest"});}else th.classList.remove("active");});}
document.addEventListener("keydown",e=>{switch(e.key){case"ArrowLeft":previousSlide();break;case"ArrowRight":case" ":e.preventDefault();nextSlide();break;case"f":case"F":toggleFullscreen();break;case"s":case"S":toggleSidebar();break;case"?":toggleHelp();break;case"Escape":const sb=document.getElementById("sidebar");const ho=document.getElementById("help-overlay");if(sb.classList.contains("open"))toggleSidebar();else if(!ho.classList.contains("hidden"))ho.classList.add("hidden");break;}});
generateSidebar();showSlide(0);</script></body></html>
