<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Agile та Scrum: Гнучкі методології розробки ПЗ</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><style>* {

#presentation-container:fullscreen,#presentation-container:-webkit-full-screen,#presentation-container:-moz-full-screen,#presentation-container:-ms-fullscreen{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)!important;}</style></head><body><div id="presentation-container"><div class="progress"><div class="progress-bar" id="progress-bar"></div></div><button id="sidebar-toggle" onclick="toggleSidebar()" title="Навігація слайдами (S)">☰</button><div id="sidebar"><div id="sidebar-header"><h3>📑 Слайди</h3><button id="sidebar-close" onclick="toggleSidebar()">✕</button></div><div id="sidebar-content"></div></div><div class="slide-container"><div class="slide" id="current-slide"></div></div><div class="controls"><button class="control-btn" onclick="previousSlide()" title="Попередній (←)">←</button><button class="control-btn" onclick="nextSlide()" title="Наступний (→)">→</button><button class="control-btn" onclick="toggleFullscreen()" title="Повноекранний режим (F)">⛶</button><button class="control-btn" onclick="toggleHelp()" title="Допомога (?)">?</button></div><div class="slide-number" id="slide-number">1 / 19</div><div id="help-overlay" class="hidden"><strong>Гарячі клавіші:</strong><br><kbd>←</kbd> <kbd>→</kbd> Навігація<br><kbd>F</kbd> Повноекранний режим<br><kbd>S</kbd> Sidebar<br><kbd>?</kbd> Допомога<br><kbd>Esc</kbd> Закрити</div></div><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><script>const slides=["<h1>Agile та Scrum: Гнучкі методології розробки ПЗ</h1>\n<p><strong>Курс:</strong> Основи інженерії програмного забезпечення<br><strong>Лектор:</strong> Кобилянський Антон</p>\n","<h2>📋 План лекції</h2>\n<ol>\n<li>🔄 Обмеження класичних методологій</li>\n<li>📜 Agile Manifesto: цінності та принципи</li>\n<li>🎯 Scrum як фреймворк: емпіризм і три стовпи</li>\n<li>👥 Ролі в Scrum-команді</li>\n<li>📅 Спринт і чотири події Scrum</li>\n<li>📦 Артефакти Scrum</li>\n<li>📊 Метрики та порівняння з Waterfall</li>\n<li>⚠️ Типові помилки при впровадженні Scrum</li>\n</ol>\n","<h1>🔄 Обмеження класичних методологій</h1>\n<div class=\"info\"><strong>ℹ️ Спільне припущення plan-driven моделей</strong> <p>Повний обсяг вимог можна зафіксувати на старті проєкту, після чого фази виконуються послідовно: аналіз, проєктування, кодування, тестування, впровадження.</p>\n</div>\n\n\n\n<table>\n<thead>\n<tr>\n<th>Методологія</th>\n<th>Основна проблема</th>\n<th>Наслідки</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>💧 Waterfall</td>\n<td>Неможливість швидких змін вимог</td>\n<td>Застаріла функціональність на релізі</td>\n</tr>\n<tr>\n<td>✅ V-модель</td>\n<td>Тестування у кінці циклу</td>\n<td>Пізнє виявлення критичних дефектів</td>\n</tr>\n<tr>\n<td>📈 Інкрементна</td>\n<td>Жорстко зафіксовані інкременти</td>\n<td>Складність адаптації між інкрементами</td>\n</tr>\n<tr>\n<td>🌀 Spiral</td>\n<td>Висока вартість аналізу ризиків</td>\n<td>Перевитрата бюджету на ранніх ітераціях</td>\n</tr>\n</tbody></table>\n<div class=\"warning\"><strong>⚠️ Реальність</strong> <p>Значна частина функціональних вимог змінюється протягом життєвого циклу проєкту: користувачі уточнюють потреби, ринок зміщується, технології оновлюються. Формальні процедури зміни вимог сповільнюють реакцію команди.</p>\n</div>\n\n\n\n<p><strong>Передумова Agile:</strong> якщо вимоги нестабільні за своєю природою, процес має бути побудований навколо швидкої адаптації, а не навколо припущення про стабільність плану.</p>\n","<h1>📜 Agile Manifesto</h1>\n<p><strong>Лютий 2001, штат Юта, США.</strong> 17 практиків індустрії (Кент Бек, Мартін Фаулер, Кен Швабер, Джефф Сазерленд, Боб Мартін та інші) сформулювали спільні риси своїх методологій: XP, Scrum, Crystal, DSDM.</p>\n<div class=\"info\"><strong>ℹ️ Чотири цінності</strong> <p>👥 <strong>Люди та взаємодія</strong> важливіші за процеси та інструменти<br>💻 <strong>Робоче ПЗ</strong> важливіше за вичерпну документацію<br>🤝 <strong>Співпраця з клієнтом</strong> важливіша за переговори про контракт<br>🔄 <strong>Реагування на зміни</strong> важливіше за дотримання плану</p>\n</div>\n\n\n\n<p><strong>Як читати цінності:</strong></p>\n<ul>\n<li>👥 Найкращий процес не врятує проєкт, якщо люди в команді не спілкуються. Інструменти підтримують взаємодію, а не замінюють її</li>\n<li>💻 Документація описує продукт, але цінність для клієнта створює лише працююча система, яку можна запустити і перевірити</li>\n<li>🤝 Контракт фіксує домовленості на старті, а реальні потреби виявляються під час роботи, тому замовник має бути залучений постійно</li>\n<li>🔄 План корисний як орієнтир, але коли ринок або вимоги змінилися, важливіше адаптуватися, ніж виконати застарілий план</li>\n</ul>\n<div class=\"note\"><strong>📝 Уточнення</strong> <p>Елементи праворуч не заперечуються, вони мають цінність. Декларація лише визначає пріоритет, коли пари вступають у конфлікт.</p>\n</div>\n\n\n\n\n<div class=\"mermaid\" data-source=\"graph LR\n    A[👥 Люди та взаємодія] --&gt; E[💎 Цінність для клієнта]\n    B[💻 Робоче ПЗ] --&gt; E\n    C[🤝 Співпраця з клієнтом] --&gt; E\n    D[🔄 Реагування на зміни] --&gt; E\n    style E fill:#e8f5e9,stroke:#2e7d32\n    style A fill:#e3f2fd,stroke:#1565c0\n    style B fill:#e3f2fd,stroke:#1565c0\n    style C fill:#e3f2fd,stroke:#1565c0\n    style D fill:#e3f2fd,stroke:#1565c0\"><svg id=\"exp-1788758720043-3-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 516.84375px;\" viewBox=\"0 0 516.84375 358\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1788758720043-3-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1788758720043-3-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite able-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>🤝 Співпраця з клієнтом</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788758720043-3-0-flowchart-D-6\" data-look=\"classic\" transform=\"translate(123.05859375, 326)\"><rect class=\"basic label-container\" style=\"fill:#e3f2fd !important;stroke:#1565c0 !important\" x=\"-111.85546875\" y=\"-24\" width=\"223.7109375\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-87.85546875, -12)\"><rect></rect><foreignObject width=\"175.7109375\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>🔄 Реагування на зміни</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1788758720043-3-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1788758720043-3-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n","<h1>💡 Що таке Agile?</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Agile</strong> - сімейство ітеративних методологій розробки ПЗ та, перш за все, спосіб мислення (mindset), що ставить адаптивність, співпрацю з клієнтом і швидку доставку цінності вище за дотримання первісного плану.</p>\n</div>\n\n\n\n<p><strong>Agile не є окремою методологією.</strong> Це філософія, на основі якої побудовано конкретні фреймворки:</p>\n<ul>\n<li>🎯 <strong>Scrum</strong> - фреймворк з ролями, подіями та артефактами</li>\n<li>🔧 <strong>Kanban</strong> - управління потоком задач через візуальну дошку</li>\n<li>🚀 <strong>XP (Extreme Programming)</strong> - інженерні практики: TDD, парне програмування</li>\n<li>🏃 <strong>Lean Software Development</strong> - мінімізація втрат у процесі</li>\n</ul>\n<h2>🎯 Ключові принципи Agile Manifesto</h2>\n<ol>\n<li>🚀 Найвищий пріоритет - задоволення клієнта через ранню та безперервну поставку ПЗ</li>\n<li>🔄 Зміни вимог вітаються навіть на пізніх стадіях розробки</li>\n<li>⏱️ Часта поставка робочого продукту: від кількох тижнів до кількох місяців</li>\n<li>🤝 Щоденна співпраця замовника та розробників</li>\n<li>💪 Проєкти будуються навколо мотивованих фахівців, яким довіряють</li>\n<li>🗣️ Пряма усна комунікація - найефективніший спосіб передачі інформації</li>\n<li>✅ Робоче ПЗ - головна міра прогресу</li>\n</ol>\n","<h1>🎯 Scrum: емпіризм і три стовпи</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Scrum</strong> - легкий фреймворк для управління розробкою складних продуктів, формалізований Кеном Швабером і Джеффом Сазерлендом та описаний у Scrum Guide. Scrum задає мінімально достатній набір ролей, подій і артефактів, не приписуючи конкретних інженерних практик.</p>\n</div>\n\n\n\n<p><strong>Методологічна основа:</strong> емпіризм. Знання здобувається з досвіду, рішення приймаються на основі того, що відомо зараз, а не на основі довгострокового прогнозу. Замість детального плану на рік команда планує короткий цикл, отримує реальний результат, аналізує його і коригує наступний крок.</p>\n<p><strong>Чому \"фреймворк\", а не \"методологія\":</strong> Scrum задає лише каркас (хто, коли і що робить), а конкретні інженерні практики (тестування, code review, CI/CD) команда обирає самостійно.</p>\n\n<div class=\"mermaid\" data-source=\"graph TD\n    A[🔍 Прозорість Transparency] --&gt; D[🎯 Емпіричний контроль процесу]\n    B[🔎 Аналіз Inspection] --&gt; D\n    C[🔄 Адаптація Adaptation] --&gt; D\n    style A fill:#e3f2fd,stroke:#1565c0\n    style B fill:#fff3e0,stroke:#ef6c00\n    style C fill:#f3e5f5,stroke:#7b1fa2\n    style D fill:#e8f5e9,stroke:#2e7d32\"><svg id=\"exp-178 \"fill:#e8f5e9 !important;stroke:#2e7d32 !important\" x=\"-124\" y=\"-36\" width=\"248\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-100, -24)\"><rect></rect><foreignObject width=\"200\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;\"><span class=\"nodeLabel \"><p>🎯 Емпіричний контроль процесу</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788758720060-5-0-flowchart-B-2\" data-look=\"classic\" transform=\"translate(404.60546875, 44)\"><rect class=\"basic label-container\" style=\"fill:#fff3e0 !important;stroke:#ef6c00 !important\" x=\"-98.60546875\" y=\"-24\" width=\"197.2109375\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-74.60546875, -12)\"><rect></rect><foreignObject width=\"149.2109375\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>🔎 Аналіз Inspection</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788758720060-5-0-flowchart-C-4\" data-look=\"classic\" transform=\"translate(666.6953125, 44)\"><rect class=\"basic label-container\" style=\"fill:#f3e5f5 !important;stroke:#7b1fa2 !important\" x=\"-113.484375\" y=\"-24\" width=\"226.96875\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-89.484375, -12)\"><rect></rect><foreignObject width=\"178.96875\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>🔄 Адаптація Adaptation</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1788758720060-5-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1788758720060-5-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<ul>\n<li>🔍 <strong>Прозорість:</strong> стан задач, прогрес спринту та проблеми видимі всім, хто відповідає за результат. Без прозорості аналіз спирається на викривлені дані</li>\n<li>🔎 <strong>Аналіз:</strong> регулярна перевірка артефактів і прогресу для виявлення відхилень. У Scrum для цього існують події з фіксованою періодичністю</li>\n<li>🔄 <strong>Адаптація:</strong> оперативне коригування процесу або продукту, коли аналіз виявив відхилення. Аналіз без подальших дій не має сенсу</li>\n</ul>\n","<h1>👥 Три ролі в Scrum-команді</h1>\n<p>Scrum визначає три обов'язкові ролі, які разом складають Scrum Team. Кожна має чітко окреслену зону відповідальності, і всі три необхідні для функціонування процесу.</p>\n<table>\n<thead>\n<tr>\n<th>Роль</th>\n<th>Ключове питання</th>\n<th>Зона відповідальності</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>👨‍💼 <strong>Product Owner</strong></td>\n<td>ЩО робимо і чому?</td>\n<td>Максимізує цінність продукту, впорядковує Product Backlog, приймає або відхиляє роботу</td>\n</tr>\n<tr>\n<td>👨‍💻 <strong>Development Team</strong></td>\n<td>ЯК це робимо?</td>\n<td>Кросфункціональна самоорганізована група з 3-9 фахівців, сама вирішує спосіб реалізації</td>\n</tr>\n<tr>\n<td>🎓 <strong>Scrum Master</strong></td>\n<td>Чи працює процес?</td>\n<td>Захищає команду від перешкод, фасилітує події, навчає організацію Agile-практикам</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Кросфункціональність та рівність</strong> <p>У Development Team присутні всі компетенції для створення інкременту: frontend, backend, QA, дизайн, DevOps. Команда не залежить від зовнішніх відділів і може довести задачу до готового стану самостійно. Усі члени мають однаковий формальний статус \"розробник\", субролей не передбачено.</p>\n</div>\n\n\n\n<p><strong>Product Owner</strong> є єдиним голосом замовника всередині команди: саме він вирішує, що потрапляє в беклог і в якому порядку, тому команда не отримує суперечливих пріоритетів від різних стейкхолдерів.</p>\n<div class=\"warning\"><strong>⚠️ Scrum Master не є тімлідом</strong> <p>Scrum Master не керує людьми та не призначає задачі. Це слуга-лідер (servant leader), який допомагає команді бути ефективнішою. Підміна цієї ролі менеджером є типовим викривленням процесу.</p>\n</div>\n\n\n\n\n<div class=\"mermaid\" data-source=\"flowchart TB\n    SM[🎓 Scrum Master забезпечує процес] --&gt; PO[👨‍💼 Product Owner визначає ЩО]\n    SM --&gt; DT[👨‍💻 Development Team реалізує ЯК]\n    PO --&gt; P[💎 Продукт]\n    DT --&gt; P\n    style SM fill:#f3e5f5,stroke:#7b1fa2\n    style PO fill:#e3f2fd,stroke:#1565c0\n    style DT fill:#e8f5e9,stroke:#2e7d32\n    style P fill:#fff9c4,stroke:#f9a825\"><svg id=\"exp-1788758720078-6-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 562px;\" viewBox=\"0 0 562 308\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1788758720078-6-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1788758720078-6-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1788758720078-6-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#exp-1788758720078-6-0 .error-icon{fill:#552222;}#exp-1788758720078-6-0 .error-text{fill:#552222;stroke:#552222;}#exp-1788758720078-6-0 .edge-thickness-normal{stroke-width:1px;}#exp-1788758720078-6-0 .edge-th :#e8f5e9 !important;stroke:#2e7d32 !important\" x=\"-77.4453125\" y=\"-24\" width=\"154.890625\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-53.4453125, -12)\"><rect></rect><foreignObject width=\"106.890625\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>📊 Daily Scrum</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788758720095-7-0-flowchart-C-3\" data-look=\"classic\" transform=\"translate(524.3671875, 32)\"><rect class=\"basic label-container\" style=\"fill:#fff3e0 !important;stroke:#ef6c00 !important\" x=\"-83.5703125\" y=\"-24\" width=\"167.140625\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-59.5703125, -12)\"><rect></rect><foreignObject width=\"119.140625\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>🔍 Sprint Review</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788758720095-7-0-flowchart-D-5\" data-look=\"classic\" transform=\"translate(765.8046875, 61.5)\"><rect class=\"basic label-container\" style=\"fill:#f3e5f5 !important;stroke:#7b1fa2 !important\" x=\"-107.8671875\" y=\"-24\" width=\"215.734375\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-83.8671875, -12)\"><rect></rect><foreignObject width=\"167.734375\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>🤔 Sprint Retrospective</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1788758720095-7-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1788758720095-7-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<div class=\"tip\"><strong>💡 Time-box</strong> <p>Усі події Scrum мають фіксований ліміт часу, який не може бути перевищений. Це дисципліна, що захищає від надмірно довгих обговорень.</p>\n</div>\n\n\n\n\n\n<div class=\"note\"><strong>📝 Backlog Refinement</strong> <p>Уточнення беклогу - не офіційна подія, а постійна активність: деталізація та оцінка майбутніх задач. Зазвичай займає до 10% часу спринту.</p>\n</div>\n\n","<h1>🎯 Sprint Planning та Daily Scrum</h1>\n<h2>1️⃣ Sprint Planning</h2>\n<p><strong>Мета:</strong> сформувати план роботи на ітерацію<br>⏱️ <strong>Time-box:</strong> до 8 годин для 4-тижневого спринту (для коротших спринтів пропорційно менше)</p>\n<ul>\n<li>🎯 <strong>Що ми зробимо?</strong> Product Owner представляє пріоритетні елементи Product Backlog, команда обирає обсяг роботи</li>\n<li>🛠️ <strong>Як ми це зробимо?</strong> Команда декомпозує задачі та формує план реалізації</li>\n<li>📋 <strong>Результат:</strong> Sprint Goal і Sprint Backlog</li>\n</ul>\n<h2>2️⃣ Daily Scrum</h2>\n<p><strong>Мета:</strong> синхронізація команди розробки та план на день<br>⏱️ <strong>Time-box:</strong> 15 хвилин, щодня в один і той самий час</p>\n<ul>\n<li>✅ Що я зробив від попереднього стендапу?</li>\n<li>🎯 Що планую робити сьогодні?</li>\n<li>🚧 Які перешкоди блокують роботу?</li>\n</ul>\n<p>Виявлені перешкоди не вирішуються на стендапі: їх фіксують, а детальне обговорення переносять на окрему зустріч зацікавлених учасників. Так подія залишається у межах 15 хвилин.</p>\n<div class=\"warning\"><strong>⚠️ Типова помилка</strong> <p>Daily Scrum - не звіт для менеджера, а інструмент координації самої команди. Підміна статус-репортами руйнує зміст події.</p>\n</div>\n\n","<h1>🔍 Sprint Review та Sprint Retrospective</h1>\n<h2>3️⃣ Sprint Review</h2>\n<p><strong>Мета:</strong> демонстрація інкременту стейкхолдерам та отримання зворотного зв'язку<br>⏱️ <strong>Time-box:</strong> до 4 годин для 4-тижневого спринту</p>\n<ul>\n<li>🎬 <strong>Демо:</strong> команда показує лише функціональність, що відповідає Definition of Done</li>\n<li>💬 <strong>Фідбек:</strong> замовники, користувачі, менеджмент діляться думками</li>\n<li>📋 <strong>Коригування:</strong> обговорення наступних пріоритетів Product Backlog</li>\n</ul>\n<p>Sprint Review є неформальною робочою зустріччю, а не приймальним іспитом: її результат - оновлений погляд на те, що робити далі.</p>\n<h2>4️⃣ Sprint Retrospective</h2>\n<p><strong>Мета:</strong> внутрішній аналіз процесу команди та його покращення<br>⏱️ <strong>Time-box:</strong> до 3 годин для 4-тижневого спринту</p>\n<p>На відміну від Review, ретроспектива присвячена не продукту, а способу роботи: комунікації, інструментам, домовленостям усередині команди. Стейкхолдери зазвичай не присутні, щоб команда могла говорити відверто.</p>\n<div class=\"tip\"><strong>💡 Формат Start-Stop-Continue</strong> <p><strong>Start</strong> - що почнемо робити | <strong>Stop</strong> - що припинимо | <strong>Continue</strong> - що продовжимо</p>\n</div>\n\n\n\n\n<div class=\"mermaid\" data-source=\"graph LR\n    A[📝 Збір фідбеку] --&gt; B[📊 Аналіз проблем]\n    B --&gt; C[💡 Генерація ідей]\n    C --&gt; D[🎯 Action Items]\n    D --&gt; E[✅ Виконання у наступному спринті]\n    style E fill:#e8f5e9,stroke:#2e7d32\"><svg id=\"exp-1788758720105-9-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 1154.1015625px;\" viewBox=\"0 0 1154.1015625 88\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1788758720105-9-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame enter;\"><span class=\"nodeLabel \"><p>📝 Збір фідбеку</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788758720105-9-0-flowchart-B-1\" data-look=\"classic\" transform=\"translate(316.8359375, 44)\"><rect class=\"basic label-container\" style=\"\" x=\"-94.3984375\" y=\"-24\" width=\"188.796875\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-70.3984375, -12)\"><rect></rect><foreignObject width=\"140.796875\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>📊 Аналіз проблем</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788758720105-9-0-flowchart-C-3\" data-look=\"classic\" transform=\"translate(550.50390625, 44)\"><rect class=\"basic label-container\" style=\"\" x=\"-89.26953125\" y=\"-24\" width=\"178.5390625\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-65.26953125, -12)\"><rect></rect><foreignObject width=\"130.5390625\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>💡 Генерація ідей</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788758720105-9-0-flowchart-D-5\" data-look=\"classic\" transform=\"translate(768.9375, 44)\"><rect class=\"basic label-container\" style=\"\" x=\"-79.1640625\" y=\"-24\" width=\"158.328125\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-55.1640625, -12)\"><rect></rect><foreignObject width=\"110.328125\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>🎯 Action Items</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788758720105-9-0-flowchart-E-7\" data-look=\"classic\" transform=\"translate(1022.1015625, 44)\"><rect class=\"basic label-container\" style=\"fill:#e8f5e9 !important;stroke:#2e7d32 !important\" x=\"-124\" y=\"-36\" width=\"248\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-100, -24)\"><rect></rect><foreignObject width=\"200\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;\"><span class=\"nodeLabel \"><p>✅ Виконання у наступному спринті</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1788758720105-9-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1788758720105-9-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n","<h1>📦 Product Backlog та User Story</h1>\n<div class=\"info\"><strong>ℹ️ Product Backlog</strong> <p>Впорядкований за пріоритетом список усіх відомих елементів роботи над продуктом. Власник - Product Owner, який постійно його уточнює.</p>\n</div>\n\n\n\n<p><strong>Типові категорії елементів:</strong> 📝 User Stories (функціональні вимоги), 🐛 баги, 🔧 технічні задачі (рефакторинг, технічний борг), 🔬 spikes (дослідницькі задачі)</p>\n<p>Беклог ніколи не буває \"завершеним\": поки продукт існує, він поповнюється новими ідеями та уточненнями. Елементи вгорі списку деталізовані та оцінені, елементи внизу можуть бути лише короткими нотатками.</p>\n<h2>📝 Приклад User Story</h2>\n<p><strong>Формат:</strong> \"Як [роль], я хочу [функція], щоб [цінність]\"</p>\n<p><strong>Назва:</strong> Авторизація через Google<br><strong>User Story:</strong> Як користувач інтернет-магазину, я хочу увійти через свій Google-акаунт, щоб не створювати новий пароль і швидше почати покупки.</p>\n<p><strong>Критерії прийняття:</strong></p>\n<ul>\n<li>✅ Кнопка \"Увійти через Google\" присутня на головній сторінці</li>\n<li>✅ Після авторизації користувач потрапляє на сторінку каталогу</li>\n<li>✅ Email користувача збережений у профілі</li>\n<li>✅ Функція працює на мобільних пристроях</li>\n</ul>\n<p><strong>Пріоритет:</strong> Високий | <strong>Оцінка:</strong> 5 Story Points</p>\n<div class=\"tip\"><strong>💡 Критерій якості INVEST</strong> <p><strong>I</strong>ndependent (не залежить від інших історій), <strong>N</strong>egotiable (деталі обговорюються, а не фіксуються наперед), <strong>V</strong>aluable (несе цінність користувачу), <strong>E</strong>stimable (команда може оцінити), <strong>S</strong>mall (вміщується у спринт), <strong>T</strong>estable (є критерії перевірки)</p>\n</div>\n\n","<h1>📦 Sprint Backlog та Increment</h1>\n<h2>🎯 Sprint Backlog</h2>\n<p>Підмножина Product Backlog, обрана командою на поточний спринт, разом із планом реалізації та Sprint Goal. Належить команді розробки і деталізується протягом спринту.</p>\n<table>\n<thead>\n<tr>\n<th>Задача</th>\n<th>Відповідальний</th>\n<th>Статус</th>\n<th>Години</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Дизайн форми логіну</td>\n<td>Анна</td>\n<td>✅ Done</td>\n<td>8</td>\n</tr>\n<tr>\n<td>API авторизації</td>\n<td>Богдан</td>\n<td>🔄 In Progress</td>\n<td>12</td>\n</tr>\n<tr>\n<td>Інтеграція з Google OAuth</td>\n<td>Катерина</td>\n<td>📋 To Do</td>\n<td>16</td>\n</tr>\n<tr>\n<td>Тестування</td>\n<td>Дарина</td>\n<td>📋 To Do</td>\n<td>8</td>\n</tr>\n</tbody></table>\n<div class=\"warning\"><strong>⚠️ Definition of Ready</strong> <p>Задача береться в спринт лише за умови: чіткі критерії прийняття, оцінка командою, відсутність блокерів, спільне розуміння задачі.</p>\n</div>\n\n\n\n<h2>📈 Increment</h2>\n<p>Сума всіх елементів Product Backlog, завершених під час спринту, разом з усіма попередніми інкрементами. Має бути потенційно готовим до випуску, навіть якщо рішення про реліз приймається пізніше. Саме інкремент дає стейкхолдерам реальну, а не паперову картину прогресу.</p>\n<div class=\"info\"><strong>ℹ️ Definition of Done</strong> <p>✅ Код написано та пройшов code review ✅ Покритий unit- та integration-тестами ✅ Документація оновлена ✅ Задеплоєно на staging ✅ Product Owner прийняв роботу</p>\n</div>\n\n\n\n\n<div class=\"mermaid\" data-source=\"graph LR\n    A[📋 Product Backlog] --&gt; B[🎯 Sprint Backlog]\n    B --&gt; C[📈 Increment]\n    C --&gt; D[💎 Потенційно готовий продукт]\n    style A fill:#e3f2fd,stroke:#1565c0\n    style B fill:#fff3e0,stroke:#ef6c00\n    style C fill:#f3e5f5,stroke:#7b1fa2\n    style D fill:#e8f5e9,stroke:#2e7d32\"><svg id=\"exp-1788758720115-11-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 916.65625px;\" viewBox=\"0 0 916.65625 88\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1788758720115-11-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1788758720115-11-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1788758720115-11-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#exp-1788758720115-11-0 .error-icon{fill:#552222;}#exp-1788758720115-11-0 .error-text{fill:#552222;stroke:#552222;}#exp-1788758720115-11-0 .edge-thickness-normal{stroke-width:1px;}#exp-1788758720115-11-0 .edge-thickness-thick{stroke-width:3.5px;}#exp-1788758720115-11-0 .edge-pattern-solid{stroke-dasharray:0;}#exp-1788758720115-11-0 .edge-thickness-invisible{stroke-width:0;fill:none;}#exp-1788758720115-11-0 .edge-pattern-dashed{stroke-dasharray 5, 44)\"><rect class=\"basic label-container\" style=\"fill:#e8f5e9 !important;stroke:#2e7d32 !important\" x=\"-124\" y=\"-36\" width=\"248\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-100, -24)\"><rect></rect><foreignObject width=\"200\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;\"><span class=\"nodeLabel \"><p>💎 Потенційно готовий продукт</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1788758720115-11-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1788758720115-11-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n","<h1>📊 Метрики Scrum-процесу</h1>\n<div class=\"info\"><strong>ℹ️ Призначення</strong> <p>Метрики використовуються командою для рефлексії над процесом, а не для зовнішньої оцінки людей. Вони відповідають на питання \"чи стає наш процес кращим\", а не \"хто працює найбільше\".</p>\n</div>\n\n\n\n<table>\n<thead>\n<tr>\n<th>Метрика</th>\n<th>Що показує</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🔥 <strong>Velocity</strong></td>\n<td>Кількість Story Points, виконаних за спринт</td>\n</tr>\n<tr>\n<td>📉 <strong>Burndown Chart</strong></td>\n<td>Залишковий обсяг роботи в межах спринту</td>\n</tr>\n<tr>\n<td>⏱️ <strong>Cycle Time</strong></td>\n<td>Час від старту задачі до її завершення</td>\n</tr>\n<tr>\n<td>🎯 <strong>Sprint Goal Success Rate</strong></td>\n<td>Частка спринтів, у яких досягнуто мети спринту</td>\n</tr>\n</tbody></table>\n<div class=\"danger\"><strong>🚫 Метрики не є метою</strong> <p>Підміна призначення (наприклад, KPI-преміювання за Velocity) призводить до спотворення оцінок: команда починає завищувати Story Points, і метрика втрачає сенс.</p>\n</div>\n\n\n\n\n\n<div class=\"tip\"><strong>💡 Практика</strong> <p>Velocity використовується для прогнозування обсягу наступних спринтів, а Burndown Chart переглядається на Daily Scrum для раннього виявлення відставання.</p>\n</div>\n\n","<h1>⚖️ Waterfall vs Agile/Scrum</h1>\n<p>Обидва підходи є легітимними: вони оптимальні в різних контекстах, і вибір залежить від стабільності вимог, доступності замовника та регуляторних обмежень.</p>\n<table>\n<thead>\n<tr>\n<th>Характеристика</th>\n<th>💧 Waterfall</th>\n<th>🎯 Agile/Scrum</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Планування</strong></td>\n<td>Весь проєкт наперед</td>\n<td>Кожен спринт окремо</td>\n</tr>\n<tr>\n<td><strong>Зміни вимог</strong></td>\n<td>Дуже складно</td>\n<td>Вітаються</td>\n</tr>\n<tr>\n<td><strong>Поставка</strong></td>\n<td>У кінці проєкту</td>\n<td>Кожні 1-4 тижні</td>\n</tr>\n<tr>\n<td><strong>Документація</strong></td>\n<td>Повна на старті</td>\n<td>Мінімально достатня</td>\n</tr>\n<tr>\n<td><strong>Взаємодія з клієнтом</strong></td>\n<td>На початку та в кінці</td>\n<td>Постійна</td>\n</tr>\n<tr>\n<td><strong>Ризики</strong></td>\n<td>Високі, виявляються пізно</td>\n<td>Низькі, рання детекція</td>\n</tr>\n<tr>\n<td><strong>Команда</strong></td>\n<td>Спеціалізована</td>\n<td>Кросфункціональна</td>\n</tr>\n</tbody></table>\n<h2>✅ Коли Scrum працює найкраще</h2>\n<ul>\n<li>🔄 Вимоги змінні, продукт еволюціонує</li>\n<li>👥 Замовник доступний і готовий давати зворотний зв'язок</li>\n<li>🚀 Ринок вимагає швидкого виходу з продуктом</li>\n</ul>\n<h2>❌ Коли Scrum рідко доцільний</h2>\n<ul>\n<li>📋 Жорстко зафіксовані контрактні вимоги</li>\n<li>🏛️ Регульовані індустрії з обов'язковою формальною верифікацією: медичне обладнання, авіоніка</li>\n<li>👤 Задачі одного розробника або суто експлуатаційні роботи без нової функціональності</li>\n</ul>\n","<h1>⚠️ Типові помилки при впровадженні Scrum</h1>\n<p>Більшість проблем із Scrum виникає не через сам фреймворк, а через його часткове або викривлене впровадження. Спільна риса анти-патернів: формально Scrum зберігається, але емпіричний цикл (прозорість, аналіз, адаптація) перестає працювати.</p>\n<div class=\"danger\"><strong>🚫 Scrum-but</strong> <p>\"Ми робимо Scrum, але без ретроспектив\", \"але Product Owner недоступний\". Часткове запровадження відтворює проблеми класичних методологій, формально залишаючись під назвою Scrum.</p>\n</div>\n\n\n\n\n\n<div class=\"warning\"><strong>⚠️ Мікроменеджмент</strong> <p>Scrum Master або менеджер розподіляє задачі замість команди. <strong>Рішення:</strong> довіряти самоорганізації команди.</p>\n</div>\n\n\n\n\n\n<div class=\"warning\"><strong>⚠️ Відсутність Sprint Goal</strong> <p>Команда бере випадкові задачі без спільної мети. <strong>Рішення:</strong> формулювати чітку мету на кожен спринт.</p>\n</div>\n\n\n\n\n\n<div class=\"warning\"><strong>⚠️ Перевантаження спринту</strong> <p>\"Візьмемо ще одну невелику задачу\". Результат: нічого не завершено, низька якість. <strong>Рішення:</strong> краще недовантажити і виконати якісно.</p>\n</div>\n\n\n\n\n\n<div class=\"warning\"><strong>⚠️ Daily Scrum як статус-репорт</strong> <p>15-хвилинний стендап перетворюється на годинну нараду для менеджера. <strong>Рішення:</strong> говорити лише про синхронізацію команди.</p>\n</div>\n\n\n\n\n\n<div class=\"danger\"><strong>🚫 Неготові User Stories</strong> <p>Історії без критеріїв прийняття або оцінки потрапляють у спринт. <strong>Рішення:</strong> дотримуватися Definition of Ready.</p>\n</div>\n\n","<h1>✅ Ключові висновки</h1>\n<ol>\n<li>🔄 <strong>Класичні методології</strong> припускають стабільність вимог, що майже ніколи не справджується</li>\n<li>💡 <strong>Agile - це mindset</strong> і філософія, а Scrum - конкретний фреймворк на її основі</li>\n<li>📜 <strong>Чотири цінності Agile Manifesto</strong> визначають пріоритети у конфліктних ситуаціях, не заперечуючи правих елементів</li>\n<li>🔍 <strong>Scrum базується на емпіризмі:</strong> прозорість, аналіз, адаптація</li>\n<li>👥 <strong>Три ролі:</strong> Product Owner (ЩО), Development Team (ЯК), Scrum Master (процес)</li>\n<li>📅 <strong>Чотири події</strong> в межах спринту: Planning, Daily Scrum, Review, Retrospective, усі з time-box</li>\n<li>📦 <strong>Три артефакти:</strong> Product Backlog, Sprint Backlog, Increment</li>\n<li>🚀 <strong>Кожен спринт</strong> завершується потенційно готовим до випуску інкрементом</li>\n</ol>\n<div class=\"success\"><strong>✅ Головне</strong> <p>Scrum не є гарантією успіху проєкту. Це лише структура, що уможливлює емпіричну адаптацію. Дисципліна виконання подій і чесність артефактів визначають, чи дасть Scrum очікувану цінність.</p>\n</div>\n\n","<h1>❓ Контрольні питання</h1>\n<ol>\n<li><p><strong>Яке спільне припущення класичних методологій робить їх вразливими до змін вимог?</strong></p>\n</li>\n<li><p><strong>Назвіть чотири цінності Agile Manifesto.</strong> Чому елементи праворуч у кожній парі не заперечуються?</p>\n</li>\n<li><p><strong>Що таке емпіризм у Scrum і через які три стовпи він реалізується?</strong></p>\n</li>\n<li><p><strong>У чому різниця між Product Owner та Scrum Master?</strong> Чому Scrum Master не є тімлідом?</p>\n</li>\n<li><p><strong>Які чотири події Scrum відбуваються в межах спринту та яке призначення кожної?</strong></p>\n</li>\n<li><p><strong>Чим відрізняються Definition of Ready та Definition of Done?</strong></p>\n</li>\n<li><p><strong>У яких умовах Scrum працює найкраще, а в яких його застосування недоцільне?</strong></p>\n</li>\n</ol>\n","<h1>📚 Глосарій термінів</h1>\n<table>\n<thead>\n<tr>\n<th>Термін</th>\n<th>Визначення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Agile</strong></td>\n<td>Сімейство ітеративних методологій і спосіб мислення, що ставить адаптивність вище плану</td>\n</tr>\n<tr>\n<td><strong>Scrum</strong></td>\n<td>Легкий фреймворк управління розробкою з фіксованим набором ролей, подій і артефактів</td>\n</tr>\n<tr>\n<td><strong>Емпіризм</strong></td>\n<td>Підхід, за яким знання здобувається з досвіду, а рішення приймаються на основі відомого</td>\n</tr>\n<tr>\n<td><strong>Sprint</strong></td>\n<td>Цикл розробки фіксованої тривалості від 1 до 4 тижнів</td>\n</tr>\n<tr>\n<td><strong>Time-box</strong></td>\n<td>Фіксований ліміт часу для події, який не може бути перевищений</td>\n</tr>\n<tr>\n<td><strong>Product Backlog</strong></td>\n<td>Впорядкований за пріоритетом список усіх елементів роботи над продуктом</td>\n</tr>\n<tr>\n<td><strong>Sprint Backlog</strong></td>\n<td>Підмножина Product Backlog на поточний спринт разом із планом реалізації</td>\n</tr>\n<tr>\n<td><strong>Increment</strong></td>\n<td>Сума завершених елементів спринту разом з усіма попередніми інкрементами</td>\n</tr>\n<tr>\n<td><strong>Sprint Goal</strong></td>\n<td>Мета, якої команда прагне досягти за спринт</td>\n</tr>\n<tr>\n<td><strong>User Story</strong></td>\n<td>Вимога у форматі \"Як [роль], я хочу [функція], щоб [цінність]\"</td>\n</tr>\n<tr>\n<td><strong>Story Points</strong></td>\n<td>Відносна оцінка складності задачі</td>\n</tr>\n<tr>\n<td><strong>Velocity</strong></td>\n<td>Кількість Story Points, виконаних командою за спринт</td>\n</tr>\n<tr>\n<td><strong>Burndown Chart</strong></td>\n<td>Графік залишкового обсягу роботи в межах спринту</td>\n</tr>\n<tr>\n<td><strong>Impediment</strong></td>\n<td>Перешкода, що блокує роботу команди</td>\n</tr>\n<tr>\n<td><strong>Stakeholder</strong></td>\n<td>Зацікавлена сторона: замовник, користувачі, менеджмент</td>\n</tr>\n<tr>\n<td><strong>Servant leader</strong></td>\n<td>Стиль лідерства, за якого лідер служить команді, а не керує нею</td>\n</tr>\n<tr>\n<td><strong>Backlog Refinement</strong></td>\n<td>Постійна активність деталізації та оцінки майбутніх задач</td>\n</tr>\n</tbody></table>\n","<h1>🔤 Глосарій абревіатур</h1>\n<ul>\n<li><strong>PO</strong> (Product Owner / Власник продукту)</li>\n<li><strong>SM</strong> (Scrum Master / Скрам-майстер)</li>\n<li><strong>XP</strong> (Extreme Programming / Екстремальне програмування)</li>\n<li><strong>DSDM</strong> (Dynamic Systems Development Method / Метод розробки динамічних систем)</li>\n<li><strong>TDD</strong> (Test-Driven Development / Розробка через тестування)</li>\n<li><strong>DoR</strong> (Definition of Ready / Критерії готовності задачі до роботи)</li>\n<li><strong>DoD</strong> (Definition of Done / Критерії завершеності роботи)</li>\n<li><strong>INVEST</strong> (Independent, Negotiable, Valuable, Estimable, Small, Testable / Критерії якості User Story)</li>\n<li><strong>QA</strong> (Quality Assurance / Забезпечення якості)</li>\n<li><strong>KPI</strong> (Key Performance Indicator / Ключовий показник ефективності)</li>\n<li><strong>OAuth</strong> (Open Authorization / Відкритий протокол авторизації)</li>\n</ul>\n"];let currentSlideIndex=0;
function renderMath(root){if(typeof renderMathInElement!=="function"||!root)return;try{renderMathInElement(root,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\[",right:"\\]",display:true},{left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false}],throwOnError:false,strict:"ignore",ignoredTags:["script","noscript","style","textarea","pre","code"]});}catch(e){console.warn("Math render error:",e);}}
function showSlide(i){if(i<0||i>=slides.length)return;currentSlideIndex=i;const el=document.getElementById("current-slide");el.innerHTML=slides[i];el.scrollTop=0;renderMath(el);document.getElementById("progress-bar").style.width=((i+1)/slides.length*100)+"%";document.getElementById("slide-number").textContent=(i+1)+" / "+slides.length;updateSidebarActive();}
function nextSlide(){if(currentSlideIndex<slides.length-1)showSlide(currentSlideIndex+1);}
function previousSlide(){if(currentSlideIndex>0)showSlide(currentSlideIndex-1);}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open");}
function toggleHelp(){document.getElementById("help-overlay").classList.toggle("hidden");}
function toggleFullscreen(){if(!document.fullscreenElement){const pc=document.getElementById("presentation-container");if(pc.requestFullscreen)pc.requestFullscreen();else if(pc.webkitRequestFullscreen)pc.webkitRequestFullscreen();else if(pc.msRequestFullscreen)pc.msRequestFullscreen();else if(pc.mozRequestFullScreen)pc.mozRequestFullScreen();}else{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();else if(document.msExitFullscreen)document.msExitFullscreen();else if(document.mozCancelFullScreen)document.mozCancelFullScreen();}}
function generateSidebar(){const sc=document.getElementById("sidebar-content");sc.innerHTML="";slides.forEach((html,idx)=>{const t=document.createElement("div");t.className="slide-thumbnail";if(idx===0)t.classList.add("active");const tmp=document.createElement("div");tmp.innerHTML=html;const title=tmp.querySelector("h1,h2");const titleText=title?title.textContent:("Слайд "+(idx+1));const textContent=tmp.textContent.replace(/s+/g," ").trim();const preview=textContent.substring(0,100)+(textContent.length>100?"...":"");t.innerHTML="<div class=\"slide-thumbnail-number\">"+(idx+1)+"</div><div class=\"slide-thumbnail-title\">"+titleText+"</div><div class=\"slide-thumbnail-content\">"+preview+"</div>";t.onclick=()=>{showSlide(idx);if(window.innerWidth<1024)toggleSidebar();};sc.appendChild(t);});}
function updateSidebarActive(){document.querySelectorAll(".slide-thumbnail").forEach((th,idx)=>{if(idx===currentSlideIndex){th.classList.add("active");th.scrollIntoView({behavior:"smooth",block:"nearest"});}else th.classList.remove("active");});}
document.addEventListener("keydown",e=>{switch(e.key){case"ArrowLeft":previousSlide();break;case"ArrowRight":case" ":e.preventDefault();nextSlide();break;case"f":case"F":toggleFullscreen();break;case"s":case"S":toggleSidebar();break;case"?":toggleHelp();break;case"Escape":const sb=document.getElementById("sidebar");const ho=document.getElementById("help-overlay");if(sb.classList.contains("open"))toggleSidebar();else if(!ho.classList.contains("hidden"))ho.classList.add("hidden");break;}});
generateSidebar();showSlide(0);</script></body></html>
