<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>User Stories та Agile Planning</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><style>* {

#presentation-container:fullscreen,#presentation-container:-webkit-full-screen,#presentation-container:-moz-full-screen,#presentation-container:-ms-fullscreen{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)!important;}</style></head><body><div id="presentation-container"><div class="progress"><div class="progress-bar" id="progress-bar"></div></div><button id="sidebar-toggle" onclick="toggleSidebar()" title="Навігація слайдами (S)">☰</button><div id="sidebar"><div id="sidebar-header"><h3>📑 Слайди</h3><button id="sidebar-close" onclick="toggleSidebar()">✕</button></div><div id="sidebar-content"></div></div><div class="slide-container"><div class="slide" id="current-slide"></div></div><div class="controls"><button class="control-btn" onclick="previousSlide()" title="Попередній (←)">←</button><button class="control-btn" onclick="nextSlide()" title="Наступний (→)">→</button><button class="control-btn" onclick="toggleFullscreen()" title="Повноекранний режим (F)">⛶</button><button class="control-btn" onclick="toggleHelp()" title="Допомога (?)">?</button></div><div class="slide-number" id="slide-number">1 / 19</div><div id="help-overlay" class="hidden"><strong>Гарячі клавіші:</strong><br><kbd>←</kbd> <kbd>→</kbd> Навігація<br><kbd>F</kbd> Повноекранний режим<br><kbd>S</kbd> Sidebar<br><kbd>?</kbd> Допомога<br><kbd>Esc</kbd> Закрити</div></div><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><script>const slides=["<h1>User Stories та Agile Planning</h1>\n<p><strong>Курс:</strong> Основи інженерії програмного забезпечення<br><strong>Лектор:</strong> Кобилянський Антон</p>\n","<h2>📋 План лекції</h2>\n<ol>\n<li>📝 User Story: концепція та формат</li>\n<li>✅ Acceptance Criteria та Given-When-Then</li>\n<li>🎯 INVEST: критерії якості історії</li>\n<li>📊 Story Points та Planning Poker</li>\n<li>🔄 Definition of Ready та Definition of Done</li>\n<li>🗺️ User Story Mapping</li>\n<li>📈 Release Planning</li>\n<li>🧩 Елементи беклогу та розбиття епіків</li>\n<li>🎓 Висновки та контрольні питання</li>\n</ol>\n","<h1>📝 Що таке User Story?</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>User Story</strong> (користувацька історія) - короткий опис функціональності з точки зору кінцевого користувача, написаний простою мовою та сфокусований на цінності для бізнесу.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> історія описує <strong>ЩО</strong> потрібно користувачу та <strong>НАВІЩО</strong>, а не <strong>ЯК</strong> це реалізувати технічно. Технічні рішення залишаються за командою розробки, яка приймає їх під час обговорення історії.</p>\n<p>Такий підхід виник в екстремальному програмуванні (XP) наприкінці 1990-х як відповідь на проблему громіздких специфікацій, які застарівали швидше, ніж їх встигали прочитати. Історія свідомо коротка: її мета не зафіксувати всі деталі, а зафіксувати потребу і запустити діалог між замовником і командою 💬</p>\n<h2>🎭 User Story vs Технічна вимога</h2>\n<table>\n<thead>\n<tr>\n<th>Критерій</th>\n<th>📝 User Story</th>\n<th>⚙️ Технічна вимога</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Приклад</td>\n<td>\"Як покупець, я хочу фільтрувати товари за ціною, щоб швидко знайти товари в моєму бюджеті\"</td>\n<td>\"Система повинна мати REST API endpoint <code>/api/products/filter</code> з параметрами <code>min_price</code>, <code>max_price</code>\"</td>\n</tr>\n<tr>\n<td>Зрозуміла клієнту</td>\n<td>✅ Так</td>\n<td>❌ Ні</td>\n</tr>\n<tr>\n<td>Пояснює цінність</td>\n<td>✅ Так</td>\n<td>❌ Ні</td>\n</tr>\n<tr>\n<td>Стимулює обговорення</td>\n<td>✅ Так</td>\n<td>❌ Закрита специфікація</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Автор підходу</strong> <p>Концепцію User Stories популяризував Майк Кон (Mike Cohn) у книзі \"User Stories Applied\" (2004) 📚</p>\n</div>\n\n","<h1>🧩 Формат \"Як-Хочу-Щоб\"</h1>\n<pre><code class=\"language-plaintext hljs\" data-highlighted=\"yes\">Як [роль / тип користувача],\nя хочу [дія / функціональність],\nщоб [цінність / вигода / мета].</code></pre><p><strong>Приклад:</strong> \"Як покупець, я хочу додавати товари в список бажань, щоб повернутися до них пізніше, коли буде бюджет\" 🛒</p>\n<p>Кожна з трьох частин виконує свою роботу. Роль не дозволяє писати історії для абстрактного \"користувача\": покупець, адміністратор і кур'єр мають різні потреби. Дія описує поведінку системи, яку можна побачити і перевірити. Цінність найважливіша: якщо команда не може сформулювати \"щоб\", варто запитати, чи потрібна ця функція взагалі.</p>\n<table>\n<thead>\n<tr>\n<th>Частина</th>\n<th>Роль у історії</th>\n<th>Питання, на яке відповідає</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>👤 <strong>Роль</strong></td>\n<td>Ідентифікує отримувача цінності</td>\n<td>Для кого це?</td>\n</tr>\n<tr>\n<td>⚡ <strong>Дія</strong></td>\n<td>Описує потрібну поведінку системи</td>\n<td>Що потрібно?</td>\n</tr>\n<tr>\n<td>💎 <strong>Цінність</strong></td>\n<td>Пояснює мотивацію, допомагає приймати дизайн-рішення</td>\n<td>Навіщо це?</td>\n</tr>\n</tbody></table>\n<h2>🃏 Принцип 3C (Рон Джефріс)</h2>\n<p>Історія на картці - лише перший крок. Далі команда обговорює її з Product Owner, уточнює деталі та фіксує домовленості у вигляді критеріїв прийняття.</p>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    A[🃏 Card&lt;br/&gt;Картка з формулюванням] --&gt; B[💬 Conversation&lt;br/&gt;Обговорення з командою]\n    B --&gt; C[✅ Confirmation&lt;br/&gt;Критерії прийняття]\n    style A fill:#e3f2fd,stroke:#1565c0\n    style B fill:#fff3e0,stroke:#ef6c00\n    style C fill:#e8f5e9,stroke:#2e7d32\"><svg id=\"exp-1788848738752-3-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 796.59375px;\" viewBox=\"0 0 796.59375 88\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1788848738752-3-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Ari " height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1788848738752-3-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<div class=\"warning\"><strong>⚠️ Картка - це не контракт</strong> <p>Картка лише нагадує про розмову. Не витрачайте години на ідеальне формулювання замість того, щоб обговорити суть із командою.</p>\n</div>\n\n","<h1>✅ Acceptance Criteria (Критерії прийняття)</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Acceptance Criteria</strong> (AC) - конкретні умови, за яких User Story вважається завершеною. Це чек-лист готовності для команди та Product Owner.</p>\n</div>\n\n\n\n<h2>📐 Формат Given-When-Then</h2>\n<p>Запозичений із підходу <strong>BDD</strong> (Behavior-Driven Development / Розробка, керована поведінкою):</p>\n<pre><code class=\"language-gherkin\">Given [Дано: початковий стан]\nWhen  [Коли: дія користувача]\nThen  [Тоді: очікуваний результат]</code></pre><p>Формат змушує описати три речі: контекст, у якому перебуває користувач, дію, яку він виконує, і результат, який має отримати. Одна історія зазвичай має кілька критеріїв: основний успішний сценарій, альтернативні шляхи та граничні випадки.</p>\n<p><strong>Історія:</strong> \"Як користувач, я хочу входити за відбитком пальця, щоб не вводити пароль щоразу\" 🔐</p>\n<table>\n<thead>\n<tr>\n<th>AC</th>\n<th>Given</th>\n<th>When</th>\n<th>Then</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>AC-1</strong> Успішний вхід</td>\n<td>Користувач налаштував відбиток</td>\n<td>Прикладає палець до сканера</td>\n<td>Потрапляє на головну без пароля</td>\n</tr>\n<tr>\n<td><strong>AC-2</strong> Fallback</td>\n<td>Біометрія не розпізнана 3 рази</td>\n<td>Система пропонує альтернативу</td>\n<td>Користувач бачить форму пароля</td>\n</tr>\n<tr>\n<td><strong>AC-3</strong> Перше використання</td>\n<td>Біометрія ще не налаштована</td>\n<td>Відкриває додаток уперше</td>\n<td>Бачить підказку налаштувати відбиток</td>\n</tr>\n</tbody></table>\n<div class=\"danger\"><strong>🚫 Типова помилка</strong> <p>AC не повинні описувати технічну реалізацію. Формулюйте, <strong>що</strong> має статись, а не <strong>як</strong> це зробити в коді. Для простих історій підходить звичайний чек-лист перевірок.</p>\n</div>\n\n","<h1>🎯 INVEST: критерії якості User Story</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>INVEST</strong> - шість критеріїв якісної User Story, сформульованих Біллом Уейком (Bill Wake) у 2003 році.</p>\n</div>\n\n\n\n<p>INVEST зручно використовувати як чек-лист під час backlog refinement: якщо історія не проходить хоча б один критерій, її переписують або розбивають до того, як вона потрапить у спринт.</p>\n<table>\n<thead>\n<tr>\n<th>Критерій</th>\n<th>Значення</th>\n<th>❌ Погано</th>\n<th>✅ Добре</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>I</strong>ndependent 🔓</td>\n<td>Реалізується окремо від інших</td>\n<td>\"Додати кнопку оплати\" + \"інтегрувати платіжку\"</td>\n<td>\"Оплата карткою через Stripe\"</td>\n</tr>\n<tr>\n<td><strong>N</strong>egotiable 💬</td>\n<td>Деталі можна обговорити</td>\n<td>\"Кнопка червона #FF0000\"</td>\n<td>\"Помітна кнопка оплати\"</td>\n</tr>\n<tr>\n<td><strong>V</strong>aluable 💎</td>\n<td>Приносить цінність</td>\n<td>\"Рефакторинг бази даних\"</td>\n<td>\"Каталог завантажується менш ніж за 2 с\"</td>\n</tr>\n<tr>\n<td><strong>E</strong>stimable 📏</td>\n<td>Команда може оцінити</td>\n<td>\"Покращити продуктивність\"</td>\n<td>\"Кешування топ-100 товарів\"</td>\n</tr>\n<tr>\n<td><strong>S</strong>mall 🔬</td>\n<td>Вміщується в один спринт</td>\n<td>\"Створити мобільний додаток\"</td>\n<td>\"Форма реєстрації в додатку\"</td>\n</tr>\n<tr>\n<td><strong>T</strong>estable 🧪</td>\n<td>Можна перевірити готовність</td>\n<td>\"Додаток має бути швидким\"</td>\n<td>\"Головна завантажується за менш ніж 3 с\"</td>\n</tr>\n</tbody></table>\n<div class=\"warning\"><strong>⚠️ Порушення помітне одразу</strong> <p>Історія \"Як користувач, я хочу покращену систему, щоб працювати швидше\" одночасно неоцінювана, незрозуміла за цінністю, нетестовна і занадто велика.</p>\n</div>\n\n\n\n\n\n<div class=\"success\"><strong>✅ Приклад, що проходить усі шість критеріїв</strong> <p>\"Як менеджер продажів, я хочу бачити топ-10 клієнтів за обсягом покупок на дашборді, щоб фокусуватись на найцінніших клієнтах\" + AC: сортування за 30 днів, оновлення о 8:00, працює на desktop 📊</p>\n</div>\n\n","<h1>📊 Story Points: оцінка складності</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Story Points</strong> (SP) - відносна міра складності User Story, що враховує обсяг роботи, складність та невизначеність. SP не вимірюють час, а порівнюють історії між собою.</p>\n</div>\n\n\n\n<p><strong>Чому не години?</strong> ⏱️ Ту саму задачу junior зробить за 8 годин, а senior за 2, але <strong>складність задачі однакова</strong>. Оцінка в годинах залежить від того, хто саме виконуватиме роботу, і команді доводиться сперечатись про час замість того, щоб обговорювати суть задачі.</p>\n<p><strong>Як це працює на практиці:</strong> команда обирає еталонну історію, яку всі добре розуміють, і присвоює їй, наприклад, 5 SP. Решту історій оцінюють порівнянням: \"Це вдвічі простіше за еталон, отже 2 або 3 SP\". З часом команда дізнається свою velocity, тобто скільки SP вона стабільно закриває за спринт, і саме це число дозволяє переводити оцінки в терміни.</p>\n<h2>🔢 Шкала Фібоначчі</h2>\n<table>\n<thead>\n<tr>\n<th>SP</th>\n<th>Складність</th>\n<th>Приклад</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>1</strong></td>\n<td>Тривіальна</td>\n<td>Виправлення тексту, зміна кольору</td>\n</tr>\n<tr>\n<td><strong>2</strong></td>\n<td>Проста</td>\n<td>Кнопка з готовою логікою</td>\n</tr>\n<tr>\n<td><strong>3</strong></td>\n<td>Середня</td>\n<td>Форма з валідацією</td>\n</tr>\n<tr>\n<td><strong>5</strong></td>\n<td>Помірна</td>\n<td>Інтеграція з API</td>\n</tr>\n<tr>\n<td><strong>8</strong></td>\n<td>Складна</td>\n<td>Нова бізнес-логіка</td>\n</tr>\n<tr>\n<td><strong>13</strong></td>\n<td>Дуже складна</td>\n<td>Складний алгоритм</td>\n</tr>\n<tr>\n<td><strong>21+</strong></td>\n<td>🧱 Epic</td>\n<td>Обов'язково розбити на менші історії</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Чому саме Фібоначчі?</strong> <p>Зростаючі проміжки відбивають зростання невизначеності: різниця між 8 і 13 SP реально більша, ніж між 1 і 2 SP.</p>\n</div>\n\n","<h1>🃏 Planning Poker: оцінка в команді</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Planning Poker</strong> - техніка колективної оцінки, у якій кожен учасник команди має набір карт <code>1, 2, 3, 5, 8, 13, 21, ?, ☕</code> і всі показують оцінку одночасно.</p>\n</div>\n\n\n\n\n<div class=\"mermaid\" data-source=\"sequenceDiagram\n    participant PO as 👔 Product Owner\n    participant T as 👥 Team\n    participant SM as 🎯 Scrum Master\n    PO-&gt;&gt;T: Читає User Story та відповідає на питання\n    SM-&gt;&gt;T: На рахунок три всі показують карти\n    T-&gt;&gt;SM: Усі відкривають оцінки одночасно\n    alt Консенсус\n        SM-&gt;&gt;T: Фіксуємо оцінку\n    else Розбіжності\n        T-&gt;&gt;T: Обговорення причин різниці\n        T-&gt;&gt;T: Повторне голосування\n    end\"><svg id=\"exp-1788848738765-7-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width: 966px;\" viewBox=\"-50 -10 966 661\" role=\"graphics-document document\" aria-roledescription=\"sequence\"><g><rect x=\"716\" y=\"575\" fill=\"#eaeaea\" stroke=\"#666\" width=\"150\" height=\"65\" name=\"SM\" rx=\"3\" ry=\"3\" class=\"actor actor-bottom\"></rect><text x=\"791\" y=\"607.5\" dominant-baseline=\"central\" alignment-baseline=\"central\" class=\"actor actor-box\" style=\"text-anchor: middle; font-size: 16px; font-weight: 400;\"><tspan x=\"79 =\"message\" data-id=\"i2\" data-from=\"T\" data-to=\"SM\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#exp-1788848738765-7-0-arrowhead)\" style=\"fill: none;\"></line><text x=\"625\" y=\"275\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-size: 16px; font-weight: 400;\">Фіксуємо оцінку</text><line x1=\"790\" y1=\"310\" x2=\"459\" y2=\"310\" class=\"messageLine0\" data-et=\"message\" data-id=\"i4\" data-from=\"SM\" data-to=\"T\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#exp-1788848738765-7-0-arrowhead)\" style=\"fill: none;\"></line><text x=\"456\" y=\"370\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-size: 16px; font-weight: 400;\">Обговорення причин різниці</text><path d=\"M 456,405 C 516,395 516,435 456,425\" class=\"messageLine0\" data-et=\"message\" data-id=\"i6\" data-from=\"T\" data-to=\"T\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#exp-1788848738765-7-0-arrowhead)\" style=\"fill: none;\"></path><text x=\"456\" y=\"450\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-size: 16px; font-weight: 400;\">Повторне голосування</text><path d=\"M 456,485 C 516,475 516,515 456,505\" class=\"messageLine0\" data-et=\"message\" data-id=\"i7\" data-from=\"T\" data-to=\"T\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#exp-1788848738765-7-0-arrowhead)\" style=\"fill: none;\"></path></svg></div>\n<p><strong>Хід сесії:</strong> Product Owner зачитує історію та відповідає на питання команди. Далі кожен учасник мовчки обирає карту. За командою Scrum Master усі одночасно відкривають карти. Якщо оцінки близькі, їх фіксують. Якщо різниця суттєва, автори найнижчої та найвищої оцінок пояснюють свою логіку, після чого команда голосує повторно, зазвичай 2-3 раунди достатньо для консенсусу.</p>\n<table>\n<thead>\n<tr>\n<th>Карта</th>\n<th>Значення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>?</strong></td>\n<td>Потрібні пояснення, не можу оцінити</td>\n</tr>\n<tr>\n<td><strong>☕</strong></td>\n<td>Задача занадто велика, потрібна перерва або розбиття</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Сила методу - одночасне відкриття</strong> <p>Ніхто не \"якориться\" на чужій оцінці. Якщо frontend дав 3, а backend 13, зазвичай виявляється, що вони бачили різний обсяг роботи: перший припускав готовий API, другий - інтеграцію з нуля 🔍</p>\n</div>\n\n","<h1>🔄 Definition of Ready та Definition of Done</h1>\n<div class=\"info\"><strong>ℹ️ Дві межі готовності</strong> <p><strong>DoR</strong> (Definition of Ready) відповідає на питання \"Чи готові ми <strong>почати</strong>?\", а <strong>DoD</strong> (Definition of Done) на питання \"Чи ми <strong>закінчили</strong>?\"</p>\n</div>\n\n\n\n<p>Обидва визначення команда узгоджує заздалегідь і записує явно, щоб не сперечатись у кожному спринті окремо. DoR захищає команду від розмитих задач, які неможливо оцінити чи виконати. DoD захищає продукт від \"майже готового\" коду, що не протестований і не задокументований.</p>\n<table>\n<thead>\n<tr>\n<th>🚀 Definition of Ready</th>\n<th>✅ Definition of Done</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Є чіткі Acceptance Criteria</td>\n<td>Код написано та пройшов code review</td>\n</tr>\n<tr>\n<td>Історія оцінена у Story Points</td>\n<td>Виконано unit- та integration-тести</td>\n</tr>\n<tr>\n<td>Немає блокерів та нерозв'язаних залежностей</td>\n<td>Оновлено документацію</td>\n</tr>\n<tr>\n<td>Команда розуміє, що треба зробити</td>\n<td>Задеплоєно на staging</td>\n</tr>\n<tr>\n<td>Є wireframes для візуальних історій</td>\n<td>Product Owner прийняв роботу, AC виконані</td>\n</tr>\n<tr>\n<td>Розмір не перевищує 13 SP</td>\n<td>Немає критичних багів</td>\n</tr>\n</tbody></table>\n<table>\n<thead>\n<tr>\n<th>Критерій</th>\n<th>DoR</th>\n<th>DoD</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Коли</td>\n<td>Перед початком роботи</td>\n<td>Після завершення</td>\n</tr>\n<tr>\n<td>Де перевіряють</td>\n<td>Sprint Planning</td>\n<td>Sprint Review</td>\n</tr>\n<tr>\n<td>Якщо не відповідає</td>\n<td>Історія повертається в Backlog</td>\n<td>Історія не потрапляє в Increment</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Аналогія з кухнею 🍳</strong> <p>DoR перевіряє наявність і свіжість інгредієнтів перед готуванням, DoD - якість готової страви перед подачею.</p>\n</div>\n\n\n\n\n\n<div class=\"warning\"><strong>⚠️ Нюанс</strong> <p>Офіційний Scrum Guide визначає лише <strong>Definition of Done</strong>. DoR є поширеною практикою команд, але не частиною стандарту Scrum.</p>\n</div>\n\n","<h1>🗺️ User Story Mapping</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>User Story Mapping</strong> - візуальна техніка організації історій у вигляді карти, що показує шлях користувача та пріоритети релізів. Запропонована Джеффом Паттоном (Jeff Patton).</p>\n</div>\n\n\n\n<p><strong>Дві осі карти:</strong> горизонталь ➡️ послідовність дій користувача (user journey), вертикаль ⬇️ пріоритети релізів.</p>\n<p>Плоский список беклогу відповідає на питання \"що робити далі?\", але не показує, як окремі історії складаються у цілісний досвід користувача. Story Map будується у три рівні: великі дії користувача (activities), під ними конкретні кроки (tasks), а вже під кроками окремі історії, відсортовані за пріоритетом зверху вниз.</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>🧑‍💻 Реєстрація</th>\n<th>🛒 Покупка</th>\n<th>📦 Отримання</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Tasks</strong> (кроки)</td>\n<td>Ввести email, підтвердити пошту</td>\n<td>Вибрати товар, оплатити</td>\n<td>Відстежити, отримати</td>\n</tr>\n<tr>\n<td><strong>Release 1</strong> 🟢</td>\n<td>Форма реєстрації</td>\n<td>Каталог, оплата карткою</td>\n<td>Адреса доставки</td>\n</tr>\n<tr>\n<td><strong>Release 2</strong> 🟡</td>\n<td>Код підтвердження</td>\n<td>Фільтри, список бажань</td>\n<td>Статус замовлення</td>\n</tr>\n<tr>\n<td><strong>Release 3</strong> ⚪</td>\n<td>Вхід через Google</td>\n<td>Промокоди</td>\n<td>Вибір часу доставки</td>\n</tr>\n</tbody></table>\n<p><strong>Як читати карту:</strong> верхні два рядки - це <strong>backbone</strong> (хребет продукту): активності та кроки користувача зліва направо у тому порядку, в якому він їх виконує. Під кожним кроком історії стоять стовпчиком: найважливіші вгорі, менш важливі нижче. Горизонтальна лінія між рядками - межа релізу.</p>\n","<h1>👕 Story Map на практиці: інтернет-магазин одягу</h1>\n<table>\n<thead>\n<tr>\n<th>Реліз</th>\n<th>🔍 Пошук</th>\n<th>👀 Вибір</th>\n<th>📝 Оформлення</th>\n<th>💳 Оплата</th>\n<th>🚚 Доставка</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>1.0 MVP</strong></td>\n<td>Базовий пошук за назвою</td>\n<td>Картка товару (фото, ціна)</td>\n<td>Форма замовлення</td>\n<td>Оплата карткою</td>\n<td>Адреса доставки</td>\n</tr>\n<tr>\n<td><strong>2.0</strong></td>\n<td>Фільтри (ціна, колір)</td>\n<td>Список бажань</td>\n<td>Промокоди</td>\n<td>Google Pay</td>\n<td>Статус замовлення</td>\n</tr>\n<tr>\n<td><strong>3.0</strong></td>\n<td>Автодоповнення</td>\n<td>Порівняння товарів</td>\n<td>Збережені адреси</td>\n<td>Оплата частинами</td>\n<td>Вибір часу доставки</td>\n</tr>\n</tbody></table>\n<p><strong>Кожна клітинка</strong> - окрема User Story для конкретного етапу journey з певним пріоритетом.</p>\n<p>Зверніть увагу на логіку MVP: перший реліз проходить увесь шлях покупця від пошуку до доставки, але кожен крок реалізований у найпростішому вигляді. Це \"тонкий зріз\" продукту, який уже приносить цінність. Наступні релізи не додають нових етапів, а поглиблюють існуючі.</p>\n<div class=\"success\"><strong>✅ Переваги Story Mapping</strong> <p>✅ Цілісне бачення продукту: одночасно повний шлях користувача та план релізів<br>✅ Виявляє пропуски у функціональності, які не видно у плоскому списку беклогу<br>✅ Спільна мова для команди та стейкхолдерів 🤝</p>\n</div>\n\n","<h1>📈 Release Planning</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Release Plan</strong> - план випуску версії продукту, що визначає, які User Stories реалізують і в які терміни.</p>\n</div>\n\n\n\n<p>Release Plan відповідає на питання замовника \"коли?\" і при цьому не вимагає детальної оцінки в годинах: достатньо знати velocity команди та розмір беклогу в Story Points.</p>\n<h2>📥 Вхідні параметри планування</h2>\n<ul>\n<li>⚡ <strong>Velocity</strong> - скільки SP команда виконує за спринт</li>\n<li>📦 <strong>Розмір беклогу</strong> у Story Points</li>\n<li>🎯 <strong>Пріоритети</strong> історій</li>\n<li>📅 <strong>Фіксовані дати</strong> та deadlines</li>\n</ul>\n<h2>🧮 Спрощена формула</h2>\n<pre><code class=\"language-plaintext hljs\" data-highlighted=\"yes\">Кількість спринтів = Розмір беклогу (SP) / Velocity (SP за спринт)\n\nПриклад: 200 SP / 40 SP = 5 спринтів = 10 тижнів (при 2-тижневих спринтах)</code></pre><div class=\"warning\"><strong>⚠️ Reality Check</strong> <p>До розрахунків додають <strong>буфер 20-30%</strong> на непередбачувані обставини: баги, хвороби, зміни вимог, дослідження.</p>\n</div>\n\n\n\n\n\n<div class=\"note\"><strong>📝 Product Roadmap</strong> <p>На відміну від Release Plan, <strong>Roadmap</strong> - високорівнева стратегія на 3-12 місяців у термінах тем і епіків, а не конкретних історій. Це напрямок, а не контракт: він уточнюється з кожним релізом 🧭</p>\n</div>\n\n","<h1>🧩 Типи елементів беклогу</h1>\n<table>\n<thead>\n<tr>\n<th>Тип</th>\n<th>Опис</th>\n<th>Приклад</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>📝 <strong>User Story</strong></td>\n<td>Функціональна вимога від користувача</td>\n<td>\"Як покупець, я хочу...\"</td>\n</tr>\n<tr>\n<td>🐛 <strong>Bug</strong></td>\n<td>Помилка, відхилення від AC</td>\n<td>\"Кнопка не працює в Safari\"</td>\n</tr>\n<tr>\n<td>🔧 <strong>Technical Task</strong></td>\n<td>Технічний борг, рефакторинг</td>\n<td>\"Оптимізувати SQL-запити\"</td>\n</tr>\n<tr>\n<td>🔬 <strong>Spike</strong></td>\n<td>Time-boxed дослідження</td>\n<td>\"Дослідити AWS vs Azure\"</td>\n</tr>\n<tr>\n<td>🧱 <strong>Epic</strong></td>\n<td>Велика історія, що потребує розбиття</td>\n<td>\"Система авторизації\"</td>\n</tr>\n</tbody></table>\n<p>Bug і Technical Task не мають прямої цінності для користувача, тому їх зазвичай не оцінюють у Story Points або оцінюють окремо. Проте ігнорувати їх не можна: накопичений технічний борг з часом уповільнює реалізацію будь-якої User Story.</p>\n<div class=\"info\"><strong>ℹ️ Spike</strong> <p><strong>Spike</strong> - дослідження з фіксованим відрізком часу для зменшення технічної невизначеності. Результат - не робочий код, а <strong>звіт із рекомендаціями</strong>: чи можливо реалізувати, яка складність, які ризики.<br>Приклад: \"Spike: дослідити інтеграцію з Apple Pay (time-box: 8 годин)\" 🍎</p>\n</div>\n\n\n\n\n\n<div class=\"info\"><strong>ℹ️ Epic</strong> <p><strong>Epic</strong> - історія, яку команда не може виконати за один спринт (зазвичай понад 13 SP). Перед взяттям у роботу епік розбивають на менші історії.</p>\n</div>\n\n","<h1>✂️ Розбиття епіків на User Stories</h1>\n<p>Вибір стратегії залежить від природи епіка: якщо він описує процес, ділимо за кроками шляху; якщо йдеться про сутність, за операціями над нею; якщо про один сценарій із варіантами, за варіаціями.</p>\n<table>\n<thead>\n<tr>\n<th>Стратегія</th>\n<th>Епік</th>\n<th>Результат розбиття</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🚶 <strong>За user journey</strong></td>\n<td>Система реєстрації</td>\n<td>Форма реєстрації, Email-підтвердження, Профіль, Відновлення пароля</td>\n</tr>\n<tr>\n<td>📋 <strong>За CRUD-операціями</strong></td>\n<td>Управління товарами</td>\n<td>Create, Read, Update, Delete окремо</td>\n</tr>\n<tr>\n<td>🔀 <strong>За варіаціями даних</strong></td>\n<td>Оплата замовлення</td>\n<td>Карткою, через PayPal, через Google Pay</td>\n</tr>\n<tr>\n<td>📱 <strong>За платформами</strong></td>\n<td>Мобільний додаток</td>\n<td>iOS-версія, Android-версія, tablet-версія</td>\n</tr>\n<tr>\n<td>📶 <strong>Від MVP до Enhanced</strong></td>\n<td>Пошук товарів</td>\n<td>Базовий пошук, пошук із фільтрами, автодоповнення</td>\n</tr>\n</tbody></table>\n<div class=\"success\"><strong>✅ Ключове правило</strong> <p>Кожна мала історія має <strong>приносити цінність користувачу</strong> і бути потенційно готовою до релізу.</p>\n</div>\n\n\n\n\n\n<div class=\"danger\"><strong>🚫 Ознака неправильного розбиття</strong> <p>Якщо після розбиття отримуєте \"технічні\" фрагменти на кшталт \"налаштувати базу даних\" без зрозумілої цінності, вісь поділу обрана неправильно. Змініть стратегію ❌</p>\n</div>\n\n","<h1>🎓 Ключові висновки</h1>\n<div class=\"success\"><strong>✅ Що потрібно запам'ятати</strong> <ol>\n<li>📝 <strong>User Story</strong> описує ЩО і НАВІЩО з позиції користувача, а не ЯК реалізувати</li>\n<li>🧩 Шаблон <strong>\"Як-Хочу-Щоб\"</strong>: роль, дія, цінність. Картка - нагадування про розмову (3C)</li>\n<li>✅ <strong>Acceptance Criteria</strong> у форматі Given-When-Then роблять історію перевірюваною</li>\n<li>🎯 <strong>INVEST</strong> - шість критеріїв якісної історії</li>\n<li>📊 <strong>Story Points</strong> порівнюють складність історій між собою, а не вимірюють час</li>\n<li>🃏 <strong>Planning Poker</strong> усуває вплив авторитету через одночасне відкриття карт</li>\n<li>🔄 <strong>DoR</strong> перевіряють перед спринтом, <strong>DoD</strong> після завершення роботи</li>\n<li>🗺️ <strong>Story Map</strong> показує шлях користувача та пріоритети релізів</li>\n<li>📈 <strong>Release Plan</strong> = беклог / velocity + буфер 20-30%</li>\n<li>✂️ Епіки розбивають так, щоб кожна частина мала цінність для користувача</li>\n</ol>\n</div>\n\n","<h1>❓ Контрольні питання</h1>\n<p><strong>1. User Story vs технічна вимога</strong> 📝</p>\n<ul>\n<li>У чому принципова відмінність? Яке призначення кожної з трьох частин шаблону \"Як-Хочу-Щоб\"?</li>\n</ul>\n<p><strong>2. Acceptance Criteria</strong> ✅</p>\n<ul>\n<li>Опишіть формат Given-When-Then. Наведіть власний приклад AC для функції відновлення пароля</li>\n</ul>\n<p><strong>3. INVEST</strong> 🎯</p>\n<ul>\n<li>Перелічіть критерії. Наведіть приклад порушення для трьох із них</li>\n</ul>\n<p><strong>4. Story Points та Planning Poker</strong> 📊</p>\n<ul>\n<li>Чому команди оцінюють у Story Points, а не в годинах?</li>\n<li>Чому одночасне відкриття карт є принциповою частиною методу?</li>\n</ul>\n<p><strong>5. DoR та DoD</strong> 🔄</p>\n<ul>\n<li>Сформулюйте різницю. На якій події Scrum застосовується кожне визначення?</li>\n</ul>\n<p><strong>6. Story Mapping та Release Planning</strong> 🗺️</p>\n<ul>\n<li>Що показують горизонтальна та вертикальна осі карти?</li>\n<li>Як розрахувати кількість спринтів для релізу?</li>\n</ul>\n<p><strong>7. Розбиття епіків</strong> ✂️</p>\n<ul>\n<li>Назвіть три техніки розбиття. Чим результат Spike відрізняється від результату User Story?</li>\n</ul>\n","<h1>📖 Глосарій термінів</h1>\n<table>\n<thead>\n<tr>\n<th>Термін</th>\n<th>Англійською</th>\n<th>Визначення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Користувацька історія</strong></td>\n<td>User Story</td>\n<td>Короткий опис функціональності з точки зору користувача, сфокусований на цінності</td>\n</tr>\n<tr>\n<td><strong>Критерії прийняття</strong></td>\n<td>Acceptance Criteria</td>\n<td>Конкретні умови, за яких історія вважається завершеною</td>\n</tr>\n<tr>\n<td><strong>Story Points</strong></td>\n<td>Story Points</td>\n<td>Відносна міра складності історії, що враховує обсяг, складність і невизначеність</td>\n</tr>\n<tr>\n<td><strong>Planning Poker</strong></td>\n<td>Planning Poker</td>\n<td>Техніка колективної оцінки з одночасним відкриттям карт</td>\n</tr>\n<tr>\n<td><strong>Швидкість команди</strong></td>\n<td>Velocity</td>\n<td>Кількість Story Points, яку команда виконує за спринт</td>\n</tr>\n<tr>\n<td><strong>Епік</strong></td>\n<td>Epic</td>\n<td>Велика історія, що не вміщується в один спринт і потребує розбиття</td>\n</tr>\n<tr>\n<td><strong>Спайк</strong></td>\n<td>Spike</td>\n<td>Time-boxed дослідження для зменшення технічної невизначеності</td>\n</tr>\n<tr>\n<td><strong>Карта історій</strong></td>\n<td>User Story Map</td>\n<td>Візуальна структура історій за шляхом користувача та пріоритетами релізів</td>\n</tr>\n<tr>\n<td><strong>План релізу</strong></td>\n<td>Release Plan</td>\n<td>План випуску версії продукту з конкретними історіями та термінами</td>\n</tr>\n<tr>\n<td><strong>Дорожня карта</strong></td>\n<td>Product Roadmap</td>\n<td>Високорівнева стратегія продукту на 3-12 місяців</td>\n</tr>\n</tbody></table>\n","<h1>🔤 Глосарій абревіатур</h1>\n<table>\n<thead>\n<tr>\n<th>Абревіатура</th>\n<th>Розшифровка</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>AC</strong></td>\n<td>Acceptance Criteria / Критерії прийняття</td>\n</tr>\n<tr>\n<td><strong>BDD</strong></td>\n<td>Behavior-Driven Development / Розробка, керована поведінкою</td>\n</tr>\n<tr>\n<td><strong>INVEST</strong></td>\n<td>Independent, Negotiable, Valuable, Estimable, Small, Testable</td>\n</tr>\n<tr>\n<td><strong>SP</strong></td>\n<td>Story Points / Одиниці оцінки складності історії</td>\n</tr>\n<tr>\n<td><strong>DoR</strong></td>\n<td>Definition of Ready / Визначення готовності до роботи</td>\n</tr>\n<tr>\n<td><strong>DoD</strong></td>\n<td>Definition of Done / Визначення завершеності</td>\n</tr>\n<tr>\n<td><strong>PO</strong></td>\n<td>Product Owner / Власник продукту</td>\n</tr>\n<tr>\n<td><strong>MVP</strong></td>\n<td>Minimum Viable Product / Мінімально життєздатний продукт</td>\n</tr>\n<tr>\n<td><strong>CRUD</strong></td>\n<td>Create, Read, Update, Delete / Створення, читання, оновлення, видалення</td>\n</tr>\n<tr>\n<td><strong>API</strong></td>\n<td>Application Programming Interface / Програмний інтерфейс застосунку</td>\n</tr>\n</tbody></table>\n","<h1>🎉 Дякую за увагу!</h1>\n<p><strong>Пам'ятайте:</strong> User Story - це не документ, а запрошення до розмови між бізнесом і командою 💬</p>\n<p><strong>Питання?</strong> 🙋‍♂️</p>\n"];let currentSlideIndex=0;
function renderMath(root){if(typeof renderMathInElement!=="function"||!root)return;try{renderMathInElement(root,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\[",right:"\\]",display:true},{left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false}],throwOnError:false,strict:"ignore",ignoredTags:["script","noscript","style","textarea","pre","code"]});}catch(e){console.warn("Math render error:",e);}}
function showSlide(i){if(i<0||i>=slides.length)return;currentSlideIndex=i;const el=document.getElementById("current-slide");el.innerHTML=slides[i];el.scrollTop=0;renderMath(el);document.getElementById("progress-bar").style.width=((i+1)/slides.length*100)+"%";document.getElementById("slide-number").textContent=(i+1)+" / "+slides.length;updateSidebarActive();}
function nextSlide(){if(currentSlideIndex<slides.length-1)showSlide(currentSlideIndex+1);}
function previousSlide(){if(currentSlideIndex>0)showSlide(currentSlideIndex-1);}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open");}
function toggleHelp(){document.getElementById("help-overlay").classList.toggle("hidden");}
function toggleFullscreen(){if(!document.fullscreenElement){const pc=document.getElementById("presentation-container");if(pc.requestFullscreen)pc.requestFullscreen();else if(pc.webkitRequestFullscreen)pc.webkitRequestFullscreen();else if(pc.msRequestFullscreen)pc.msRequestFullscreen();else if(pc.mozRequestFullScreen)pc.mozRequestFullScreen();}else{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();else if(document.msExitFullscreen)document.msExitFullscreen();else if(document.mozCancelFullScreen)document.mozCancelFullScreen();}}
function generateSidebar(){const sc=document.getElementById("sidebar-content");sc.innerHTML="";slides.forEach((html,idx)=>{const t=document.createElement("div");t.className="slide-thumbnail";if(idx===0)t.classList.add("active");const tmp=document.createElement("div");tmp.innerHTML=html;const title=tmp.querySelector("h1,h2");const titleText=title?title.textContent:("Слайд "+(idx+1));const textContent=tmp.textContent.replace(/s+/g," ").trim();const preview=textContent.substring(0,100)+(textContent.length>100?"...":"");t.innerHTML="<div class=\"slide-thumbnail-number\">"+(idx+1)+"</div><div class=\"slide-thumbnail-title\">"+titleText+"</div><div class=\"slide-thumbnail-content\">"+preview+"</div>";t.onclick=()=>{showSlide(idx);if(window.innerWidth<1024)toggleSidebar();};sc.appendChild(t);});}
function updateSidebarActive(){document.querySelectorAll(".slide-thumbnail").forEach((th,idx)=>{if(idx===currentSlideIndex){th.classList.add("active");th.scrollIntoView({behavior:"smooth",block:"nearest"});}else th.classList.remove("active");});}
document.addEventListener("keydown",e=>{switch(e.key){case"ArrowLeft":previousSlide();break;case"ArrowRight":case" ":e.preventDefault();nextSlide();break;case"f":case"F":toggleFullscreen();break;case"s":case"S":toggleSidebar();break;case"?":toggleHelp();break;case"Escape":const sb=document.getElementById("sidebar");const ho=document.getElementById("help-overlay");if(sb.classList.contains("open"))toggleSidebar();else if(!ho.classList.contains("hidden"))ho.classList.add("hidden");break;}});
generateSidebar();showSlide(0);</script></body></html>
