</div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1795358516242-19-0-flowchart-S-12\" data-look=\"classic\" transform=\"translate(728, 300)\"><rect class=\"basic label-container\" style=\"fill:#fff3e0 !important;stroke:#ef6c00 !important\" x=\"-64.9453125\" y=\"-24\" width=\"129.890625\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-40.9453125, -12)\"><rect></rect><foreignObject width=\"81.890625\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>🎯 Strategy</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1795358516242-19-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1795358516242-19-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<div class=\"tip\"><strong>💡 Як не сплутати Decorator і Strategy</strong> <p>Обидва спираються на делегування, але <strong>Decorator змінює об'єкт \"зовні\"</strong>: додає шари навколо, зберігаючи його інтерфейс. <strong>Strategy змінює об'єкт \"зсередини\"</strong>: підміняє одну з його внутрішніх частин. Декораторів може бути багато одночасно, активна стратегія в контексті одна.</p>\n</div>\n\n","<h1>💡 Ключові висновки</h1>\n<div class=\"success\"><strong>✅ Головні тези лекції</strong> <ol>\n<li><p>🎁 <strong>Decorator</strong> розв'язує проблему комбінаторного вибуху підкласів: поведінка додається обгортками з тим самим інтерфейсом, які можна вільно комбінувати та повторювати</p>\n</li>\n<li><p>👀 <strong>Observer</strong> замінює постійне опитування сповіщенням: суб'єкт сам повідомляє всіх підписаних спостерігачів у момент зміни стану</p>\n</li>\n<li><p>🎯 <strong>Strategy</strong> замінює розгалужену умовну логіку набором взаємозамінних класів: контекст делегує роботу поточній стратегії</p>\n</li>\n<li><p>🧩 <strong>Спільна основа:</strong> програмування до інтерфейсу та композиція замість наслідування. Саме вони забезпечують слабку зв'язність і дотримання принципу Open/Closed</p>\n</li>\n<li><p>⚖️ <strong>Патерн обирають за задачею</strong>, а не за схожістю структури: додати поведінку, сповістити про зміну або замінити алгоритм</p>\n</li>\n</ol>\n</div>\n\n\n\n\n\n<div class=\"tip\"><strong>💡 Практичні поради</strong> <ul>\n<li>🎁 <strong>Decorator:</strong> не будуйте надто довгих ланцюжків, їх важко налагоджувати</li>\n<li>🔔 <strong>Observer:</strong> кожній підписці має відповідати відписка, інакше виникає витік пам'яті</li>\n<li>🎯 <strong>Strategy:</strong> створення стратегій зручно зосередити у фабриці</li>\n</ul>\n</div>\n\n\n\n\n\n<div class=\"warning\"><strong>⚠️ Застереження</strong> <p>Патерн це інструмент, а не мета. Для двох простих варіантів, які не змінюватимуться, звичайний <code>if</code> зрозуміліший за ієрархію класів. Застосовуйте патерн тоді, коли є реальна проблема, яку він розв'язує.</p>\n</div>\n\n","<h1>❓ Контрольні питання</h1>\n<ol>\n<li><p>🎁 Сформулюйте проблему комбінаторного вибуху. Скільки класів довелося б створити для системи з шістьма незалежними добавками без застосування Decorator і скільки потрібно з ним?</p>\n</li>\n<li><p>🎁 Чому в Decorator застосовується композиція, а не наслідування? Чи можна обгорнути об'єкт тим самим декоратором двічі та що це означатиме?</p>\n</li>\n<li><p>👀 Які недоліки має модель polling і як Observer їх усуває? Чому кажуть, що Observer забезпечує слабку зв'язність?</p>\n</li>\n<li><p>👀 Чим відрізняються push- і pull-модель в Observer? Що таке витік спостерігачів і як йому запобігти?</p>\n</li>\n<li><p>🎯 Які принципи SOLID порушує вибір алгоритму через <code>if-else</code>? Що зміниться в класі <code>ShoppingCart</code> при додаванні нового способу оплати?</p>\n</li>\n<li><p>🏭 Яку задачу розв'язує поєднання Strategy з Factory?</p>\n</li>\n<li><p>⚖️ Порівняйте Decorator, Observer і Strategy за категорією, призначенням і характером зв'язку. Наведіть по одному прикладу зі стандартної бібліотеки Java.</p>\n</li>\n</ol>\n<div class=\"tip\"><strong>💡 Практичне завдання 💻</strong> <p>Напишіть код замовлення кави з подвійним молоком і цукром та обчисліть його вартість (кава 25 грн, молоко +5 грн, цукор +2 грн). Потім реалізуйте Strategy для обчислення знижки: без знижки, студентська 10%, VIP 25%.</p>\n</div>\n\n","<h1>📖 Глосарій термінів</h1>\n<table>\n<thead>\n<tr>\n<th>Термін</th>\n<th>English</th>\n<th>Визначення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Декоратор</td>\n<td>Decorator</td>\n<td>Структурний патерн для динамічного додавання поведінки через обгортання</td>\n</tr>\n<tr>\n<td>Обгортка</td>\n<td>Wrapper</td>\n<td>Об'єкт, що містить інший об'єкт і має той самий інтерфейс</td>\n</tr>\n<tr>\n<td>Компонент</td>\n<td>Component</td>\n<td>Спільний інтерфейс базового об'єкта та декораторів</td>\n</tr>\n<tr>\n<td>Комбінаторний вибух</td>\n<td>Combinatorial explosion</td>\n<td>Експоненційне зростання кількості класів при описі комбінацій наслідуванням</td>\n</tr>\n<tr>\n<td>Спостерігач</td>\n<td>Observer</td>\n<td>Поведінковий патерн сповіщення залежних об'єктів; також об'єкт-отримувач</td>\n</tr>\n<tr>\n<td>Суб'єкт</td>\n<td>Subject, Publisher</td>\n<td>Об'єкт, за яким спостерігають і який розсилає сповіщення</td>\n</tr>\n<tr>\n<td>Опитування</td>\n<td>Polling</td>\n<td>Періодична перевірка стану джерела самим споживачем</td>\n</tr>\n<tr>\n<td>Push-модель</td>\n<td>Push model</td>\n<td>Суб'єкт передає дані події безпосередньо в сповіщенні</td>\n</tr>\n<tr>\n<td>Pull-модель</td>\n<td>Pull model</td>\n<td>Спостерігач сам запитує потрібні дані в суб'єкта</td>\n</tr>\n<tr>\n<td>Витік спостерігачів</td>\n<td>Observer leak</td>\n<td>Утримання в пам'яті спостерігача, який не відписався</td>\n</tr>\n<tr>\n<td>Стратегія</td>\n<td>Strategy</td>\n<td>Поведінковий патерн інкапсуляції взаємозамінних алгоритмів</td>\n</tr>\n<tr>\n<td>Контекст</td>\n<td>Context</td>\n<td>Клас, що зберігає стратегію та делегує їй виконання операції</td>\n</tr>\n<tr>\n<td>Делегування</td>\n<td>Delegation</td>\n<td>Передача виконання операції іншому об'єкту</td>\n</tr>\n<tr>\n<td>Композиція</td>\n<td>Composition</td>\n<td>Побудова поведінки через об'єкти-складники замість наслідування</td>\n</tr>\n<tr>\n<td>Слабка зв'язність</td>\n<td>Loose coupling</td>\n<td>Мінімальна залежність класів один від одного, зазвичай через інтерфейси</td>\n</tr>\n</tbody></table>\n","<h1>📖 Глосарій абревіатур</h1>\n<table>\n<thead>\n<tr>\n<th>Абревіатура</th>\n<th>Розшифровка</th>\n<th>Переклад</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>GoF</td>\n<td>Gang of Four</td>\n<td>\"Банда чотирьох\", автори класичного каталогу патернів</td>\n</tr>\n<tr>\n<td>SOLID</td>\n<td>Single responsibility, Open/Closed, Liskov substitution, Interface segregation, Dependency inversion</td>\n<td>П'ять принципів об'єктно-орієнтованого дизайну</td>\n</tr>\n<tr>\n<td>SRP</td>\n<td>Single Responsibility Principle</td>\n<td>Принцип єдиної відповідальності</td>\n</tr>\n<tr>\n<td>OCP</td>\n<td>Open/Closed Principle</td>\n<td>Принцип відкритості/закритості</td>\n</tr>\n<tr>\n<td>I/O</td>\n<td>Input/Output</td>\n<td>Введення-виведення</td>\n</tr>\n<tr>\n<td>GUI</td>\n<td>Graphical User Interface</td>\n<td>Графічний інтерфейс користувача</td>\n</tr>\n<tr>\n<td>UI</td>\n<td>User Interface</td>\n<td>Інтерфейс користувача</td>\n</tr>\n<tr>\n<td>MVC</td>\n<td>Model-View-Controller</td>\n<td>Модель-Представлення-Контролер</td>\n</tr>\n<tr>\n<td>DOM</td>\n<td>Document Object Model</td>\n<td>Об'єктна модель документа</td>\n</tr>\n</tbody></table>\n"];let currentSlideIndex=0;
function renderMath(root){if(typeof renderMathInElement!=="function"||!root)return;try{renderMathInElement(root,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\[",right:"\\]",display:true},{left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false}],throwOnError:false,strict:"ignore",ignoredTags:["script","noscript","style","textarea","pre","code"]});}catch(e){console.warn("Math render error:",e);}}
function showSlide(i){if(i<0||i>=slides.length)return;currentSlideIndex=i;const el=document.getElementById("current-slide");el.innerHTML=slides[i];el.scrollTop=0;renderMath(el);document.getElementById("progress-bar").style.width=((i+1)/slides.length*100)+"%";document.getElementById("slide-number").textContent=(i+1)+" / "+slides.length;updateSidebarActive();}
function nextSlide(){if(currentSlideIndex<slides.length-1)showSlide(currentSlideIndex+1);}
function previousSlide(){if(currentSlideIndex>0)showSlide(currentSlideIndex-1);}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open");}
function toggleHelp(){document.getElementById("help-overlay").classList.toggle("hidden");}
function toggleFullscreen(){if(!document.fullscreenElement){const pc=document.getElementById("presentation-container");if(pc.requestFullscreen)pc.requestFullscreen();else if(pc.webkitRequestFullscreen)pc.webkitRequestFullscreen();else if(pc.msRequestFullscreen)pc.msRequestFullscreen();else if(pc.mozRequestFullScreen)pc.mozRequestFullScreen();}else{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();else if(document.msExitFullscreen)document.msExitFullscreen();else if(document.mozCancelFullScreen)document.mozCancelFullScreen();}}
function generateSidebar(){const sc=document.getElementById("sidebar-content");sc.innerHTML="";slides.forEach((html,idx)=>{const t=document.createElement("div");t.className="slide-thumbnail";if(idx===0)t.classList.add("active");const tmp=document.createElement("div");tmp.innerHTML=html;const title=tmp.querySelector("h1,h2");const titleText=title?title.textContent:("Слайд "+(idx+1));const textContent=tmp.textContent.replace(/s+/g," ").trim();const preview=textContent.substring(0,100)+(textContent.length>100?"...":"");t.innerHTML="<div class=\"slide-thumbnail-number\">"+(idx+1)+"</div><div class=\"slide-thumbnail-title\">"+titleText+"</div><div class=\"slide-thumbnail-content\">"+preview+"</div>";t.onclick=()=>{showSlide(idx);if(window.innerWidth<1024)toggleSidebar();};sc.appendChild(t);});}
function updateSidebarActive(){document.querySelectorAll(".slide-thumbnail").forEach((th,idx)=>{if(idx===currentSlideIndex){th.classList.add("active");th.scrollIntoView({behavior:"smooth",block:"nearest"});}else th.classList.remove("active");});}
document.addEventListener("keydown",e=>{switch(e.key){case"ArrowLeft":previousSlide();break;case"ArrowRight":case" ":e.preventDefault();nextSlide();break;case"f":case"F":toggleFullscreen();break;case"s":case"S":toggleSidebar();break;case"?":toggleHelp();break;case"Escape":const sb=document.getElementById("sidebar");const ho=document.getElementById("help-overlay");if(sb.classList.contains("open"))toggleSidebar();else if(!ho.classList.contains("hidden"))ho.classList.add("hidden");break;}});
generateSidebar();showSlide(0);</script></body></html>
