<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Традиційні методології розробки ПЗ</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><style>* {
            margin: 0;
            padding: 0;

        }

        body {

            transition: all 0.3s;

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #4a5568;
            color: white;
        }

        .btn-secondary:hover {
            background: #2d3748;
        }

        #markdown-input {
            flex: 1;
            padding: 2rem;

            color: #e2e8f0;
            border: none;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            line-height: 1.6;
            resize: none;
        }

        #markdown-input:focus {
            outline: none;
        }

        .slide-container {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .slide {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 90%;
            max-height: 85vh;

            padding: 3rem;
            position: relative;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {

                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide::-webkit-scrollbar {
            width: 8px;
        }

        .slide::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .slide::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .slide h1 {
            color: #667eea;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 3px solid #667eea;
            padding-bottom: 0.5rem;

        .slide h2 {

            margin: 2rem 0 1rem 0;
        }

        .slide h3 {
            color: #4a5568;

            margin: 1.5rem 0 1rem 0;
        }

        .slide p {

            line-height: 1.8;
            margin-bottom: 1rem;
        }

        .slide ul, .slide ol {

            margin-bottom: 1rem;
        }

        .slide li {
            color: #2d3748;
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 0.5rem;
        }

        .slide pre {
            background: #282c34;
            border-radius: 10px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            overflow-x: auto;
        }

        .slide pre code {
            background: transparent;
            color: #abb2bf;
        }

        .slide code {
            font-family: 'Courier New', Consolas, Monaco, monospace;
            font-size: 0.95em;
            line-height: 1.5;
        }

        .slide h1 code, .slide h2 code, .slide h3 code {
            font-size: 0.85em;

            padding: 0.1em 0.3em;
            border-radius: 3px;

        .slide p code {
            background: #edf2f7;
            color: #e53e3e;
            padding: 0.2rem 0.4rem;

            font-size: 0.9em;
        }

        .slide blockquote {
            border-left: 4px solid #667eea;
            padding-left: 1.5rem;
            margin: 1.5rem 0;
            font-style: italic;
            color: #4a5568;
        }

        .slide img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 1.5rem 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .slide table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
        }

        .slide th, .slide td {
            border: 1px solid #e2e8f0;
            padding: 0.75rem;
            text-align: left;
        }

        .slide th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }

        .slide tr:nth-child(even) {

        }

        .note {

            border-left: 4px solid #fc8181;
            padding: 1rem;
            margin: 1.5rem 0;
            border-radius: 5px;

        .note strong {

        }

        .warning {
            background: #fffaf0;
            border-left: 4px solid #f6ad55;
            padding: 1rem;
            margin: 1.5rem 0;
            border-radius: 5px;
        }

        .warning strong {
            color: #c05621;
        }

        .info {
            background: #ebf8ff;
            border-left: 4px solid #4299e1;
            padding: 1rem;
            margin: 1.5rem 0;
            border-radius: 5px;
        }

        .info strong {
            color: #2c5282;
        }

        .success {
            background: #f0fff4;
            border-left: 4px solid #48bb78;
            padding: 1rem;
            margin: 1.5rem 0;
            border-radius: 5px;
        }

        .success strong {
            color: #22543d;
        }

        .danger {
            background: #fff5f5;
            border-left: 4px solid #f56565;
            padding: 1rem;
            margin: 1.5rem 0;
            border-radius: 5px;
        }

        .danger strong {
            color: #742a2a;
        }

        .tip {
            background: #fefcbf;
            border-left: 4px solid #ecc94b;
            padding: 1rem;
            margin: 1.5rem 0;
            border-radius: 5px;
        }

        .tip strong {
            color: #744210;
        }

            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            z-index: 100;

        .control-btn {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;

        .progress-bar {
            height: 100%;
            background: white;
            transition: width 0.3s;
        }

        .slide-number {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(255, 255, 255, 0.9);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            color: #667eea;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

            position: fixed;
            right: -320px;
            top: 0;
            width: 320px;
            height: 100vh;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.2);

            padding: 1rem;

            width: 6px;

        #sidebar::-webkit-scrollbar-track {
            background: #f1f1f1;

            background: #667eea;
            border-radius: 3px;
        }

        #sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #667eea;
        }

        #sidebar-header h3 {
            color: #667eea;
            font-size: 1.2rem;
            margin: 0;
        }

        #sidebar-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #4a5568;
            padding: 0.25rem;
            line-height: 1;
        }

        #sidebar-close:hover {
            color: #667eea;
        }

        .slide-thumbnail {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 0.75rem;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            overflow: hidden;
        }

        .slide-thumbnail:hover {

        }

        .slide-thumbnail.active {

            background: #f7faff;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .slide-thumbnail-number {
            display: inline-block;

            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .slide-thumbnail-content {
            font-size: 0.85rem;
            color: #2d3748;
            line-height: 1.4;
            max-height: 4.2rem;
            overflow: hidden;
            position: relative;
        }

        .slide-thumbnail-content::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 50%;
            height: 1.4rem;
            background: linear-gradient(to right, transparent, white);
        }

        .slide-thumbnail.active .slide-thumbnail-content::after {
            background: linear-gradient(to right, transparent, #f7faff);
        }

        .slide-thumbnail-title {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 0.25rem;
        }

        #sidebar-toggle {
            position: fixed;
            right: 1rem;
            top: 1rem;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 8px;
            width: 45px;
            height: 45px;
            cursor: pointer;
            font-size: 1.3rem;

            align-items: center;
            justify-content: center;

            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);

        }

        #sidebar-toggle:hover {

        }

        .mermaid {

        /* Запобігаємо обрізанню останньої літери в нодах Mermaid через зміну font-weight після розрахунку розміру */

        /* перестраховка проти обрізання foreignObject (на випадок інших діаграм) */

        #help-overlay {

            right: 1rem;
            background: rgba(255, 255, 255, 0.9);

            background: #fff5f5;
            border: 1px solid #fed7d7;
            padding: 1rem;
            border-radius: 6px;
            color: #742a2a;
            margin: 1.5rem 0;
        }

        .mermaid-error pre {
            margin-top: 0.5rem;
            font-size: 0.75rem;
            white-space: pre-wrap;
        }

        #presentation-container:fullscreen {

        #presentation-container:-moz-full-screen {

#presentation-container:fullscreen,#presentation-container:-webkit-full-screen,#presentation-container:-moz-full-screen,#presentation-container:-ms-fullscreen{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)!important;}</style></head><body><div id="presentation-container"><div class="progress"><div class="progress-bar" id="progress-bar"></div></div><button id="sidebar-toggle" onclick="toggleSidebar()" title="Навігація слайдами (S)">☰</button><div id="sidebar"><div id="sidebar-header"><h3>📑 Слайди</h3><button id="sidebar-close" onclick="toggleSidebar()">✕</button></div><div id="sidebar-content"></div></div><div class="slide-container"><div class="slide" id="current-slide"></div></div><div class="controls"><button class="control-btn" onclick="previousSlide()" title="Попередній (←)">←</button><button class="control-btn" onclick="nextSlide()" title="Наступний (→)">→</button><button class="control-btn" onclick="toggleFullscreen()" title="Повноекранний режим (F)">⛶</button><button class="control-btn" onclick="toggleHelp()" title="Допомога (?)">?</button></div><div class="slide-number" id="slide-number">1 / 20</div><div id="help-overlay" class="hidden"><strong>Гарячі клавіші:</strong><br><kbd>←</kbd> <kbd>→</kbd> Навігація<br><kbd>F</kbd> Повноекранний режим<br><kbd>S</kbd> Sidebar<br><kbd>?</kbd> Допомога<br><kbd>Esc</kbd> Закрити</div></div><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><script>const slides=["<h1>Традиційні методології розробки ПЗ</h1>\n<p><strong>Курс:</strong> Основи інженерії програмного забезпечення</p>\n<p><strong>Лектор:</strong> Кобилянський Антон</p>\n","<h1>📋 План лекції</h1>\n<ol>\n<li>🧭 Що таке методологія розробки ПЗ</li>\n<li>🌊 Waterfall: каскадна модель</li>\n<li>📐 V-Model: тестування з першого дня</li>\n<li>🧱 Incremental: доставка частинами</li>\n<li>🌀 Spiral: розробка через управління ризиками</li>\n<li>⚖️ Порівняння та вибір методології</li>\n<li>📚 Глосарій</li>\n</ol>\n","<h1>🧭 Що таке методологія розробки ПЗ</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Методологія розробки ПЗ</strong> (Software Development Methodology) - структурований підхід до організації процесу створення програмного забезпечення, який визначає послідовність фаз, ролі учасників, артефакти та практики.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> SDLC відповідає на питання <strong>що</strong> виконується під час створення ПЗ, а методологія на питання <strong>як</strong> команда проходить через ці фази: у якій послідовності, чи можна повертатися назад, чи доставляється продукт частинами.</p>\n\n<div class=\"mermaid\" data-source=\"graph TD\n    A[🧭 Методології розробки ПЗ] --&gt; B[📋 Традиційні&lt;br/&gt;Plan-driven]\n    A --&gt; C[🔄 Гнучкі&lt;br/&gt;Agile]\n    B --&gt; D[🌊 Waterfall]\n    B --&gt; E[📐 V-Model]\n    B --&gt; F[🧱 Incremental]\n    B --&gt; G[🌀 Spiral]\n    C --&gt; H[Scrum]\n    C --&gt; I[Kanban]\n    C --&gt; J[XP]\n    style A fill:#e3f2fd,stroke:#1565c0\n    style B fill:#fff3e0,stroke:#ef6c00\n    style C fill:#e8f5e9,stroke:#388e3c\n    style D fill:#fff9c4,stroke:#f9a825\n    style E fill:#fff9c4,stroke:#f9a825\n    style F fill:#fff9c4,stroke:#f9a825\n    style G fill:#fff9c4,stroke:#f9a825\"><svg id=\"exp-1788587135240-2-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 1123.40625px;\" viewBox=\"0 0 1123.40625 308\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1788587135240-2-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1788587135240-2-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#e \n<div class=\"warning\"><strong>⚠️ Ключова характеристика</strong> <p>Клієнт бачить робочий продукт лише наприкінці проєкту, часто через 12-18 місяців після старту.</p>\n</div>\n\n","<h1>🌊 Waterfall: переваги, недоліки та застосування</h1>\n<p><strong>Головна ідея:</strong> Waterfall дає максимальну передбачуваність ціною повної відсутності гнучкості.</p>\n<table>\n<thead>\n<tr>\n<th>✅ Переваги</th>\n<th>❌ Недоліки</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Чіткість: усі вимоги відомі на старті</td>\n<td>Повільність: перший результат через місяці або роки</td>\n</tr>\n<tr>\n<td>Передбачуваність бюджету та термінів</td>\n<td>Негнучкість: зміна вимог посеред проєкту дуже дорога</td>\n</tr>\n<tr>\n<td>Детальна документація на кожному етапі</td>\n<td>Пізнє тестування: дефекти виявляються наприкінці</td>\n</tr>\n<tr>\n<td>Проста координація команд</td>\n<td>Пізній фідбек: клієнт не може коригувати продукт</td>\n</tr>\n<tr>\n<td>Легкий контроль прогресу за завершеними фазами</td>\n<td>Високий ризик невідповідності очікуванням</td>\n</tr>\n</tbody></table>\n<div class=\"success\"><strong>✅ Коли доречно</strong> <ul>\n<li>Стабільні та повністю зрозумілі вимоги</li>\n<li>Контракти з фіксованою ціною та обсягом</li>\n<li>Регульовані галузі з обов'язковою документацією</li>\n<li>Добре відома технологія без дослідницької складової</li>\n</ul>\n</div>\n\n\n\n\n\n<div class=\"danger\"><strong>🚫 Коли не підходить</strong> <p>Стартапи, продукти з невизначеними або мінливими вимогами, проєкти, де потрібен швидкий вихід на ринок.</p>\n</div>\n\n","<h1>⚠️ Кейс: Healthcare.gov (2013)</h1>\n<div class=\"warning\"><strong>⚠️ Контекст</strong> <p>Урядова вебплатформа США для реєстрації на медичне страхування. Розроблялася кілька років за каскадним підходом із залученням десятків підрядників, бюджет проєкту перевищив мільярд доларів.</p>\n</div>\n\n\n\n<p><strong>Що сталося при запуску 1 жовтня 2013 року:</strong></p>\n<ul>\n<li>💥 Сайт не витримав навантаження та постійно падав</li>\n<li>👤 У перший день зареєструватися змогли лише кілька осіб</li>\n<li>🧩 Компоненти різних підрядників вперше інтегрувалися лише перед запуском</li>\n<li>🔄 Вимоги змінювалися протягом розробки, але процес не дозволяв адаптуватися</li>\n</ul>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    A[📝 Вимоги змінюються] --&gt; B[🚫 Процес не адаптується]\n    B --&gt; C[🧪 Тестування наприкінці]\n    C --&gt; D[💥 Провал при запуску]\n    style A fill:#fff3e0,stroke:#ef6c00\n    style B fill:#fce4ec,stroke:#c2185b\n    style C fill:#fce4ec,stroke:#c2185b\n    style D fill:#fce4ec,stroke:#c2185b\"><svg id=\"exp-1788587135278-5-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 1105.8125px;\" viewBox=\"0 0 1105.8125 88\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1788587135278-5-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1788587135278-5-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1788587135278-5-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#exp-1788587135278-5-0 .error-icon{fill:#552222;}#exp-1788587135278-5-0 .error-text{fill:#552222;stroke:#552222;}#exp-1788587135278-5-0 .edge-thickness-normal{stroke-width:1px;}#exp-1788587135278-5-0 .edge-thickness-thick{stroke-width:3.5px;}#exp-1788587135278-5-0 .edge-pattern-solid{stroke-dasharray:0;}#exp-1788587135278-5-0 .edge-thickness-invisible{stroke-width:0;fill:none;}#exp-1788587135278-5-0 .edge-pattern-dashed{stroke-dasharray:3;}#exp-1788587135278-5-0 .edge-pattern-dotted{stroke-dasharray:2;}#exp-1788587135278-5-0 .marker{fill:#333333;stroke:#333333;}#exp-1788587135278-5-0 .marker.cross{stroke h: 200px;\"><span class=\"nodeLabel \"><p>🔗 Інтеграційне тестування</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788587135289-6-0-flowchart-H-13\" data-look=\"classic\" transform=\"translate(318.68359375, 742)\"><rect class=\"basic label-container\" style=\"fill:#e8f5e9 !important;stroke:#388e3c !important\" x=\"-118.375\" y=\"-24\" width=\"236.75\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-94.375, -12)\"><rect></rect><foreignObject width=\"188.75\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>🖥️ Системне тестування</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788587135289-6-0-flowchart-I-15\" data-look=\"classic\" transform=\"translate(395.37109375, 852)\"><rect class=\"basic label-container\" style=\"fill:#e8f5e9 !important;stroke:#388e3c !important\" x=\"-124\" y=\"-36\" width=\"248\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-100, -24)\"><rect></rect><foreignObject width=\"200\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;\"><span class=\"nodeLabel \"><p>✅ Приймальне тестування</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1788587135289-6-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1788587135289-6-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n","<h1>🔍 V-Model: верифікація та валідація</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>V&amp;V</strong> (Verification and Validation / Верифікація та валідація) - дві взаємодоповнювальні категорії перевірки якості, на яких ґрунтується V-Model.</p>\n</div>\n\n\n\n<table>\n<thead>\n<tr>\n<th>🔧 Verification (Верифікація)</th>\n<th>🎯 Validation (Валідація)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>\"Чи правильно ми будуємо продукт?\"</td>\n<td>\"Чи будуємо ми правильний продукт?\"</td>\n</tr>\n<tr>\n<td>Відповідність специфікації та стандартам</td>\n<td>Відповідність реальним потребам користувача</td>\n</tr>\n<tr>\n<td>Приклад: код реалізує технічну специфікацію</td>\n<td>Приклад: користувачі досягають своїх цілей</td>\n</tr>\n</tbody></table>\n<p><strong>Головна ідея:</strong> Кожній фазі проєктування відповідає свій рівень тестування.</p>\n<table>\n<thead>\n<tr>\n<th>Фаза проєктування</th>\n<th>Рівень тестування</th>\n<th>Що перевіряється</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>📝 Вимоги</td>\n<td>✅ Приймальне (UAT)</td>\n<td>Система відповідає потребам замовника</td>\n</tr>\n<tr>\n<td>🏛️ Дизайн системи</td>\n<td>🖥️ Системне</td>\n<td>Система працює як єдине ціле</td>\n</tr>\n<tr>\n<td>🏗️ Дизайн архітектури</td>\n<td>🔗 Інтеграційне</td>\n<td>Модулі коректно взаємодіють</td>\n</tr>\n<tr>\n<td>🧩 Дизайн модулів</td>\n<td>🔬 Модульне</td>\n<td>Окремі функції та класи працюють правильно</td>\n</tr>\n</tbody></table>\n","<h1>📐 V-Model: переваги, недоліки та застосування</h1>\n<p><strong>Головна ідея:</strong> V-Model підвищує якість завдяки ранньому плануванню тестів, але успадковує повільність та негнучкість Waterfall.</p>\n<table>\n<thead>\n<tr>\n<th>✅ Переваги</th>\n<th>❌ Недоліки</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Раннє планування тестів з першої фази проєкту</td>\n<td>Так само повільно, як Waterfall</td>\n</tr>\n<tr>\n<td>Менше дефектів завдяки проактивному підходу до якості</td>\n<td>Дорого: подвійна робота над специфікаціями і тестами</td>\n</tr>\n<tr>\n<td>Чіткі критерії завершення кожної фази</td>\n<td>Зміни вимог ламають уже підготовлені плани тестів</td>\n</tr>\n<tr>\n<td>Прослідковуваність зв'язку \"вимога - тест\"</td>\n<td>Великий обсяг документації</td>\n</tr>\n<tr>\n<td>Висока якість завдяки V&amp;V на кожному рівні</td>\n<td>Пізній фідбек користувачів</td>\n</tr>\n</tbody></table>\n<div class=\"success\"><strong>✅ Коли доречно</strong> <p>Системи, критичні для безпеки: медичні прилади, авіоніка, автомобільні вбудовані системи, фінансові транзакційні платформи. Там, де помилка після запуску неприпустима, а регулятор вимагає документального підтвердження тестування.</p>\n</div>\n\n\n\n\n\n<div class=\"tip\"><strong>💡 Приклад галузі</strong> <p>Аерокосмічна індустрія: у космічних місіях немає можливості \"виправити баг після запуску ракети\", тому кожен рівень системи проходить формальну верифікацію та валідацію.</p>\n</div>\n\n","<h1>🧱 Incremental: доставка частинами</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Incremental Model</strong> (інкрементальна модель) - розробка системи частинами (інкрементами), де кожен інкремент додає нову функціональність до попередньої версії та проходить повний цикл: проєктування, кодування, тестування, розгортання.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> Користувач не чекає повної готовності системи. Робочий продукт доставляється поетапно, і кожна доставка приносить цінність.</p>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    A[📝 Загальні вимоги] --&gt; B1[🧱 Інкремент 1]\n    A --&gt; B2[🧱 Інкремент 2]\n    A --&gt; B3[🧱 Інкремент 3]\n    B1 --&gt; C1[📐 💻 🧪 🚀]\n    B2 --&gt; C2[📐 💻 🧪 🚀]\n    B3 --&gt; C3[📐 💻 🧪 🚀]\n    C1 --&gt; D[v1.0&lt;br/&gt;Базовий функціонал]\n    C2 --&gt; E[v2.0&lt;br/&gt;Нові можливості]\n    C3 --&gt; F[v3.0&lt;br/&gt;Повна система]\n    style A fill:#e3f2fd,stroke:#1565c0\n    style B1 fill:#e8f5e9,stroke:#388e3c\n    style B2 fill:#fff9c4,stroke:#f9a825\n    style B3 fill:#fff3e0,stroke:#ef6c00\n    style D fill:#e8f5e9,stroke:#388e3c\n    style E fill:#fff9c4,stroke:#f9a825\n white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>v2.0<br>Нові можливості</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788587135309-9-0-flowchart-F-17\" data-look=\"classic\" transform=\"translate(759.140625, 288)\"><rect class=\"basic label-container\" style=\"fill:#fff3e0 !important;stroke:#ef6c00 !important\" x=\"-81.40625\" y=\"-36\" width=\"162.8125\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-57.40625, -24)\"><rect></rect><foreignObject width=\"114.8125\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>v3.0<br>Повна система</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1788587135309-9-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1788587135309-9-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<div class=\"tip\"><strong>💡 Принцип Парето</strong> <p>Перші 20% функцій зазвичай дають 80% цінності для користувача. Саме їх варто доставляти у першому інкременті.</p>\n</div>\n\n","<h1>🧱 Incremental: приклад та оцінка</h1>\n<p><strong>Приклад:</strong> e-commerce платформа замість 12 місяців розробки \"усього одразу\" ділиться на три двомісячні інкременти.</p>\n<table>\n<thead>\n<tr>\n<th>Інкремент</th>\n<th>Зміст</th>\n<th>Цінність для бізнесу</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🧱 1 (місяці 1-2)</td>\n<td>Реєстрація, каталог, кошик, оплата карткою</td>\n<td>🛒 Початок продажів</td>\n</tr>\n<tr>\n<td>🧱 2 (місяці 3-4)</td>\n<td>Відгуки, розширений пошук, email-сповіщення, список бажань</td>\n<td>😊 Покращення UX</td>\n</tr>\n<tr>\n<td>🧱 3 (місяці 5-6)</td>\n<td>Програма лояльності, трекінг доставки, рекомендації</td>\n<td>🏆 Конкурентні переваги</td>\n</tr>\n</tbody></table>\n<div class=\"success\"><strong>✅ Результат</strong> <p>Користувачі починають купувати через 2 місяці, а не через 12. Кожен наступний інкремент будується на реальному фідбеку від попереднього.</p>\n</div>\n\n\n\n<table>\n<thead>\n<tr>\n<th>✅ Переваги</th>\n<th>❌ Недоліки</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Швидкий вихід на ринок</td>\n<td>Архітектуру складно спланувати наперед</td>\n</tr>\n<tr>\n<td>Ранній прибуток і ранній фідбек</td>\n<td>Ризик конфліктів між інкрементами</td>\n</tr>\n<tr>\n<td>Найважливіше доставляється першим</td>\n<td>Документацію потрібно постійно оновлювати</td>\n</tr>\n<tr>\n<td>Ризики розподілені між інкрементами</td>\n<td>Можливі переробки попередніх частин</td>\n</tr>\n<tr>\n<td>Кожен інкремент тестується окремо</td>\n<td>Потрібна досвідчена команда</td>\n</tr>\n</tbody></table>\n","<h1>🔁 Incremental vs Iterative</h1>\n<div class=\"info\"><strong>ℹ️ Ключова відмінність</strong> <p>Обидва підходи передбачають кілька циклів розробки, але принципово різняться тим, <strong>що саме повторюється</strong>: інкрементальний підхід <strong>додає</strong> нові функції, ітеративний <strong>покращує</strong> всю систему через послідовні наближення.</p>\n</div>\n\n\n\n<table>\n<thead>\n<tr>\n<th>Аспект</th>\n<th>🧱 Incremental</th>\n<th>🔁 Iterative</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Що робимо</td>\n<td>Додаємо нові функції частинами</td>\n<td>Уточнюємо всю систему циклами</td>\n</tr>\n<tr>\n<td>Результат циклу</td>\n<td>Нова завершена функція</td>\n<td>Покращена версія всього продукту</td>\n</tr>\n<tr>\n<td>Приклад</td>\n<td>v1: логін, v2: + каталог, v3: + оплата</td>\n<td>Прототип 1, кращий прототип 2, фінальна версія</td>\n</tr>\n<tr>\n<td>Фокус</td>\n<td>Розширення функціоналу</td>\n<td>Покращення якості та розуміння</td>\n</tr>\n<tr>\n<td>Аналогія</td>\n<td>🏠 Будинок поверхами: 1-й, 2-й, 3-й</td>\n<td>🎨 Картина: ескіз, контури, деталізація</td>\n</tr>\n</tbody></table>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    subgraph Inc[&quot;🧱 Incremental&quot;]\n        A1[Логін] --&gt; A2[Логін + Каталог] --&gt; A3[Логін + Каталог + Оплата]\n    end\n    subgraph Iter[&quot;🔁 Iterative&quot;]\n        B1[Груба версія] --&gt; B2[Уточнена версія] --&gt; B3[Фінальна версія]\n    end\n    style Inc fill:#e8f5e9,stroke:#388e3c\n    style Iter fill:#e3f2fd,stroke:#1565c0\"><svg id=\"exp-1788587135325-11-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 326.234375px;\" viewBox=\"0 -1 326.234375 806\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1788587135325-11-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1788587135325-11-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1788587135325-11-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#exp-1788587135325-11-0 .error-icon{fill:#552222;}#exp-1788587135325-11-0 .error-text{fill:#552222;stroke:#552222;}#exp-1788587135325-11-0 .edge-thickness-normal{stroke-width:1px;}#exp-1788587135325-11-0 .edge-thickness-thick{stroke-width:3.5px;}#exp-1788587135325-11-0 .edge-pattern-solid{stroke-dasharray:0;}#exp-1788587135325-11-0 .edge-thickness-invisible{stroke-width:0;fill:none;}#exp-1788587135325-11-0 .edge-pattern-dashed{stroke-dasharray:3;}#exp-1788587135325-11-0 .edge-pattern-dotted{stroke-dasharray:2;}#exp-1788587135325-11-0 .marker{fill:#333333;stroke:#333333;}#exp-1788587135325-11-0 .marker.cross{stroke:#333333;}#exp-1788587135325-11-0 svg te(708.453125, 44)\"><rect class=\"basic label-container\" style=\"fill:#e8f5e9 !important;stroke:#388e3c !important\" x=\"-115.734375\" y=\"-36\" width=\"231.46875\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-91.734375, -24)\"><rect></rect><foreignObject width=\"183.46875\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>🛠️ Розробка<br>прототип або інкремент</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788587135341-12-0-flowchart-D-5\" data-look=\"classic\" transform=\"translate(977.8828125, 79.5)\"><rect class=\"basic label-container\" style=\"fill:#f3e5f5 !important;stroke:#7b1fa2 !important\" x=\"-103.6953125\" y=\"-36\" width=\"207.390625\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-79.6953125, -24)\"><rect></rect><foreignObject width=\"159.390625\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>📊 Оцінка<br>перевірка з клієнтом</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1788587135341-12-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1788587135341-12-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<table>\n<thead>\n<tr>\n<th>Фаза</th>\n<th>Що відбувається</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🎯 Планування</td>\n<td>Визначення цілей витка, альтернатив та обмежень</td>\n</tr>\n<tr>\n<td>⚠️ Аналіз ризиків</td>\n<td>Виявлення та оцінка ризиків, вибір способу їх зниження</td>\n</tr>\n<tr>\n<td>🛠️ Розробка</td>\n<td>Створення прототипу або частини системи для перевірки ризику</td>\n</tr>\n<tr>\n<td>📊 Оцінка</td>\n<td>Перевірка результату з клієнтом, планування наступного витка</td>\n</tr>\n</tbody></table>\n<div class=\"warning\"><strong>⚠️ Що вирізняє Spiral</strong> <p>Фаза <strong>аналізу ризиків</strong> є обов'язковою у кожному витку. Саме вона відрізняє спіральну модель від інших традиційних методологій.</p>\n</div>\n\n","<h1>🌀 Spiral: приклад та оцінка</h1>\n<p><strong>Приклад:</strong> мобільний застосунок для онлайн-банкінгу.</p>\n<table>\n<thead>\n<tr>\n<th>Виток</th>\n<th>⚠️ Найбільший ризик</th>\n<th>🛠️ Дії</th>\n<th>📊 Результат</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🌀 1</td>\n<td>Чи потрібен продукт? Які функції критичні?</td>\n<td>Прототип UI, тестування з групою користувачів</td>\n<td>Потреба підтверджена</td>\n</tr>\n<tr>\n<td>🌀 2</td>\n<td>Чи безпечно та швидко працює?</td>\n<td>Технічний PoC: логін та одна транзакція</td>\n<td>Біометрія та швидкодія підтверджені</td>\n</tr>\n<tr>\n<td>🌀 3</td>\n<td>Інтеграція із застарілою системою банку</td>\n<td>Інтеграційний прототип, бета-тест</td>\n<td>Інтеграція працює</td>\n</tr>\n<tr>\n<td>🌀 4</td>\n<td>Чи витримає масове навантаження?</td>\n<td>Навантажувальне тестування, оптимізація</td>\n<td>Готово до production</td>\n</tr>\n</tbody></table>\n<div class=\"success\"><strong>✅ Ефект</strong> <p>Якби біометрія не працювала, команда дізналася б про це на другому витку, а не наприкінці року розробки. Кожен критичний ризик знімається окремо і завчасно.</p>\n</div>\n\n\n\n<table>\n<thead>\n<tr>\n<th>✅ Переваги</th>\n<th>❌ Недоліки</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Проактивне управління ризиками</td>\n<td>Дорого через постійне прототипування</td>\n</tr>\n<tr>\n<td>Гнучкість: зміни між витками</td>\n<td>Складно оцінити загальні терміни та бюджет</td>\n</tr>\n<tr>\n<td>Залучення клієнта після кожного витка</td>\n<td>Потрібні експерти з аналізу ризиків</td>\n</tr>\n<tr>\n<td>Прототипи знижують невизначеність</td>\n<td>Великий обсяг документації: звіти, оцінки ризиків</td>\n</tr>\n<tr>\n<td>Раннє тестування, а не лише наприкінці</td>\n<td>Надмірні накладні витрати для малих проєктів</td>\n</tr>\n</tbody></table>\n","<h1>⚖️ Порівняння традиційних методологій</h1>\n<p><strong>Головна ідея:</strong> Жодна методологія не є універсально кращою. Кожна оптимізує одні критерії ціною інших.</p>\n<table>\n<thead>\n<tr>\n<th>Критерій</th>\n<th>🌊 Waterfall</th>\n<th>📐 V-Model</th>\n<th>🧱 Incremental</th>\n<th>🌀 Spiral</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🔄 Гнучкість</td>\n<td>Дуже низька</td>\n<td>Низька</td>\n<td>Середня</td>\n<td>Висока</td>\n</tr>\n<tr>\n<td>⏱️ Time-to-Market</td>\n<td>Повільно</td>\n<td>Повільно</td>\n<td>Швидко</td>\n<td>Середньо</td>\n</tr>\n<tr>\n<td>⚠️ Управління ризиками</td>\n<td>Слабке</td>\n<td>Середнє</td>\n<td>Середнє</td>\n<td>Відмінне</td>\n</tr>\n<tr>\n<td>🏆 Якість</td>\n<td>Середня</td>\n<td>Висока</td>\n<td>Середня</td>\n<td>Висока</td>\n</tr>\n<tr>\n<td>💰 Вартість</td>\n<td>Передбачувана</td>\n<td>Вища</td>\n<td>Середня</td>\n<td>Висока</td>\n</tr>\n<tr>\n<td>📄 Документація</td>\n<td>Детальна</td>\n<td>Дуже детальна</td>\n<td>Середня</td>\n<td>Детальна</td>\n</tr>\n<tr>\n<td>💬 Фідбек клієнта</td>\n<td>Пізній</td>\n<td>Пізній</td>\n<td>Ранній</td>\n<td>Постійний</td>\n</tr>\n<tr>\n<td>🧩 Складність процесу</td>\n<td>Проста</td>\n<td>Середня</td>\n<td>Середня</td>\n<td>Висока</td>\n</tr>\n</tbody></table>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    A[🌊 Waterfall&lt;br/&gt;найпростіша, найжорсткіша] --&gt; B[📐 V-Model&lt;br/&gt;+ системний акцент на тестуванні]\n    B --&gt; C[🧱 Incremental&lt;br/&gt;+ поетапна доставка цінності]\n    C --&gt; D[🌀 Spiral&lt;br/&gt;+ ризик-менеджмент у центрі процесу]\n    style A fill:#e3f2fd,stroke:#1565c0\n    style B fill:#e8f5e9,stroke:#388e3c\n    style C fill:#fff9c4,stroke:#f9a825\n    style D fill:#fff3e0,stroke:#ef6c00\"><svg id=\"exp-1788587135 " height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n","<h1>🧭 Як обрати методологію</h1>\n<p><strong>Головна ідея:</strong> Вибір визначається характеристиками проєкту: стабільністю вимог, рівнем ризику, критичністю до якості та потребою у швидкій доставці.</p>\n<table>\n<thead>\n<tr>\n<th>Методологія</th>\n<th>✅ Оптимальний контекст</th>\n<th>❌ Не підходить</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🌊 Waterfall</td>\n<td>Стабільні вимоги, фіксована ціна, регульована галузь, відома технологія</td>\n<td>Стартапи, мінливі вимоги</td>\n</tr>\n<tr>\n<td>📐 V-Model</td>\n<td>Системи, критичні для безпеки, регуляторні вимоги (медицина, авіація, авто)</td>\n<td>Невизначені вимоги, обмежений бюджет</td>\n</tr>\n<tr>\n<td>🧱 Incremental</td>\n<td>Потрібен ранній мінімальний продукт, функції можна пріоритезувати</td>\n<td>Усі функції однаково важливі, релізи частинами неможливі</td>\n</tr>\n<tr>\n<td>🌀 Spiral</td>\n<td>Високі технологічні або бізнесові ризики, великий бюджет, інноваційні R&amp;D</td>\n<td>Малі проєкти, жорсткі дедлайни</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Питання для вибору</strong> <ol>\n<li>Наскільки стабільні та зрозумілі вимоги?</li>\n<li>Яка ціна помилки після запуску?</li>\n<li>Чи потрібно доставити цінність якомога раніше?</li>\n<li>Наскільки високі технологічні та бізнесові ризики?</li>\n<li>Який бюджет і чи є жорсткий дедлайн?</li>\n</ol>\n</div>\n\n\n\n\n\n<div class=\"note\"><strong>📝 Практичний приклад</strong> <p>Медична інформаційна система з регуляторними вимогами: V-Model, оскільки регулятор вимагає документального підтвердження тестування, а ціна помилки надзвичайно висока.</p>\n</div>\n\n","<h1>✅ Ключові висновки</h1>\n<div class=\"success\"><strong>✅ Що ми вивчили сьогодні</strong> <p><strong>🧭 Методологія розробки ПЗ:</strong><br>Визначає, як команда проходить фази SDLC. Традиційні (plan-driven) методології ґрунтуються на плануванні та документації.</p>\n<p><strong>🌊 Waterfall:</strong><br>Строго послідовні фази, максимальна передбачуваність, але пізнє тестування та пізній фідбек. Доречна для стабільних вимог.</p>\n<p><strong>📐 V-Model:</strong><br>Кожній фазі проєктування відповідає рівень тестування. Верифікація та валідація на кожному рівні. Для систем, критичних до безпеки.</p>\n<p><strong>🧱 Incremental:</strong><br>Доставка робочого продукту частинами. Швидкий вихід на ринок і ранній фідбек. Incremental додає функції, Iterative покращує систему.</p>\n<p><strong>🌀 Spiral:</strong><br>Витки з обов'язковим аналізом ризиків та прототипуванням. Ефективна для інноваційних проєктів, надмірна для малих.</p>\n<p><strong>⚖️ Вибір методології:</strong><br>Залежить від стабільності вимог, ціни помилки, потреби у швидкій доставці та рівня ризиків.</p>\n</div>\n\n","<h1>❓ Контрольні питання</h1>\n<ol>\n<li><p>🤔 У чому різниця між <strong>SDLC</strong> та <strong>методологією розробки</strong>? Поясніть на прикладі.</p>\n</li>\n<li><p>🤔 Чому у класичному <strong>Waterfall</strong> повернення до попередніх фаз не передбачене, і які проблеми це створює?</p>\n</li>\n<li><p>🤔 Що означає літера \"V\" у <strong>V-Model</strong>? Як співвідносяться ліва та права сторони діаграми?</p>\n</li>\n<li><p>🤔 Чим відрізняються <strong>верифікація</strong> та <strong>валідація</strong>? Наведіть по одному прикладу.</p>\n</li>\n<li><p>🤔 У чому принципова різниця між <strong>Incremental</strong> та <strong>Iterative</strong> підходами?</p>\n</li>\n<li><p>🤔 Які чотири фази проходить кожен виток <strong>Spiral Model</strong> і яка з них вирізняє цю модель?</p>\n</li>\n<li><p>🤔 Для медичної інформаційної системи з регуляторними вимогами оберіть методологію та обґрунтуйте вибір.</p>\n</li>\n</ol>\n","<h1>📚 Глосарій термінів</h1>\n<table>\n<thead>\n<tr>\n<th>Термін</th>\n<th>English</th>\n<th>Визначення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Методологія розробки</td>\n<td>Software Development Methodology</td>\n<td>Структурований підхід до організації процесу створення ПЗ</td>\n</tr>\n<tr>\n<td>Життєвий цикл ПЗ</td>\n<td>Software Development Life Cycle</td>\n<td>Послідовність фаз від ідеї до виведення продукту з експлуатації</td>\n</tr>\n<tr>\n<td>Каскадна модель</td>\n<td>Waterfall Model</td>\n<td>Послідовна модель, у якій кожна фаза починається після завершення попередньої</td>\n</tr>\n<tr>\n<td>V-подібна модель</td>\n<td>V-Model</td>\n<td>Розширення Waterfall із симетричними фазами тестування для кожної фази проєктування</td>\n</tr>\n<tr>\n<td>Інкрементальна модель</td>\n<td>Incremental Model</td>\n<td>Розробка частинами, кожна з яких додає нову функціональність</td>\n</tr>\n<tr>\n<td>Ітеративна модель</td>\n<td>Iterative Model</td>\n<td>Розробка через послідовне покращення всієї системи</td>\n</tr>\n<tr>\n<td>Спіральна модель</td>\n<td>Spiral Model</td>\n<td>Ітеративна модель з обов'язковим аналізом ризиків на кожному витку</td>\n</tr>\n<tr>\n<td>Верифікація</td>\n<td>Verification</td>\n<td>Перевірка відповідності продукту специфікації: \"чи правильно будуємо?\"</td>\n</tr>\n<tr>\n<td>Валідація</td>\n<td>Validation</td>\n<td>Перевірка відповідності продукту потребам користувача: \"чи будуємо правильне?\"</td>\n</tr>\n<tr>\n<td>Інкремент</td>\n<td>Increment</td>\n<td>Завершена частина функціональності, що додається до попередньої версії</td>\n</tr>\n<tr>\n<td>Прототип</td>\n<td>Prototype</td>\n<td>Спрощена робоча версія для перевірки ідеї або зниження ризику</td>\n</tr>\n<tr>\n<td>Час виходу на ринок</td>\n<td>Time-to-Market</td>\n<td>Час від початку розробки до появи продукту у користувачів</td>\n</tr>\n<tr>\n<td>Приймальне тестування</td>\n<td>Acceptance Testing</td>\n<td>Перевірка відповідності системи вимогам замовника</td>\n</tr>\n<tr>\n<td>Управління ризиками</td>\n<td>Risk Management</td>\n<td>Виявлення, оцінка та зниження ризиків проєкту</td>\n</tr>\n</tbody></table>\n","<h1>📝 Глосарій абревіатур</h1>\n<table>\n<thead>\n<tr>\n<th>Абревіатура</th>\n<th>Розшифровка</th>\n<th>Переклад</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>SDLC</td>\n<td>Software Development Life Cycle</td>\n<td>Життєвий цикл розробки ПЗ</td>\n</tr>\n<tr>\n<td>V&amp;V</td>\n<td>Verification and Validation</td>\n<td>Верифікація та валідація</td>\n</tr>\n<tr>\n<td>UAT</td>\n<td>User Acceptance Testing</td>\n<td>Приймальне тестування користувачами</td>\n</tr>\n<tr>\n<td>PoC</td>\n<td>Proof of Concept</td>\n<td>Підтвердження концепції</td>\n</tr>\n<tr>\n<td>UI</td>\n<td>User Interface</td>\n<td>Інтерфейс користувача</td>\n</tr>\n<tr>\n<td>UX</td>\n<td>User Experience</td>\n<td>Досвід користувача</td>\n</tr>\n<tr>\n<td>R&amp;D</td>\n<td>Research and Development</td>\n<td>Дослідження та розробка</td>\n</tr>\n<tr>\n<td>XP</td>\n<td>Extreme Programming</td>\n<td>Екстремальне програмування</td>\n</tr>\n<tr>\n<td>ПЗ</td>\n<td>Software</td>\n<td>Програмне забезпечення</td>\n</tr>\n</tbody></table>\n"];let currentSlideIndex=0;
function renderMath(root){if(typeof renderMathInElement!=="function"||!root)return;try{renderMathInElement(root,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\[",right:"\\]",display:true},{left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false}],throwOnError:false,strict:"ignore",ignoredTags:["script","noscript","style","textarea","pre","code"]});}catch(e){console.warn("Math render error:",e);}}
function showSlide(i){if(i<0||i>=slides.length)return;currentSlideIndex=i;const el=document.getElementById("current-slide");el.innerHTML=slides[i];el.scrollTop=0;renderMath(el);document.getElementById("progress-bar").style.width=((i+1)/slides.length*100)+"%";document.getElementById("slide-number").textContent=(i+1)+" / "+slides.length;updateSidebarActive();}
function nextSlide(){if(currentSlideIndex<slides.length-1)showSlide(currentSlideIndex+1);}
function previousSlide(){if(currentSlideIndex>0)showSlide(currentSlideIndex-1);}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open");}
function toggleHelp(){document.getElementById("help-overlay").classList.toggle("hidden");}
function toggleFullscreen(){if(!document.fullscreenElement){const pc=document.getElementById("presentation-container");if(pc.requestFullscreen)pc.requestFullscreen();else if(pc.webkitRequestFullscreen)pc.webkitRequestFullscreen();else if(pc.msRequestFullscreen)pc.msRequestFullscreen();else if(pc.mozRequestFullScreen)pc.mozRequestFullScreen();}else{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();else if(document.msExitFullscreen)document.msExitFullscreen();else if(document.mozCancelFullScreen)document.mozCancelFullScreen();}}
function generateSidebar(){const sc=document.getElementById("sidebar-content");sc.innerHTML="";slides.forEach((html,idx)=>{const t=document.createElement("div");t.className="slide-thumbnail";if(idx===0)t.classList.add("active");const tmp=document.createElement("div");tmp.innerHTML=html;const title=tmp.querySelector("h1,h2");const titleText=title?title.textContent:("Слайд "+(idx+1));const textContent=tmp.textContent.replace(/s+/g," ").trim();const preview=textContent.substring(0,100)+(textContent.length>100?"...":"");t.innerHTML="<div class=\"slide-thumbnail-number\">"+(idx+1)+"</div><div class=\"slide-thumbnail-title\">"+titleText+"</div><div class=\"slide-thumbnail-content\">"+preview+"</div>";t.onclick=()=>{showSlide(idx);if(window.innerWidth<1024)toggleSidebar();};sc.appendChild(t);});}
function updateSidebarActive(){document.querySelectorAll(".slide-thumbnail").forEach((th,idx)=>{if(idx===currentSlideIndex){th.classList.add("active");th.scrollIntoView({behavior:"smooth",block:"nearest"});}else th.classList.remove("active");});}
document.addEventListener("keydown",e=>{switch(e.key){case"ArrowLeft":previousSlide();break;case"ArrowRight":case" ":e.preventDefault();nextSlide();break;case"f":case"F":toggleFullscreen();break;case"s":case"S":toggleSidebar();break;case"?":toggleHelp();break;case"Escape":const sb=document.getElementById("sidebar");const ho=document.getElementById("help-overlay");if(sb.classList.contains("open"))toggleSidebar();else if(!ho.classList.contains("hidden"))ho.classList.add("hidden");break;}});
generateSidebar();showSlide(0);</script></body></html>
