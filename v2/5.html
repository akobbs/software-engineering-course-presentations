<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Метрики програмного забезпечення</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><style>* {
            margin: 0;
            padding: 0;

        body {

            gap: 1rem;

            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #4a5568;
            color: white;
        }

        .btn-secondary:hover {
            background: #2d3748;
        }

        #markdown-input {
            flex: 1;
            padding: 2rem;
            background: #1a202c;
            color: #e2e8f0;
            border: none;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            line-height: 1.6;
            resize: none;
        }

        #markdown-input:focus {
            outline: none;
        }

        .slide-container {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .slide {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 3rem;
            position: relative;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide::-webkit-scrollbar {
            width: 8px;
        }

        .slide::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .slide::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .slide h1 {
            color: #667eea;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 3px solid #667eea;
            padding-bottom: 0.5rem;
        }

        .slide h2 {

            font-size: 2rem;
            margin: 2rem 0 1rem 0;
        }

        .slide h3 {
            color: #4a5568;

            margin: 1.5rem 0 1rem 0;
        }

        .slide p {

            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 1rem;
        }

        .slide ul, .slide ol {
            margin-left: 2rem;
            margin-bottom: 1rem;
        }

        .slide li {
            color: #2d3748;
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 0.5rem;
        }

        .slide pre {
            background: #282c34;
            border-radius: 10px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            overflow-x: auto;
        }

        .slide pre code {
            background: transparent;
            color: #abb2bf;
        }

        .slide code {
            font-family: 'Courier New', Consolas, Monaco, monospace;
            font-size: 0.95em;
            line-height: 1.5;
        }

        .slide h1 code, .slide h2 code, .slide h3 code {
            font-size: 0.85em;
            background: rgba(237, 242, 247, 0.5);
            padding: 0.1em 0.3em;
            border-radius: 3px;
        }

        .slide p code {
            background: #edf2f7;
            color: #e53e3e;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-size: 0.9em;
        }

        .slide blockquote {
            border-left: 4px solid #667eea;
            padding-left: 1.5rem;
            margin: 1.5rem 0;
            font-style: italic;
            color: #4a5568;
        }

        .slide img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 1.5rem 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .slide table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
        }

        .slide th, .slide td {
            border: 1px solid #e2e8f0;
            padding: 0.75rem;
            text-align: left;
        }

        .slide th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }

        .slide tr:nth-child(even) {
            background: #f7fafc;
        }

        .note {
            background: #fff5f5;
            border-left: 4px solid #fc8181;
            padding: 1rem;
            margin: 1.5rem 0;
            border-radius: 5px;
        }

        .note strong {
            color: #c53030;
        }

        .warning {
            background: #fffaf0;
            border-left: 4px solid #f6ad55;
            padding: 1rem;
            margin: 1.5rem 0;
            border-radius: 5px;
        }

        .warning strong {
            color: #c05621;
        }

        .info {
            background: #ebf8ff;
            border-left: 4px solid #4299e1;
            padding: 1rem;
            margin: 1.5rem 0;
            border-radius: 5px;
        }

        .info strong {
            color: #2c5282;
        }

        .success {
            background: #f0fff4;
            border-left: 4px solid #48bb78;
            padding: 1rem;
            margin: 1.5rem 0;
            border-radius: 5px;
        }

        .success strong {
            color: #22543d;
        }

        .danger {
            background: #fff5f5;
            border-left: 4px solid #f56565;
            padding: 1rem;
            margin: 1.5rem 0;
            border-radius: 5px;
        }

        .danger strong {
            color: #742a2a;
        }

        .tip {
            background: #fefcbf;
            border-left: 4px solid #ecc94b;
            padding: 1rem;
            margin: 1.5rem 0;
            border-radius: 5px;
        }

        .tip strong {
            color: #744210;
        }

        .controls {

            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            z-index: 100;

        .control-btn {
            background: rgba(255, 255, 255, 0.9);

            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);

            transform: scale(1.1);

            width: 100%;
            height: 4px;

        .progress-bar {
            height: 100%;
            background: white;
            transition: width 0.3s;

            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(255, 255, 255, 0.9);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            color: #667eea;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);

            right: -320px;
            top: 0;
            width: 320px;
            height: 100vh;

            background: #f1f1f1;

            background: #667eea;
            border-radius: 3px;
        }

        #sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #667eea;
        }

        #sidebar-header h3 {
            color: #667eea;
            font-size: 1.2rem;
            margin: 0;

            border: none;

            cursor: pointer;
            color: #4a5568;
            padding: 0.25rem;
            line-height: 1;
        }

        #sidebar-close:hover {

        }

        .slide-thumbnail {

            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 0.75rem;
            margin-bottom: 0.75rem;

            transition: all 0.2s;
            overflow: hidden;
        }

        .slide-thumbnail:hover {
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);

        .slide-thumbnail.active {

            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .slide-thumbnail-number {

            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .slide-thumbnail-content {

            line-height: 1.4;
            max-height: 4.2rem;
            overflow: hidden;
            position: relative;
        }

        .slide-thumbnail-content::after {

            bottom: 0;
            right: 0;
            width: 50%;
            height: 1.4rem;
            background: linear-gradient(to right, transparent, white);
        }

        .slide-thumbnail.active .slide-thumbnail-content::after {
            background: linear-gradient(to right, transparent, #f7faff);
        }

        .slide-thumbnail-title {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 0.25rem;
        }

        #sidebar-toggle {
            position: fixed;
            right: 1rem;
            top: 1rem;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 8px;
            width: 45px;
            height: 45px;
            cursor: pointer;
            font-size: 1.3rem;

            align-items: center;

        #sidebar-toggle:hover {

        }

        .mermaid {

        /* Запобігаємо обрізанню останньої літери в нодах Mermaid через зміну font-weight після розрахунку розміру */

            border-radius: 3px;
            font-family: monospace;

        }

        .mermaid-error {
            background: #fff5f5;
            border: 1px solid #fed7d7;
            padding: 1rem;
            border-radius: 6px;
            color: #742a2a;
            margin: 1.5rem 0;
        }

        .mermaid-error pre {
            margin-top: 0.5rem;
            font-size: 0.75rem;
            white-space: pre-wrap;
        }

        #presentation-container:fullscreen {

        #presentation-container:-moz-full-screen {

#presentation-container:fullscreen,#presentation-container:-webkit-full-screen,#presentation-container:-moz-full-screen,#presentation-container:-ms-fullscreen{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)!important;}</style></head><body><div id="presentation-container"><div class="progress"><div class="progress-bar" id="progress-bar"></div></div><button id="sidebar-toggle" onclick="toggleSidebar()" title="Навігація слайдами (S)">☰</button><div id="sidebar"><div id="sidebar-header"><h3>📑 Слайди</h3><button id="sidebar-close" onclick="toggleSidebar()">✕</button></div><div id="sidebar-content"></div></div><div class="slide-container"><div class="slide" id="current-slide"></div></div><div class="controls"><button class="control-btn" onclick="previousSlide()" title="Попередній (←)">←</button><button class="control-btn" onclick="nextSlide()" title="Наступний (→)">→</button><button class="control-btn" onclick="toggleFullscreen()" title="Повноекранний режим (F)">⛶</button><button class="control-btn" onclick="toggleHelp()" title="Допомога (?)">?</button></div><div class="slide-number" id="slide-number">1 / 20</div><div id="help-overlay" class="hidden"><strong>Гарячі клавіші:</strong><br><kbd>←</kbd> <kbd>→</kbd> Навігація<br><kbd>F</kbd> Повноекранний режим<br><kbd>S</kbd> Sidebar<br><kbd>?</kbd> Допомога<br><kbd>Esc</kbd> Закрити</div></div><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><script>const slides=["<h1>Метрики програмного забезпечення</h1>\n<p><strong>Курс:</strong> Основи інженерії програмного забезпечення<br><strong>Лектор:</strong> Кобилянський Антон</p>\n","<h2>📋 План лекції</h2>\n<ol>\n<li>🎯 Поняття метрики та її призначення</li>\n<li>🗺️ Класифікація метрик ПЗ</li>\n<li>💻 Метрики коду: розмір та складність</li>\n<li>🐛 Метрики якості: дефекти та покриття тестами</li>\n<li>👥 Метрики процесу розробки</li>\n<li>📈 Мет e-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🚀 DORA</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1789190175746-3-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789190175746-3-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<table>\n<thead>\n<tr>\n<th>Група</th>\n<th>Питання, на яке відповідає</th>\n<th>Метрики</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>💻 <strong>Код</strong></td>\n<td>Який розмір і наскільки складний код?</td>\n<td>LOC, Cyclomatic Complexity</td>\n</tr>\n<tr>\n<td>🐛 <strong>Якість</strong></td>\n<td>Скільки дефектів і чи протестовано?</td>\n<td>Defect Density, Code Coverage</td>\n</tr>\n<tr>\n<td>👥 <strong>Процес</strong></td>\n<td>Як швидко команда доставляє результат?</td>\n<td>Velocity, Lead Time, Cycle Time</td>\n</tr>\n<tr>\n<td>📈 <strong>Надійність</strong></td>\n<td>Наскільки стабільна система у роботі?</td>\n<td>MTBF, MTTR, DORA-метрики</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Логіка лекції</strong> <p>Рухаємось від найпростішого рівня (окремий файл коду) до найвищого (команда та система у production). Кожна група відповідає на своє питання: <em>скільки</em>, <em>наскільки якісно</em>, <em>як швидко</em>, <em>наскільки надійно</em>.</p>\n</div>\n\n","<h1>📝 LOC: розмір коду</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>LOC</strong> (Lines of Code / Рядки коду) - кількість рядків вихідного коду програми. Найстаріша та найпростіша метрика розміру ПЗ.</p>\n</div>\n\n\n\n<p><strong>Два способи підрахунку:</strong></p>\n<ul>\n<li><strong>PLOC</strong> (Physical LOC / Фізичні рядки) - усі рядки файлу, включно з порожніми та коментарями</li>\n<li><strong>SLOC</strong> (Source LOC / Рядки вихідного коду) - лише рядки з кодом, без коментарів і порожніх рядків</li>\n</ul>\n<pre><code class=\"language-typescript hljs\" data-highlighted=\"yes\"><span class=\"hljs-comment\">// Обчислення суми двох чисел</span>\n<span class=\"hljs-keyword\">function</span> <span class=\"hljs-title function_\">sum</span>(<span class=\"hljs-params\">a: <span class=\"hljs-built_in\">number</span>, b: <span class=\"hljs-built_in\">number</span></span>): <span class=\"hljs-built_in\">number</span> {\n  <span class=\"hljs-comment\">// Повертаємо результат</span>\n  <span class=\"hljs-keyword\">return</span> a + b;\n}\n\n<span class=\"hljs-keyword\">const</span> result = <span class=\"hljs-title function_\">sum</span>(<span class=\"hljs-number\">5</span>, <span class=\"hljs-number\">3</span>);</code></pre><p>📊 <strong>Підрахунок для прикладу:</strong></p>\n<ul>\n<li><strong>PLOC = 7</strong> (усі рядки файлу)</li>\n<li><strong>SLOC = 4</strong> (<code>function...</code>, <code>return...</code>, <code>}</code>, <code>const...</code>)</li>\n</ul>\n<p><strong>Похідні одиниці для великих систем:</strong> <strong>KLOC</strong> (тисячі рядків) та <strong>MLOC</strong> (мільйони рядків).</p>\n","<h1>⚖️ LOC: переваги та обмеження</h1>\n<table>\n<thead>\n<tr>\n<th>✅ Переваги</th>\n<th>⚠️ Обмеження</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Легко виміряти</td>\n<td>Не відображає якість коду</td>\n</tr>\n<tr>\n<td>Повністю автоматизується</td>\n<td>Залежить від мови програмування</td>\n</tr>\n<tr>\n<td>Дає базу для історичних оцінок</td>\n<td>Не враховує складність логіки</td>\n</tr>\n<tr>\n<td>Зрозуміла для нетехнічних людей</td>\n<td>Заохочує багатослівність</td>\n</tr>\n</tbody></table>\n<div class=\"warning\"><strong>⚠️ Хибне припущення</strong> <p><strong>\"Більше коду = більше виконаної роботи\"</strong>. Насправді якісний код часто коротший: рефакторинг і оптимізація зменшують LOC, хоча цінність продукту зростає.</p>\n</div>\n\n\n\n\n\n<div class=\"danger\"><strong>🚫 Історія Білла Аткінсона (Apple, 1982)</strong> <p>Менеджери Apple запровадили щотижневі звіти про продуктивність у рядках коду. Білл Аткінсон, автор графічної бібліотеки QuickDraw для Macintosh, переписав алгоритм роботи з регіонами: він став приблизно в 6 разів швидшим, а з коду зникло близько 2000 рядків. У звіті він записав <strong>\"-2000\"</strong>. Незабаром від нього перестали вимагати цю форму.</p>\n<p><strong>Висновок:</strong> LOC вимірює обсяг, а не цінність або продуктивність.</p>\n</div>\n\n","<h1>🔧 Цикломатична складність</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Cyclomatic Complexity</strong> (CC / Цикломатична складність) - метрика, що вимірює кількість лінійно незалежних шляхів виконання в коді. Запропонована Томасом Маккейбом у 1976 році.</p>\n</div>\n\n\n\n<p><strong>Спрощена формула для практики:</strong></p>\n<pre><code class=\"language-plaintext hljs\" data-highlighted=\"yes\">CC = кількість точок розгалуження (if, else if, for, while, case, &amp;&amp;, ||, ?:) + 1</code></pre><p><strong>Приклад 1: лінійна функція, CC = 1</strong></p>\n<pre><code class=\"language-typescript hljs\" data-highlighted=\"yes\"><span class=\"hljs-keyword\">function</span> <span class=\"hljs-title function_\">greet</span>(<span class=\"hljs-params\">name: <span class=\"hljs-built_in\">string</span></span>): <span class=\"hljs-built_in\">string</span> {\n  <span class=\"hljs-keyword\">return</span> <span class=\"hljs-string\">`Hello, <span class=\"hljs-subst\">${name}</span>!`</span>;\n}</code></pre><p><strong>Приклад 2: три умови, CC = 4</strong></p>\n<pre><code class=\"language-typescript hljs\" data-highlighted=\"yes\"><span class=\"hljs-keyword\">function</span> <span class=\"hljs-title function_\">getDiscount</span>(<span class=\"hljs-params\">age: <span class=\"hljs-built_in\">number</span>, isMember: <span class=\"hljs-built_in\">boolean</span></span>): <span class=\"hljs-built_in\">number</span> {\n  <span class=\"hljs-keyword\">if</span> (age &lt; <span class=\"hljs-number\">18</span>) <span class=\"hljs-keyword\">return</span> <span class=\"hljs-number\">0.2</span>; <span class=\"hljs-comment\">// +1</span>\n  <span class=\"hljs-keyword\">if</span> (age &gt; <span class=\"hljs-number\">65</span>) <span class=\"hljs-keyword\">return</span> <span class=\"hljs-number\">0.15</span>; <span class=\"hljs-comment\">// +1</span>\n  <span class=\"hljs-keyword\">if</span> (isMember) <span class=\"hljs-keyword\">return</span> <span class=\"hljs-number\">0.1</span>; <span class=\"hljs-comment\">// +1</span>\n  <span class=\"hljs-keyword\">return</span> <span class=\"hljs-number\">0</span>;\n}</code></pre><div class=\"tip\"><strong>💡 Практичний сенс</strong> <p>CC показує <strong>мінімальну кількість тестових сценаріїв</strong>, потрібних, щоб пройти кожну гілку коду хоча б один раз. Для <code>getDiscount</code> це щонайменше 4 тести.</p>\n</div>\n\n","<h1>📊 Інтерпретація цикломатичної складності</h1>\n<table>\n<thead>\n<tr>\n<th>CC</th>\n<th>Складність</th>\n<th>Тестованість</th>\n<th>Рекомендовані дії</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1-10</td>\n<td>😊 Проста</td>\n<td>✅ Легко тестується</td>\n<td>Нормальний стан</td>\n</tr>\n<tr>\n<td>11-20</td>\n<td>😐 Помірна</td>\n<td>⚠️ Середня</td>\n<td>Розглянути рефакторинг</td>\n</tr>\n<tr>\n<td>21-50</td>\n<td>😟 Висока</td>\n<td>❌ Важко тестувати</td>\n<td>Рефакторинг необхідний</td>\n</tr>\n<tr>\n<td>50+</td>\n<td>😱 Дуже висока</td>\n<td>🚫 Практично неможливо</td>\n<td>Переписати</td>\n</tr>\n</tbody></table>\n<pre><code class=\"language-typescript hljs\" data-highlighted=\"yes\"><span class=\"hljs-comment\">// ❌ Одна функція з глибокою вкладеністю, CC = 12</span>\n<span class=\"hljs-keyword\">function</span> <span class=\"hljs-title function_\">processOrder</span>(<span class=\"hljs-params\">order: Order</span>) {\n  <span class=\"hljs-keyword\">if</span> (order.<span class=\"hljs-property\">isPaid</span>) {\n    <span class=\"hljs-keyword\">if</span> (order.<span class=\"hljs-property\">isShipped</span>) {\n      <span class=\"hljs-keyword\">if</span> (order.<span class=\"hljs-property\">hasTracking</span>) {\n        <span class=\"hljs-comment\">// ... ще кілька рівнів умов</span>\n      }\n    }\n  }\n}\n\n<span class=\"hljs-comment\">// ✅ Декомпозиція: CC кожної функції &lt; 5</span>\n<span class=\"hljs-keyword\">function</span> <span class=\"hljs-title function_\">processOrder</span>(<span class=\"hljs-params\">order: Order</span>) {\n  <span class=\"hljs-keyword\">if</span> (!<span class=\"hljs-title function_\">canProcess</span>(order)) <span class=\"hljs-keyword\">return</span>;\n  <span class=\"hljs-title function_\">shipOrder</span>(order);\n  <span class=\"hljs-title function_\">notifyCustomer</span>(order);\n}</code></pre><div class=\"tip\"><strong>💡 Правило</strong> <p>Функцію з CC понад 10 варто розбити на менші. Це одночасно покращує читабельність, тестованість і локалізацію помилок.</p>\n</div>\n\n","<h1>📉 Defect Density: щільність дефектів</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Defect Density</strong> (Щільність дефектів) - кількість виявлених дефектів на одиницю розміру коду. Найчастіше нормується на <strong>KLOC</strong>.</p>\n</div>\n\n\n\n<p><strong>Формула:</strong></p>\n<pre><code class=\"language-plaintext hljs\" data-highlighted=\"yes\">Defect Density = Кількість дефектів / Розмір коду (KLOC)</code></pre><p><strong>Приклад:</strong> у модулі розміром 10 KLOC виявлено 25 дефектів:</p>\n<pre><code class=\"language-plaintext hljs\" data-highlighted=\"yes\">Defect Density = 25 / 10 = 2.5 дефекта на KLOC</code></pre><p><strong>Для чого використовують:</strong></p>\n<ul>\n<li>🔍 Порівняння модулів системи між собою: де зосереджені проблеми</li>\n<li>📈 Відстеження динаміки якості від релізу до релізу</li>\n<li>🎯 Визначення, які частини системи потребують додаткового тестування або рефакторингу</li>\n</ul>\n<div class=\"warning\"><strong>⚠️ Обмеження</strong> <p>Щільність дефектів залежить від того, наскільки ретельно шукали дефекти. Модуль з низькою щільністю може бути просто погано протестованим, а не якісним. Інтерпретуйте разом із покриттям тестами.</p>\n</div>\n\n","<h1>🎯 Code Coverage: покриття тестами</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Code Coverage</strong> (Покриття коду) - відсоток коду, що виконується під час запуску автоматизованих тестів.</p>\n</div>\n\n\n\n\n<div class=\"mermaid\" data-source=\"graph LR\n    A[📊 Code Coverage] --&gt; B[📝 Line]\n    A --&gt; C[🔀 Branch]\n    A --&gt; D[🎯 Function]\n    style A fill:#e8f5e9,stroke:#2e7d32\n    style B fill:#e3f2fd,stroke:#1565c0\n    style C fill:#fff9c4,stroke:#f9a825\n    style D fill:#f3e5f5,stroke:#7b1fa2\"><svg id=\"exp-1789190175773-9-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 360px;\" viewBox=\"4 4 360 240\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1789190175773-9-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1789190175773-9-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1789190175773-9-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#exp-1789190175773-9-0 .error-icon{fill:#552222;}#exp-1789190175773-9-0 .error-text{fill:#552222;stroke:#552222;}#exp-1789190175773-9-0 .edge-thickness-normal{stroke-width:1px;}#exp-1789190175773-9-0 .edge-thickness-thick{stroke-width:3.5px;}#exp-1789190175773-9-0 .edge-pattern-solid{stroke-dasharray:0;}#exp-1789190175773-9-0 .edge-thickness-invisible{stroke-width:0;fill:none;}#exp-1789190175773-9-0 .edge-pattern-dashed{strok \" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<table>\n<thead>\n<tr>\n<th>Метрика</th>\n<th>Що вимірює</th>\n<th>Бажане значення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>⏱️ Lead Time</strong></td>\n<td>Час від запиту до доставки</td>\n<td>Якомога менше</td>\n</tr>\n<tr>\n<td><strong>🔄 Cycle Time</strong></td>\n<td>Час активної роботи</td>\n<td>Стабільне та передбачуване</td>\n</tr>\n<tr>\n<td><strong>⏸️ Wait Time</strong></td>\n<td>Lead Time мінус Cycle Time</td>\n<td>Мінімальне</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Де шукати проблему</strong> <p>Якщо Lead Time значно перевищує Cycle Time, задачі довго <strong>чекають</strong> у черзі, на code review або на реліз. Проблема не в швидкості розробників, а в організації потоку роботи.</p>\n</div>\n\n","<h1>🔄 MTBF та MTTR: надійність системи</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <ul>\n<li><strong>MTBF</strong> (Mean Time Between Failures / Середній час між відмовами) - середній час безперервної роботи системи між двома збоями</li>\n<li><strong>MTTR</strong> (Mean Time To Recovery / Середній час відновлення) - середній час від виникнення збою до повного відновлення роботи</li>\n</ul>\n</div>\n\n\n\n<p><strong>Формули:</strong></p>\n<pre><code class=\"language-plaintext hljs\" data-highlighted=\"yes\">MTBF = Загальний час роботи / Кількість відмов\nMTTR = Загальний час простою / Кількість відмов</code></pre><p><strong>Приклад:</strong> система працювала 720 годин (30 діб), сталося 3 відмови тривалістю 2, 3 та 1 година:</p>\n<pre><code class=\"language-plaintext hljs\" data-highlighted=\"yes\">MTBF = 720 / 3 = 240 годин (у середньому 10 діб між відмовами)\nMTTR = (2 + 3 + 1) / 3 = 2 години (середній час відновлення)</code></pre><table>\n<thead>\n<tr>\n<th>Метрика</th>\n<th>Характеризує</th>\n<th>Як покращити</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>MTBF</strong></td>\n<td>Надійність системи</td>\n<td>Тестування, code review, стабільна архітектура</td>\n</tr>\n<tr>\n<td><strong>MTTR</strong></td>\n<td>Швидкість реагування</td>\n<td>Моніторинг, алерти, автоматичний відкат</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Сучасний акцент</strong> <p>У розподілених системах повністю уникнути збоїв неможливо, тому індустрія дедалі більше фокусується на низькому <strong>MTTR</strong>: важливо не лише рідко падати, а й швидко підніматись.</p>\n</div>\n\n","<h1>🚀 DORA-метрики</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>DORA</strong> (DevOps Research and Assessment) - дослідницька програма, яка на основі багаторічних опитувань виділила чотири метрики, що найкраще характеризують ефективність доставки ПЗ.</p>\n</div>\n\n\n\n\n<div class=\"mermaid\" data-source=\"graph TD\n    A[🚀 DORA] --&gt; B[📦 Deployment Frequency]\n    A --&gt; C[⏱️ Lead Time for Changes]\n    A --&gt; D[🔧 Time to Restore]\n    A --&gt; E[❌ Change Failure Rate]\n    B --&gt; F[⚡ Швидкість]\n    C --&gt; F\n    D --&gt; G[🛡️ Стабільність]\n    E --&gt; G\n    style A fill:#e8f5e9,stroke:#2e7d32\n    style F fill:#e3f2fd,stroke:#1565c0\n    style G fill:#fff3e0,stroke:#ef6c00\"><svg id=\"exp-1789190175816-13-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 744px;\" viewBox=\"4 4 744 284\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1789190175816-13-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1789190175816-13-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1789190175816-13-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear i \" transform=\"translate(184, 256)\"><rect class=\"basic label-container\" style=\"fill:#e3f2fd !important;stroke:#1565c0 !important\" x=\"-76\" y=\"-24\" width=\"152\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -12)\"><rect></rect><foreignObject width=\"120\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>⚡ Швидкість</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789190175816-13-0-flowchart-G-13\" data-look=\"neo\" transform=\"translate(568, 256)\"><rect class=\"basic label-container\" style=\"fill:#fff3e0 !important;stroke:#ef6c00 !important\" x=\"-76\" y=\"-24\" width=\"152\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -12)\"><rect></rect><foreignObject width=\"120\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🛡️ Стабільність</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1789190175816-13-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789190175816-13-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<table>\n<thead>\n<tr>\n<th>Метрика</th>\n<th>Що показує</th>\n<th>Куди прагнути</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Deployment Frequency</strong></td>\n<td>Частота релізів у production</td>\n<td>Щодня або на вимогу</td>\n</tr>\n<tr>\n<td><strong>Lead Time for Changes</strong></td>\n<td>Час від коміту до роботи коду у production</td>\n<td>Менше доби</td>\n</tr>\n<tr>\n<td><strong>Time to Restore Service</strong></td>\n<td>Час відновлення після інциденту</td>\n<td>Менше години</td>\n</tr>\n<tr>\n<td><strong>Change Failure Rate</strong></td>\n<td>Відсоток релізів, що спричинили збій або відкат</td>\n<td>Одиниці відсотків</td>\n</tr>\n</tbody></table>\n<div class=\"success\"><strong>✅ Головний висновок досліджень DORA</strong> <p>Швидкість і стабільність <strong>не суперечать одна одній</strong>: команди, які релізять часто, зазвичай мають і нижчий відсоток невдалих змін. Дрібні часті зміни простіше перевірити та відкотити.</p>\n</div>\n\n","<h1>⚠️ Антипатерни використання метрик</h1>\n<div class=\"danger\"><strong>🚫 Типові помилки</strong> <p><strong>1. 🎯 Метрика стає ціллю (Закон Гудхарта)</strong><br>Коли показник стає метою, він перестає бути надійним вимірювачем. Платіть за LOC - отримаєте роздутий код; вимагайте 100% покриття - отримаєте тести без перевірок.</p>\n<p><strong>2. 📊 Збір заради збору (Vanity Metrics)</strong><br>Десятки дашбордів, на які ніхто не дивиться і за якими не приймають рішень. Кожна метрика має відповідати на конкретне питання.</p>\n<p><strong>3. 🔢 Фокус на одній метриці</strong><br>Висока velocity нічого не варта, якщо зростає Change Failure Rate. Метрики потрібно читати в поєднанні.</p>\n<p><strong>4. ⚖️ Порівняння непорівнюваного</strong><br>Різні команди, різні домени, різні шкали оцінювання. Порівнювати можна лише команду з нею самою в часі.</p>\n<p><strong>5. 👥 Оцінка людей замість процесу</strong><br>Метрики розроблені для покращення процесу. Використання їх для рейтингування розробників руйнує довіру та провокує маніпуляції з цифрами.</p>\n</div>\n\n","<h1>✅ Принципи коректного використання</h1>\n\n<div class=\"mermaid\" data-source=\"graph TD\n    A[🎯 Визначте питання] --&gt; B[📏 Оберіть 3-5 метрик]\n    B --&gt; C[📊 Автоматизуйте збір]\n    C --&gt; D[🔍 Аналізуйте тренди]\n    D --&gt; E{💡 Є інсайт?}\n    E --&gt;|Так| F[🚀 Дійте]\n    E --&gt;|Ні| G[ ect><foreignObject width=\"120\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>💡 Є інсайт?</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789190175842-15-0-flowchart-F-9\" data-look=\"neo\" transform=\"translate(88, 802)\"><rect class=\"basic label-container\" style=\"fill:#e8f5e9 !important;stroke:#2e7d32 !important\" x=\"-76\" y=\"-24\" width=\"152\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -12)\"><rect></rect><foreignObject width=\"120\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🚀 Дійте</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789190175842-15-0-flowchart-G-11\" data-look=\"neo\" transform=\"translate(280, 802)\"><rect class=\"basic label-container\" style=\"fill:#fce4ec !important;stroke:#c2185b !important\" x=\"-76\" y=\"-48\" width=\"152\" height=\"96\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -36)\"><rect></rect><foreignObject width=\"120\" height=\"72\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🔄 Переглянути набір</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789190175842-15-0-flowchart-H-13\" data-look=\"neo\" transform=\"translate(232, 926)\"><rect class=\"basic label-container\" style=\"fill:#e3f2fd !important;stroke:#1565c0 !important\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>📈 Виміряти результат</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1789190175842-15-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789190175842-15-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<div class=\"tip\"><strong>💡 Правила</strong> <ul>\n<li>🎯 <strong>Спершу питання, потім метрика</strong>: не \"що можемо виміряти?\", а \"що хочемо з'ясувати?\"</li>\n<li>⚖️ <strong>Баланс</strong>: поєднуйте метрики швидкості (velocity, lead time) та якості (defect density, change failure rate)</li>\n<li>📈 <strong>Тренд важливіший за число</strong>: 78% покриття саме по собі мало що каже, а падіння з 85% до 78% за місяць - сигнал</li>\n<li>🤖 <strong>Автоматизуйте</strong>: SonarQube для коду, Jira для процесу, Prometheus та Grafana для production. Ручний збір швидко закидають</li>\n<li>🔄 <strong>Переглядайте набір</strong>: метрика, яка перестала впливати на рішення, має бути прибрана</li>\n</ul>\n</div>\n\n","<h1>🎓 Ключові висновки</h1>\n<div class=\"success\"><strong>✅ Що потрібно запам'ятати</strong> <ol>\n<li>📊 <strong>Метрика</strong> - кількісна міра властивості продукту, процесу або проєкту; вона перетворює якість і продуктивність на числа</li>\n<li>📝 <strong>LOC</strong> вимірює розмір, але не цінність і не продуктивність</li>\n<li>🔧 <strong>Цикломатична складність</strong> показує кількість шляхів виконання і мінімальну кількість тестів; понад 10 - сигнал до рефакторингу</li>\n<li>🐛 <strong>Defect Density</strong> і <strong>Code Coverage</strong> характеризують якість, але 100% покриття не гарантує відсутність помилок</li>\n<li>⚡ <strong>Velocity</strong> слугує для прогнозування всередині команди, а не для порівняння команд</li>\n<li>⏱️ Різниця між <strong>Lead Time</strong> і <strong>Cycle Time</strong> показує, скільки часу задача простоює</li>\n<li>🔄 <strong>MTBF</strong> і <strong>MTTR</strong> описують надійність; сучасний фокус - на швидкому відновленні</li>\n<li>🚀 <strong>DORA-метрики</strong> поєднують швидкість і стабільність доставки</li>\n<li>⚠️ Метрика не має ставати ціллю і не має використовуватись для оцінки окремих людей</li>\n</ol>\n</div>\n\n","<h1>❓ Контрольні питання</h1>\n<p><strong>1. 📊 Що таке метрика програмного забезпечення?</strong><br>Дайте визначення та наведіть по одному прикладу метрики коду, якості, процесу та надійності.</p>\n<p><strong>2. 📝 Чим відрізняються PLOC та SLOC?</strong><br>Чому LOC не варто використовувати як показник продуктивності розробника?</p>\n<p><strong>3. 🔧 Обчисліть цикломатичну складність</strong><br>Функція містить два <code>if</code>, один <code>for</code> та одну умову з <code>&amp;&amp;</code>. Яке значення CC? Скільки тестів мінімально потрібно?</p>\n<p><strong>4. 🐛 Обчисліть Defect Density</strong><br>У модулі розміром 15 KLOC знайдено 30 дефектів. Чому низька щільність дефектів не завжди означає високу якість?</p>\n<p><strong>5. 🎯 Чому 100% Code Coverage не гарантує відсутність помилок?</strong><br>Які типи покриття ви знаєте та чим Branch Coverage інформативніше за Line Coverage?</p>\n<p><strong>6. ⏱️ Чим Lead Time відрізняється від Cycle Time?</strong><br>Про що свідчить велика різниця між ними?</p>\n<p><strong>7. 🚀 Назвіть чотири DORA-метрики</strong><br>Які з них характеризують швидкість, а які стабільність?</p>\n<p><strong>8. ⚠️ Поясніть закон Гудхарта на прикладі метрик ПЗ</strong><br>Наведіть два антипатерни та способи їх уникнення.</p>\n","<h1>📖 Глосарій термінів</h1>\n<table>\n<thead>\n<tr>\n<th>Термін</th>\n<th>Англійською</th>\n<th>Визначення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Метрика ПЗ</strong></td>\n<td>Software Metric</td>\n<td>Кількісна міра властивості програмного продукту, процесу розробки або проєкту</td>\n</tr>\n<tr>\n<td><strong>Цикломатична складність</strong></td>\n<td>Cyclomatic Complexity</td>\n<td>Кількість лінійно незалежних шляхів виконання в коді</td>\n</tr>\n<tr>\n<td><strong>Щільність дефектів</strong></td>\n<td>Defect Density</td>\n<td>Кількість дефектів на одиницю розміру коду, зазвичай на KLOC</td>\n</tr>\n<tr>\n<td><strong>Покриття коду</strong></td>\n<td>Code Coverage</td>\n<td>Відсоток коду, що виконується під час автоматизованих тестів</td>\n</tr>\n<tr>\n<td><strong>Швидкість команди</strong></td>\n<td>Velocity</td>\n<td>Обсяг роботи у story points, який команда завершує за спринт</td>\n</tr>\n<tr>\n<td><strong>Час виконання</strong></td>\n<td>Lead Time</td>\n<td>Повний час від створення задачі до доставки результату користувачу</td>\n</tr>\n<tr>\n<td><strong>Час циклу</strong></td>\n<td>Cycle Time</td>\n<td>Час активної роботи над задачею від початку розробки до завершення</td>\n</tr>\n<tr>\n<td><strong>Частота розгортання</strong></td>\n<td>Deployment Frequency</td>\n<td>Як часто нові версії потрапляють у production</td>\n</tr>\n<tr>\n<td><strong>Частота невдалих змін</strong></td>\n<td>Change Failure Rate</td>\n<td>Відсоток релізів, що спричинили збій у production і потребували виправлення</td>\n</tr>\n<tr>\n<td><strong>Закон Гудхарта</strong></td>\n<td>Goodhart's Law</td>\n<td>Коли показник стає ціллю, він перестає бути хорошим показником</td>\n</tr>\n<tr>\n<td><strong>Story points</strong></td>\n<td>Story Points</td>\n<td>Умовні одиниці оцінки обсягу та складності задач в Agile-командах</td>\n</tr>\n<tr>\n<td><strong>Технічний борг</strong></td>\n<td>Technical Debt</td>\n<td>Накопичені компроміси в коді, які збільшують вартість подальших змін</td>\n</tr>\n</tbody></table>\n","<h1>🔤 Глосарій абревіатур</h1>\n<table>\n<thead>\n<tr>\n<th>Абревіатура</th>\n<th>Розшифровка</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>LOC</strong></td>\n<td>Lines of Code / Рядки коду</td>\n</tr>\n<tr>\n<td><strong>PLOC</strong></td>\n<td>Physical Lines of Code / Фізичні рядки коду</td>\n</tr>\n<tr>\n<td><strong>SLOC</strong></td>\n<td>Source Lines of Code / Рядки вихідного коду</td>\n</tr>\n<tr>\n<td><strong>KLOC</strong></td>\n<td>Kilo Lines of Code / Тисячі рядків коду</td>\n</tr>\n<tr>\n<td><strong>MLOC</strong></td>\n<td>Million Lines of Code / Мільйони рядків коду</td>\n</tr>\n<tr>\n<td><strong>CC</strong></td>\n<td>Cyclomatic Complexity / Цикломатична складність</td>\n</tr>\n<tr>\n<td><strong>MTBF</strong></td>\n<td>Mean Time Between Failures / Середній час між відмовами</td>\n</tr>\n<tr>\n<td><strong>MTTR</strong></td>\n<td>Mean Time To Recovery / Середній час відновлення</td>\n</tr>\n<tr>\n<td><strong>DORA</strong></td>\n<td>DevOps Research and Assessment / Дослідження та оцінка DevOps</td>\n</tr>\n</tbody></table>\n"];let currentSlideIndex=0;

function toggleHelp(){document.getElementById("help-overlay").classList.toggle("hidden");}
function toggleFullscreen(){if(!document.fullscreenElement){const pc=document.getElementById("presentation-container");if(pc.requestFullscreen)pc.requestFullscreen();else if(pc.webkitRequestFullscreen)pc.webkitRequestFullscreen();else if(pc.msRequestFullscreen)pc.msRequestFullscreen();else if(pc.mozRequestFullScreen)pc.mozRequestFullScreen();}else{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();else if(document.msExitFullscreen)document.msExitFullscreen();else if(document.mozCancelFullScreen)document.mozCancelFullScreen();}}
function generateSidebar(){const sc=document.getElementById("sidebar-content");sc.innerHTML="";slides.forEach((html,idx)=>{const t=document.createElement("div");t.className="slide-thumbnail";if(idx===0)t.classList.add("active");const tmp=document.createElement("div");tmp.innerHTML=html;const title=tmp.querySelector("h1,h2");const titleText=title?title.textContent:("Слайд "+(idx+1));const textContent=tmp.textContent.replace(/s+/g," ").trim();const preview=textContent.substring(0,100)+(textContent.length>100?"...":"");t.innerHTML="<div class=\"slide-thumbnail-number\">"+(idx+1)+"</div><div class=\"slide-thumbnail-title\">"+titleText+"</div><div class=\"slide-thumbnail-content\">"+preview+"</div>";t.onclick=()=>{showSlide(idx);if(window.innerWidth<1024)toggleSidebar();};sc.appendChild(t);});}
function updateSidebarActive(){document.querySelectorAll(".slide-thumbnail").forEach((th,idx)=>{if(idx===currentSlideIndex){th.classList.add("active");th.scrollIntoView({behavior:"smooth",block:"nearest"});}else th.classList.remove("active");});}
document.addEventListener("keydown",e=>{switch(e.key){case"ArrowLeft":previousSlide();break;case"ArrowRight":case" ":e.preventDefault();nextSlide();break;case"f":case"F":toggleFullscreen();break;case"s":case"S":toggleSidebar();break;case"?":toggleHelp();break;case"Escape":const sb=document.getElementById("sidebar");const ho=document.getElementById("help-overlay");if(sb.classList.contains("open"))toggleSidebar();else if(!ho.classList.contains("hidden"))ho.classList.add("hidden");break;}});
generateSidebar();showSlide(0);</script></body></html>
