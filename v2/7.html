ча, доменна модель</li>\n<li>⚖️ Вибір техніки та пріоритезація: Must/Should/Could та модель Кано</li>\n<li>✅ Ключові висновки та контрольні питання</li>\n</ol>\n","<h1>🎯 Збір вимог: у чому складність</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Збір вимог (Requirements Elicitation)</strong> - активний процес виявлення потреб, очікувань та обмежень стейкхолдерів за допомогою спеціальних технік. Слово \"elicitation\" точніше за \"збір\": вимоги не лежать готовими, їх потрібно витягнути назовні.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> стейкхолдери добре знають свої проблеми, але рідко здатні сформулювати вимоги до системи. Між тим, що людина говорить, що вона робить і що їй насправді потрібно, завжди є розрив.</p>\n<h2>🧱 Три бар'єри між аналітиком і потребою</h2>\n<table>\n<thead>\n<tr>\n<th>Бар'єр</th>\n<th>У чому проявляється</th>\n<th>Що допомагає</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🗣️ <strong>Мовний</strong></td>\n<td>Замовник говорить мовою бізнесу, команда мислить категоріями системи</td>\n<td>Спільний словник, доменна модель</td>\n</tr>\n<tr>\n<td>🤫 <strong>Неявне знання</strong></td>\n<td>Експерт виконує дії автоматично і не вважає їх вартими згадки</td>\n<td>Спостереження, робота поруч</td>\n</tr>\n<tr>\n<td>🔮 <strong>Невизначеність</strong></td>\n<td>Користувач не може оцінити рішення, якого ще ніколи не бачив</td>\n<td>Прототипи, макети</td>\n</tr>\n</tbody></table>\n<div class=\"warning\"><strong>⚠️ Класична пастка</strong> <p>Питання \"Які у вас вимоги?\" майже завжди дає або порожню відповідь, або перелік готових рішень замість проблем. Техніки збору вимог існують саме для того, щоб обійти цю пастку.</p>\n</div>\n\n","<h1>🗺️ Карта технік збору вимог</h1>\n\n<div class=\"mermaid\" data-source=\"graph TD\n    A[🎯 Техніки збору вимог] --&gt; B[🗣️ Розмовні]\n    A --&gt; C[👀 Спостережні]\n    A --&gt; D[📄 Аналітичні]\n    A --&gt; E[🧩 Моделюючі]\n    B --&gt; B1[🎤 Інтерв'ю]\n    B --&gt; B2[📊 Анкетування]\n    B --&gt; \" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789453568490-3-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<p><strong>Головна ідея:</strong> кожна група технік дає інформацію свого типу. Розмовні техніки розкривають мотивацію та контекст, спостережні фіксують реальну поведінку, аналітичні дають факти з наявних артефактів, моделюючі перевіряють розуміння через конкретну форму.</p>\n<div class=\"tip\"><strong>💡 Правило комбінування</strong> <p>Жодна техніка не є самодостатньою. Типовий проєкт поєднує щонайменше три: наприклад, інтерв'ю з ключовими стейкхолдерами, спостереження за користувачами та прототип для перевірки гіпотез.</p>\n</div>\n\n","<h1>🎤 Інтерв'ю</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Інтерв'ю (Interview)</strong> - цілеспрямована бесіда аналітика зі стейкхолдером для глибокого розуміння його задач, контексту та обмежень. Базова техніка, яка застосовується практично в кожному проєкті.</p>\n</div>\n\n\n\n<h2>🔍 Типи за рівнем формалізації</h2>\n<table>\n<thead>\n<tr>\n<th>Тип</th>\n<th>Як проходить</th>\n<th>Коли доречний</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>📋 <strong>Структуроване</strong></td>\n<td>Фіксований перелік питань в однаковому порядку</td>\n<td>Потрібно порівняти відповіді багатьох людей</td>\n</tr>\n<tr>\n<td>💬 <strong>Неструктуроване</strong></td>\n<td>Вільна розмова навколо теми</td>\n<td>Перше знайомство з невідомою предметною областю</td>\n</tr>\n<tr>\n<td>🎯 <strong>Напівструктуроване</strong></td>\n<td>Заготовлений каркас із свободою заглиблюватись у важливе</td>\n<td>Більшість реальних ситуацій</td>\n</tr>\n</tbody></table>\n<h2>⏱️ Структура ефективного інтерв'ю</h2>\n<ul>\n<li>📝 <strong>Підготовка</strong>: визначити мету, вивчити роль співрозмовника, скласти каркас питань, запланувати 45-60 хвилин</li>\n<li>👂 <strong>Проведення</strong>: аналітик більше слухає, ніж говорить; уточнює незрозуміле; фіксує терміни предметної області</li>\n<li>✅ <strong>Завершення</strong>: підсумувати почуте, домовитись про уточнення, записати результати одразу після зустрічі та надіслати на підтвердження</li>\n</ul>\n","<h1>❓ Мистецтво ставити питання</h1>\n<p><strong>Головна ідея:</strong> якість інтерв'ю визначається не кількістю питань, а їхнім типом. Аналітик шукає проблеми та контекст, а не підтвердження власних гіпотез.</p>\n<h2>🔓 Відкриті проти навідних</h2>\n<table>\n<thead>\n<tr>\n<th>❌ Навідне або закрите питання</th>\n<th>✅ Відкрите питання</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Ви ж хочете, щоб звіт формувався автоматично?</td>\n<td>Як ви зараз готуєте цей звіт? Що в цьому найбільше заважає?</td>\n</tr>\n<tr>\n<td>Вам потрібен експорт у Excel?</td>\n<td>Що ви робите з даними після того, як отримали їх із системи?</td>\n</tr>\n<tr>\n<td>Система має бути швидкою?</td>\n<td>Розкажіть про останній випадок, коли ви чекали на систему</td>\n</tr>\n<tr>\n<td>Це рідкісна ситуація?</td>\n<td>Як часто це трапляється і що відбувається далі?</td>\n</tr>\n</tbody></table>\n<h2>🧭 Питання, які варто ставити завжди</h2>\n<ul>\n<li>🎯 <strong>Про мету</strong>: \"Навіщо ви це робите? Що станеться, якщо не зробити?\"</li>\n<li>🔄 <strong>Про поточний процес</strong>: \"Проведіть мене крок за кроком через типовий день\"</li>\n<li>⚠️ <strong>Про винятки</strong>: \"Що відбувається, коли щось іде не так?\"</li>\n<li>👥 <strong>Про інших</strong>: \"Хто ще залучений у цей процес або залежить від його результату?\"</li>\n</ul>\n<div class=\"warning\"><strong>⚠️ Техніка \"п'яти чому\"</strong> <p>Послідовне питання \"чому?\" у відповідь на кожне пояснення дозволяє від запиту на конкретну функцію дійти до справжньої потреби. Запит \"потрібна кнопка експорту\" після кількох \"чому\" часто перетворюється на \"потрібно щотижня звіряти залишки з бухгалтерією\".</p>\n</div>\n\n","<h1>📊 Анкетування</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Анкетування (Questionnaire, Survey)</strong> - збір інформації від великої кількості респондентів через стандартизовану форму питань. Дає кількісні дані там, де індивідуальні інтерв'ю нереалістичні.</p>\n</div>\n\n\n\n<h2>🎯 Коли анкетування є правильним вибором</h2>\n<ul>\n<li>👥 Багато стейкхолдерів однієї ролі, і опитати кожного особисто неможливо</li>\n<li>🌍 Географічно розподілена аудиторія</li>\n<li>📈 Потрібна статистика: частота використання функцій, розподіл думок, рейтинг проблем</li>\n<li>✅ Потрібно перевірити гіпотезу, отриману з кількох інтерв'ю, на широкій вибірці</li>\n</ul>\n<h2>✏️ Типи питань</h2>\n<table>\n<thead>\n<tr>\n<th>Тип</th>\n<th>Приклад</th>\n<th>Що дає</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>☑️ <strong>Закриті</strong></td>\n<td>Як часто ви користуєтесь мобільним застосунком? Щодня / щотижня / рідше</td>\n<td>Агрегація та статистика</td>\n</tr>\n<tr>\n<td>📏 <strong>Шкальні</strong></td>\n<td>Оцініть зручність пошуку від 1 до 5</td>\n<td>Порівняння між групами</td>\n</tr>\n<tr>\n<td>💬 <strong>Відкриті</strong></td>\n<td>Що найбільше заважає вам у поточній системі?</td>\n<td>Несподівані інсайти</td>\n</tr>\n</tbody></table>\n<div class=\"danger\"><strong>🚫 Обмеження техніки</strong> <p>Анкета не дозволяє уточнити відповідь, тому погано працює для складних або нових тем. Вона показує \"що\" і \"скільки\", але майже ніколи не пояснює \"чому\". Для розуміння причин потрібне інтерв'ю або спостереження.</p>\n</div>\n\n\n\n\n\n<div class=\"tip\"><strong>💡 Практичні правила</strong> <p>Анкета заповнюється не довше 10-15 хвилин; кожне питання перевіряється на однозначність; перед розсилкою анкету тестують на 2-3 людях із цільової аудиторії.</p>\n</div>\n\n","<h1>🎨 Воркшопи</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Воркшоп (Workshop)</strong> - модерована групова сесія, на якій стейкхолдери з різними ролями спільно виявляють, обговорюють та узгоджують вимоги. Головна перевага: конфлікти між сторонами виявляються та вирішуються в реальному часі, а не через ланцюжок окремих зустрічей.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> коли замовник, користувачі та розробники сидять в одній кімнаті, суперечності стають видимими одразу. Те, на що через листування пішли б тижні, на воркшопі узгоджується за годину.</p>\n<h2>🧩 Основні формати</h2>\n<table>\n<thead>\n<tr>\n<th>Формат</th>\n<th>Мета</th>\n<th>Особливість</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>💭 <strong>Мозковий штурм</strong></td>\n<td>Максимальна кількість ідей</td>\n<td>Критика заборонена; відбір ідей є окремою фазою</td>\n</tr>\n<tr>\n<td>👥 <strong>Фокус-група</strong></td>\n<td>Думка цільової аудиторії щодо теми або прототипу</td>\n<td>Невелика група користувачів, модерована дискусія</td>\n</tr>\n<tr>\n<td>🏗️ <strong>JAD-сесія</strong></td>\n<td>Спільне визначення вимог та рішень</td>\n<td>Замовник, аналітики та розробники працюють одночасно</td>\n</tr>\n</tbody></table>\n<p><strong>JAD</strong> (Joint Application Design / Спільне проєктування застосунку) - формалізована методика воркшопів, що виникла в IBM наприкінці 1970-х років.</p>\n<h2>🎙️ Роль фасилітатора</h2>\n<ul>\n<li>⚖️ Зберігає нейтральність і не лобіює власні рішення</li>\n<li>⏱️ Утримує обговорення в межах порядку денного та часу</li>\n<li>🔇 Не дає домінувати найгучнішим учасникам і залучає мовчазних</li>\n<li>📝 Фіксує домовленості та відкриті питання на видному для всіх місці</li>\n</ul>\n<div class=\"warning\"><strong>⚠️ Типова помилка</strong> <p>Воркшоп без підготовленого порядку денного, чіткої мети та списку учасників перетворюється на нараду, після якої кожен виходить зі своїм розумінням домовленостей.</p>\n</div>\n\n","<h1>👀 Спостереження</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Спостереження (Observation)</strong> - вивчення роботи користувачів у їхньому природному середовищі. На відміну від інтерв'ю, де людина описує те, що, як їй здається, вона робить, спостереження фіксує реальну поведінку.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> значна частина професійних знань є неявною. Досвідчений працівник не згадає в інтерв'ю про обхідні шляхи, паперові нотатки поруч із монітором чи \"магічні\" послідовності дій, бо для нього це буденність.</p>\n<h2>🔍 Рівні залученості спостерігача</h2>\n<table>\n<thead>\n<tr>\n<th>Рівень</th>\n<th>Опис</th>\n<th>Коли застосовувати</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>👁️ <strong>Пасивне</strong></td>\n<td>Спостерігач не втручається і не ставить питань під час роботи</td>\n<td>Потрібно побачити процес без спотворень</td>\n</tr>\n<tr>\n<td>🚶 <strong>Shadowing</strong></td>\n<td>Аналітик супроводжує користувача і уточнює дії по ходу</td>\n<td>Потрібно зрозуміти логіку рішень у контексті</td>\n</tr>\n<tr>\n<td>🧭 <strong>Етнографічне</strong></td>\n<td>Тривале занурення в середовище, іноді з виконанням задач</td>\n<td>Складна предметна область з великою часткою неявних знань</td>\n</tr>\n</tbody></table>\n<h2>💡 Ілюстративний приклад</h2>\n<p>Команда, що проєктує систему для складу, спостерігає за роботою комірників протягом кількох змін. Виявляється, що помітна частина робочого часу йде на пошук товару вручну, оскільки наявна система не показує точне місце зберігання. Ця потреба не звучала в жодному інтерв'ю: працівники вважали такий пошук нормою.</p>\n<div class=\"warning\"><strong>⚠️ Ефект спостерігача</strong> <p>Люди змінюють поведінку, коли знають, що за ними спостерігають. Тому важливо пояснити мету спостереження, не оцінювати дії працівника та за можливості провести кілька сесій.</p>\n</div>\n\n","<h1>📄 Аналіз документів та існуючих систем</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Аналіз документів (Document Analysis)</strong> - вивчення наявних артефактів організації: регламентів, інструкцій, форм, звітів, скарг користувачів, законодавчих актів. <strong>Аналіз існуючих систем</strong> - дослідження програмного забезпечення, яке замінюється або з яким потрібно інтегруватись.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> ці техніки не потребують часу стейкхолдерів і дають фактичну базу для подальших інтерв'ю. Аналітик приходить на зустріч уже з розумінням термінології та процесів.</p>\n<h2>📚 Що можна дізнатись із документів</h2>\n<table>\n<thead>\n<tr>\n<th>Джерело</th>\n<th>Які вимоги виявляє</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>📜 <strong>Регламенти та інструкції</strong></td>\n<td>Бізнес-правила, послідовність кроків, ролі та відповідальність</td>\n</tr>\n<tr>\n<td>📝 <strong>Форми та бланки</strong></td>\n<td>Структура даних: які поля обов'язкові, які є довідники</td>\n</tr>\n<tr>\n<td>📊 <strong>Звіти</strong></td>\n<td>Які показники важливі для керівництва та в якому розрізі</td>\n</tr>\n<tr>\n<td>📮 <strong>Скарги та звернення</strong></td>\n<td>Проблемні місця поточного процесу</td>\n</tr>\n<tr>\n<td>⚖️ <strong>Нормативні акти</strong></td>\n<td>Обмеження, яких не можна порушити</td>\n</tr>\n</tbody></table>\n<h2>🖥️ Що дає аналіз існуючої системи</h2>\n<p>Перелік функцій, яких користувачі не готові позбутися, структуру даних для міграції, необхідні інтеграції та обхідні шляхи користувачів, які сигналізують про незадоволені потреби.</p>\n<div class=\"danger\"><strong>🚫 Пастка</strong> <p>Документи описують процес таким, яким він має бути за задумом, а не таким, яким він є насправді. Регламент, якого ніхто не дотримується, не є джерелом вимог. Знайдене в документах завжди перевіряють спостереженням або інтерв'ю.</p>\n</div>\n\n","<h1>🎨 Прототипування</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Прототипування (Prototyping)</strong> - створення ранніх, спрощених версій продукту або його інтерфейсу для перевірки розуміння вимог до початку повноцінної розробки. Прототип перетворює абстрактне обговорення на реакцію на конкретну річ.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> користувачі значно краще критикують те, що бачать, ніж уявляють те, чого ще немає. Прототип виявляє розбіжності в розумінні тоді, коли їх виправлення коштує години, а не тижні.</p>\n<h2>📐 Рівні деталізації</h2>\n<table>\n<thead>\n<tr>\n<th>Рівень</th>\n<th>Деталізація</th>\n<th>Час створення</th>\n<th>Що перевіряє</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>✏️ <strong>Паперові ескізи</strong></td>\n<td>Низька</td>\n<td>Хвилини</td>\n<td>Концепцію та основні сценарії</td>\n</tr>\n<tr>\n<td>📐 <strong>Wireframe (каркас)</strong></td>\n<td>Середня</td>\n<td>Години</td>\n<td>Структуру екранів та навігацію</td>\n</tr>\n<tr>\n<td>🖱️ <strong>Інтерактивний макет</strong></td>\n<td>Висока</td>\n<td>Дні</td>\n<td>Зручність користування, послідовність дій</td>\n</tr>\n<tr>\n<td>💻 <strong>Робочий прототип</strong></td>\n<td>Дуже висока</td>\n<td>Тижні</td>\n<td>Технічну здійсненність, інтеграції</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Правило мінімальної достатності</strong> <p>Обирайте найменший рівень деталізації, який дозволяє отримати потрібний зворотний зв'язок. Красивий макет на етапі обговорення концепції шкодить: учасники обговорюють кольори та шрифти замість суті сценарію.</p>\n</div>\n\n\n\n\n\n<div class=\"warning\"><strong>⚠️ Ризик прототипу</strong> <p>Замовник може сприйняти робочий прототип як майже готовий продукт. Його статус і призначення потрібно проговорити явно.</p>\n</div>\n\n","<h1>🗺️ Карта подорожі користувача</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Карта подорожі користувача (User Journey Map)</strong> - візуалізація послідовності кроків, які проходить користувач для досягнення своєї мети, разом із його діями, думками, емоціями та проблемами на кожному кроці.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> окремі функції можуть працювати бездоганно, а шлях користувача в цілому залишатись незручним. Карта показує систему очима людини, а не через перелік екранів.</p>\n<h2>🧩 Структура карти</h2>\n<table>\n<thead>\n<tr>\n<th>Елемент</th>\n<th>Що фіксується</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🎭 <strong>Етапи</strong></td>\n<td>Стадії взаємодії: усвідомлення потреби, пошук, дія, підтримка</td>\n</tr>\n<tr>\n<td>🎯 <strong>Дії</strong></td>\n<td>Що конкретно робить користувач на кожному етапі</td>\n</tr>\n<tr>\n<td>💭 <strong>Думки</strong></td>\n<td>Які питання та сумніви виникають у цей момент</td>\n</tr>\n<tr>\n<td>😊 <strong>Емоції</strong></td>\n<td>Емоційний стан: від впевненості до роздратування</td>\n</tr>\n<tr>\n<td>⚠️ <strong>Проблемні точки</strong></td>\n<td>Де виникає тертя, затримка або ризик відмови</td>\n</tr>\n<tr>\n<td>💡 <strong>Можливості</strong></td>\n<td>Що можна змінити, щоб усунути проблему</td>\n</tr>\n</tbody></table>\n<h2>🛒 Приклад: етап \"Оформлення замовлення\" в інтернет-магазині</h2>\n<table>\n<thead>\n<tr>\n<th>Елемент</th>\n<th>Зміст</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🎯 Дії</td>\n<td>Переходить у кошик, заповнює адресу доставки, вводить дані картки</td>\n</tr>\n<tr>\n<td>💭 Думки</td>\n<td>\"Чи безпечно вводити тут картку? Чому так багато полів?\"</td>\n</tr>\n<tr>\n<td>😐 Емоції</td>\n<td>Нейтральний старт, зростання роздратування на довгій формі</td>\n</tr>\n<tr>\n<td>⚠️ Проблеми</td>\n<td>Форма з багатьма обов'язковими полями, відсутні ознаки безпечної оплати</td>\n</tr>\n<tr>\n<td>💡 Можливість</td>\n<td>Скоротити форму до необхідного мінімуму, додати оплату в один крок</td>\n</tr>\n</tbody></table>\n<div class=\"success\"><strong>✅ Результат</strong> <p>Кожна проблемна точка на карті є кандидатом у вимогу. Карта подорожі природно поєднується зі спостереженням та інтерв'ю, з яких береться матеріал для її наповнення.</p>\n</div>\n\n","<h1>🏗️ Моделювання предметної області</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Доменна модель (Domain Model)</strong> - концептуальна модель предметної області: ключові сутності, їхні атрибути, зв'язки між ними та бізнес-правила. Створюється разом із замовником і формує спільний словник проєкту.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> значна частина непорозумінь між бізнесом і командою виникає через терміни. Слово \"замовлення\" може означати кошик, оплачену покупку або накладну для складу. Доменна модель робить такі відмінності явними ще до написання коду.</p>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    A[👤 Клієнт] --&gt;|оформлює| B[🛒 Замовлення]\n    B --&gt;|складається з| C[📦 Позиція замовлення]\n    C --&gt;|посилається на| D[🏷️ Товар]\n    D --&gt;|належить до| E[📂 Категорія]\n    B --&gt;|оплачується через| F[💳 Платіж]\n    B --&gt;|доставляється на| G[📍 Адреса]\n    A --&gt;|має| G\n    style A fill:#e3f2fd,stroke:#1565c0,stroke-width:2px\n    style B fill:#e8f5e9,stroke:#2e7d32,stroke-width:2px\n    style C fill:#fff3e0,stroke:#e65100,stroke-width:2px\n    style D fill:#f3e5f5,stroke:#6a1b9a,stroke-width:2px\n    style E fill:#fce4ec,stroke:#c2185b,stroke-width:2px\n    style F fill:#fff9c4,stroke:#f57f17,stroke-width:2px\n    style G fill:#e3f2fd,stroke:#1565c0,stroke-width:2px\"><svg id=\"exp-1789453568633-12-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 1549.34375px;\" viewBox=\"4 4 1549.34375 266.25\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1789453568633-12-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1789453568633-12-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1789453568633-12-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#exp-1789453568633-12-0 .error-icon{fill:#552222;}#exp-1789453568633-12-0 .error-text{fill:#552222;stroke:#552222;}#exp-1789453568633-12-0 .edge-thickness-normal{stroke <rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>📦 Позиція замовлення</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789453568633-12-0-flowchart-D-5\" data-look=\"neo\" transform=\"translate(1137.59375, 48)\"><rect class=\"basic label-container\" style=\"fill:#f3e5f5 !important;stroke:#6a1b9a !important;stroke-width:2px !important\" x=\"-76\" y=\"-24\" width=\"152\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -12)\"><rect></rect><foreignObject width=\"120\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🏷️ Товар</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789453568633-12-0-flowchart-E-7\" data-look=\"neo\" transform=\"translate(1469.34375, 48)\"><rect class=\"basic label-container\" style=\"fill:#fce4ec !important;stroke:#c2185b !important;stroke-width:2px !important\" x=\"-76\" y=\"-24\" width=\"152\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -12)\"><rect></rect><foreignObject width=\"120\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>📂 Категорія</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789453568633-12-0-flowchart-F-9\" data-look=\"neo\" transform=\"translate(784.296875, 148)\"><rect class=\"basic label-container\" style=\"fill:#fff9c4 !important;stroke:#f57f17 !important;stroke-width:2px !important\" x=\"-76\" y=\"-24\" width=\"152\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -12)\"><rect></rect><foreignObject width=\"120\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>💳 Платіж</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789453568633-12-0-flowchart-G-11\" data-look=\"neo\" transform=\"translate(784.296875, 236)\"><rect class=\"basic label-container\" style=\"fill:#e3f2fd !important;stroke:#1565c0 !important;stroke-width:2px !important\" x=\"-76\" y=\"-24\" width=\"152\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -12)\"><rect></rect><foreignObject width=\"120\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>📍 Адреса</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1789453568633-12-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789453568633-12-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<h2>🔍 Які питання допомагає поставити модель</h2>\n<ul>\n<li>❓ Чи може одне замовлення мати кілька платежів, наприклад часткову оплату?</li>\n<li>❓ Чи може товар належати до кількох категорій одночасно?</li>\n<li>❓ Що відбувається із замовленням, якщо адреса клієнта змінилась після оформлення?</li>\n</ul>\n<div class=\"tip\"><strong>💡 Практична цінність</strong> <p>Кожен зв'язок на діаграмі є питанням до замовника. Відповіді на них перетворюються на бізнес-правила, які інакше з'ясувались би лише під час розробки або тестування.</p>\n</div>\n\n","<h1>⚖️ Як обрати техніку</h1>\n<p><strong>Головна ідея:</strong> вибір техніки залежить від того, яку інформацію потрібно отримати, скільки стейкхолдерів залучено та наскільки нова предметна область для команди. Кожна техніка має сильну сторону і сліпу зону, яку закриває інша.</p>\n<table>\n<thead>\n<tr>\n<th>Техніка</th>\n<th>Сильна сторона</th>\n<th>Сліпа зона</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🎤 <strong>Інтерв'ю</strong></td>\n<td>Глибина, контекст, мотивація</td>\n<td>Витратне за часом, залежить від співрозмовника</td>\n</tr>\n<tr>\n<td>📊 <strong>Анкетування</strong></td>\n<td>Кількісні дані з великої вибірки</td>\n<td>Не пояснює причин, немає уточнень</td>\n</tr>\n<tr>\n<td>🎨 <strong>Воркшоп</strong></td>\n<td>Узгодження між сторонами</td>\n<td>Складна організація, залежить від фасилітатора</td>\n</tr>\n<tr>\n<td>👀 <strong>Спостереження</strong></td>\n<td>Реальна поведінка, неявні знання</td>\n<td>Ефект спостерігача, тривалість</td>\n</tr>\n<tr>\n<td>📄 <strong>Аналіз документів</strong></td>\n<td>Факти та правила без участі людей</td>\n<td>Описує задум, а не реальність</td>\n</tr>\n<tr>\n<td>🎨 <strong>Прототипування</strong></td>\n<td>Конкретний відгук на конкретне рішення</td>\n<td>Ризик сприйняття як готового продукту</td>\n</tr>\n<tr>\n<td>🗺️ <strong>Карта подорожі</strong></td>\n<td>Цілісний досвід, проблемні точки</td>\n<td>Потребує даних з інших технік</td>\n</tr>\n<tr>\n<td>🏗️ <strong>Доменна модель</strong></td>\n<td>Спільний словник, бізнес-правила</td>\n<td>Не описує поведінку та інтерфейс</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Типова послідовність у проєкті</strong> <ol>\n<li>📄 Аналіз документів для підготовки та вивчення термінології</li>\n<li>🎤 Інтерв'ю з ключовими особами для розуміння цілей</li>\n<li>👀 Спостереження або анкетування для перевірки на реальній аудиторії</li>\n<li>🎨 Прототип або карта подорожі для валідації розуміння</li>\n<li>🎨 Воркшоп для узгодження суперечностей</li>\n</ol>\n</div>\n\n\n\n<p>------------------------------ | ---------------------------------------------- | -------------------------------------------------- | -------------------------------------------------- |<br>| 🎤 <strong>Інтерв'ю</strong>                | Глибина, контекст, мотивація                   | Витратне за часом, суб'єктивність                  | Ключові стейкхолдери, старт проєкту                |<br>| 📊 <strong>Анкетування</strong>             | Кількісні дані з великої вибірки               | Немає уточнень, не пояснює причин                  | Багато користувачів однієї ролі                    |<br>| 🎨 <strong>Воркшоп</strong>                 | Узгодження між сторонами, швидкий консенсус    | Складна організація, залежить від фасилітатора     | Конфліктні інтереси, потрібне спільне рішення      |<br>| 👀 <strong>Спостереження</strong>           | Реальна поведінка, неявні знання               | Ефект спостерігача, тривалість                     | Операційні процеси, заміна існуючої системи        |<br>| 📄 <strong>Аналіз документів</strong>       | Факти, правила, обмеження без участі людей     | Описує задум, а не реальність                      | Регульовані галузі, підготовка до інтерв'ю         |<br>| 🎨 <strong>Прототипування</strong>          | Перевірка розуміння, конкретний відгук         | Ризик сприйняття як готового продукту              | Новий інтерфейс, невизначені очікування            |<br>| 🗺️ <strong>Карта подорожі</strong>          | Цілісний досвід, проблемні точки               | Потребує даних з інших технік                      | Продукти для кінцевих користувачів                 |<br>| 🏗️ <strong>Доменна модель</strong>          | Спільний словник, бізнес-правила               | Не описує поведінку та інтерфейс                   | Складна предметна область, багато сутностей        |</p>\n<div class=\"tip\"><strong>💡 Типова послідовність</strong> <p>Аналіз документів для підготовки, інтерв'ю з ключовими особами для розуміння цілей, спостереження або анкетування для перевірки на реальній аудиторії, прототип або карта подорожі для валідації, воркшоп для узгодження суперечностей.</p>\n</div>\n\n","<h1>🎯 Пріоритезація: Must / Should / Could / Won't</h1>\n<div class=\"info\"><strong>ℹ️ Ключова концепція</strong> <p>Зібраний перелік вимог майже завжди перевищує можливості бюджету та строків. Пріоритезація за критичністю відповідає на питання: без чого продукт не має сенсу, а що можна відкласти.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> пріоритет не означає важливість для когось одного. Функція може бути дуже бажаною для директора і при цьому не бути Must have, якщо перший реліз працює без неї.</p>\n<h2>🏷️ Категорії</h2>\n<table>\n<thead>\n<tr>\n<th>Категорія</th>\n<th>Критерій</th>\n<th>Приклад для інтернет-магазину</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🔴 <strong>Must have</strong></td>\n<td>Без цього реліз неможливий або незаконний</td>\n<td>Додати товар у кошик та оплатити замовлення</td>\n</tr>\n<tr>\n<td>🟠 <strong>Should have</strong></td>\n<td>Важливо, але є тимчасовий обхідний шлях</td>\n<td>Фільтри в каталозі товарів</td>\n</tr>\n<tr>\n<td>🟡 <strong>Could have</strong></td>\n<td>Бажано, реалізується за наявності ресурсів</td>\n<td>Список бажань</td>\n</tr>\n<tr>\n<td>⚪ <strong>Won't have</strong></td>\n<td>Свідомо виключено з цього релізу, зафіксовано на майбутнє</td>\n<td>Віртуальна примірка</td>\n</tr>\n</tbody></table>\n<h2>⚖️ Як проводити класифікацію</h2>\n<ul>\n<li>👥 Спільно зі стейкхолдерами, а не силами команди розробки</li>\n<li>🎯 Для конкретного релізу, а не для продукту взагалі: пріоритети змінюються від релізу до релізу</li>\n<li>🔧 З урахуванням технічних обмежень та залежностей між вимогами</li>\n</ul>\n<div class=\"warning\"><strong>⚠️ Сигнал неякісної пріоритезації</strong> <p>Якщо переважна більшість вимог потрапляє в Must have, класифікація не виконала своєї задачі. Корисне питання до замовника: \"Що станеться, якщо ми випустимо продукт без цієї функції?\"</p>\n</div>\n\n\n\n\n\n<div class=\"note\"><strong>📝 Категорія Won't have</strong> <p>Не є відмовою. Це домовленість про те, що вимога зафіксована, обговорена та свідомо перенесена, що захищає від повторних дискусій про неї протягом релізу.</p>\n</div>\n\n","<h1>📈 Модель Кано</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Модель Кано (Kano Model)</strong> - метод класифікації характеристик продукту за характером їхнього впливу на задоволеність користувача. Запропонована Норіакі Кано у 1984 році. На відміну від класифікації Must/Should/Could, вона відповідає на питання, як користувач сприйме наявність чи відсутність функції.</p>\n</div>\n\n\n\n<h2>🎯 Основні категорії</h2>\n<table>\n<thead>\n<tr>\n<th>Категорія</th>\n<th>Якщо є</th>\n<th>Якщо немає</th>\n<th>Приклад</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🧱 <strong>Базові (Must-be)</strong></td>\n<td>Нейтральна реакція</td>\n<td>Сильне розчарування</td>\n<td>Захист даних у банківському застосунку</td>\n</tr>\n<tr>\n<td>📈 <strong>Лінійні (One-dimensional)</strong></td>\n<td>Що краще, то вища задоволеність</td>\n<td>Що гірше, то нижча</td>\n<td>Швидкість завантаження сторінки</td>\n</tr>\n<tr>\n<td>✨ <strong>Привабливі (Attractive)</strong></td>\n<td>Захоплення</td>\n<td>Байдужість</td>\n<td>Розпізнавання обличчя, коли воно щойно з'явилось у смартфонах</td>\n</tr>\n<tr>\n<td>😐 <strong>Байдужі (Indifferent)</strong></td>\n<td>Байдужість</td>\n<td>Байдужість</td>\n<td>Функція, якою ніхто не користується</td>\n</tr>\n</tbody></table>\n<h2>📋 Як визначити категорію</h2>\n<p>Для кожної функції респонденту ставлять пару питань: <strong>функціональне</strong> (\"Як ви поставитесь, якщо ця функція буде?\") та <strong>дисфункціональне</strong> (\"Як ви поставитесь, якщо її не буде?\"). Комбінація відповідей визначає категорію.</p>\n<div class=\"warning\"><strong>⚠️ Категорії мігрують з часом</strong> <p>Привабливі функції з роками стають базовими. Розпізнавання обличчя чи безкоштовне оновлення карт колись захоплювали, а сьогодні їх відсутність сприймається як недолік. Модель Кано потребує періодичного перегляду.</p>\n</div>\n\n\n\n\n\n<div class=\"tip\"><strong>💡 Практичне застосування</strong> <p>Базові реалізують обов'язково, навіть якщо про них ніхто не просив: користувач не назве їх в інтерв'ю, бо вважає очевидними. Лінійні оптимізують у межах ресурсів. Привабливі стають конкурентною перевагою.</p>\n</div>\n\n","<h1>✅ Ключові висновки</h1>\n<div class=\"success\"><strong>✅ Головні тези лекції</strong> <p><strong>🎯 Вимоги не збирають, а виявляють.</strong><br>Стейкхолдери знають свої проблеми, але не вимоги до системи. Завдання аналітика: дістати потребу з-під сформульованого запиту.</p>\n<p><strong>🗺️ Техніки доповнюють одна одну.</strong><br>Розмовні дають мотивацію, спостережні показують реальність, аналітичні надають факти, моделюючі перевіряють розуміння. Реальний проєкт поєднує кілька з них.</p>\n<p><strong>❓ Якість інтерв'ю визначають відкриті питання.</strong><br>Питання про поточний процес, мету та винятки дають більше, ніж підтвердження готових гіпотез.</p>\n<p><strong>👀 Спостереження виявляє те, чого не скажуть словами.</strong><br>Неявні знання та обхідні шляхи користувачів стають видимими лише в природному середовищі.</p>\n<p><strong>🎨 Прототип перетворює уявлення на реакцію.</strong><br>Мінімально достатній рівень деталізації дозволяє отримати відгук тоді, коли зміни ще дешеві.</p>\n<p><strong>🏗️ Доменна модель усуває непорозуміння в термінах.</strong><br>Спільний словник із замовником запобігає помилкам, які інакше виявились би на етапі тестування.</p>\n<p><strong>🎯 Пріоритезація за критичністю визначає обсяг релізу.</strong><br>Must have задає мінімум, Won't have фіксує свідомо відкладене; надлишок Must have є сигналом переглянути класифікацію.</p>\n<p><strong>📈 Модель Кано показує, як функції сприймає користувач.</strong><br>Базові реалізують завжди, лінійні оптимізують, привабливі використовують як конкурентну перевагу.</p>\n</div>\n\n","<h1>❓ Контрольні питання</h1>\n<ol>\n<li><p>🤔 Чому термін \"виявлення\" (elicitation) точніший за \"збір\" вимог? Які три бар'єри стоять між аналітиком і справжньою потребою?</p>\n</li>\n<li><p>🤔 Порівняйте <strong>структуроване</strong>, <strong>неструктуроване</strong> та <strong>напівструктуроване</strong> інтерв'ю. У якій ситуації доречне кожне з них?</p>\n</li>\n<li><p>🤔 Перетворіть навідне питання \"Вам потрібні сповіщення в Telegram?\" на два <strong>відкриті</strong> питання, які виявлять справжню потребу.</p>\n</li>\n<li><p>🤔 У яких випадках <strong>анкетування</strong> доцільніше за серію інтерв'ю, і яку інформацію воно принципово не здатне дати?</p>\n</li>\n<li><p>🤔 Яку інформацію дає <strong>спостереження</strong>, недоступну через інтерв'ю? Що таке ефект спостерігача і як його зменшити?</p>\n</li>\n<li><p>🤔 Поясніть <strong>правило мінімальної достатності</strong> для прототипів. Чому детальний макет на ранній стадії може зашкодити?</p>\n</li>\n<li><p>🤔 Побудуйте фрагмент <strong>карти подорожі</strong> для етапу \"запис на консультацію\" в застосунку клініки: дії, думки, проблемні точки, можливості.</p>\n</li>\n<li><p>🤔 Чим відрізняються категорії <strong>Should have</strong> та <strong>Could have</strong>? Чому переважання Must have є проблемою?</p>\n</li>\n<li><p>🤔 Які три основні категорії виділяє <strong>модель Кано</strong>? Наведіть по одному прикладу з мобільного банкінгу та поясніть, чому категорії мігрують з часом.</p>\n</li>\n</ol>\n","<h1>📚 Глосарій термінів</h1>\n<table>\n<thead>\n<tr>\n<th>Термін</th>\n<th>English</th>\n<th>Визначення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Виявлення вимог</td>\n<td>Requirements Elicitation</td>\n<td>Активний процес виявлення потреб та обмежень стейкхолдерів за допомогою технік</td>\n</tr>\n<tr>\n<td>Інтерв'ю</td>\n<td>Interview</td>\n<td>Цілеспрямована бесіда аналітика зі стейкхолдером для розуміння задач і контексту</td>\n</tr>\n<tr>\n<td>Відкрите питання</td>\n<td>Open-ended Question</td>\n<td>Питання, яке передбачає розгорнуту відповідь, а не вибір із запропонованих варіантів</td>\n</tr>\n<tr>\n<td>Навідне питання</td>\n<td>Leading Question</td>\n<td>Питання, що підказує бажану відповідь і спотворює результат</td>\n</tr>\n<tr>\n<td>Анкетування</td>\n<td>Questionnaire, Survey</td>\n<td>Збір інформації від багатьох респондентів через стандартизовану форму</td>\n</tr>\n<tr>\n<td>Воркшоп</td>\n<td>Workshop</td>\n<td>Модерована групова сесія для спільного виявлення та узгодження вимог</td>\n</tr>\n<tr>\n<td>Мозковий штурм</td>\n<td>Brainstorming</td>\n<td>Групова генерація ідей без критики з подальшим окремим відбором</td>\n</tr>\n<tr>\n<td>Фокус-група</td>\n<td>Focus Group</td>\n<td>Модерована дискусія невеликої групи цільових користувачів</td>\n</tr>\n<tr>\n<td>Фасилітатор</td>\n<td>Facilitator</td>\n<td>Нейтральний модератор, який структурує обговорення та забезпечує участь усіх</td>\n</tr>\n<tr>\n<td>Спостереження</td>\n<td>Observation</td>\n<td>Вивчення реальної поведінки користувачів у природному середовищі</td>\n</tr>\n<tr>\n<td>Супроводження</td>\n<td>Shadowing</td>\n<td>Спостереження, за якого аналітик супроводжує користувача і уточнює дії по ходу</td>\n</tr>\n<tr>\n<td>Неявне знання</td>\n<td>Tacit Knowledge</td>\n<td>Знання, яке експерт застосовує автоматично і не може легко сформулювати</td>\n</tr>\n<tr>\n<td>Прототип</td>\n<td>Prototype</td>\n<td>Рання спрощена версія продукту для перевірки розуміння вимог</td>\n</tr>\n<tr>\n<td>Каркас</td>\n<td>Wireframe</td>\n<td>Схематичне зображення структури екрана без деталей візуального дизайну</td>\n</tr>\n<tr>\n<td>Макет</td>\n<td>Mockup</td>\n<td>Статичне візуальне представлення майбутнього інтерфейсу</td>\n</tr>\n<tr>\n<td>Карта подорожі користувача</td>\n<td>User Journey Map</td>\n<td>Візуалізація шляху користувача з діями, думками, емоціями та проблемними точками</td>\n</tr>\n<tr>\n<td>Проблемна точка</td>\n<td>Pain Point</td>\n<td>Місце на шляху користувача, де виникає тертя, затримка або ризик відмови</td>\n</tr>\n<tr>\n<td>Доменна модель</td>\n<td>Domain Model</td>\n<td>Концептуальна модель сутностей, зв'язків та бізнес-правил предметної області</td>\n</tr>\n<tr>\n<td>Бізнес-правило</td>\n<td>Business Rule</td>\n<td>Обмеження або умова предметної області, яку система має дотримуватись</td>\n</tr>\n<tr>\n<td>Модель Кано</td>\n<td>Kano Model</td>\n<td>Класифікація функцій продукту за впливом на задоволеність користувача</td>\n</tr>\n</tbody></table>\n","<h1>📝 Глосарій абревіатур</h1>\n<table>\n<thead>\n<tr>\n<th>Абревіатура</th>\n<th>Розшифровка</th>\n<th>Переклад</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>JAD</td>\n<td>Joint Application Design</td>\n<td>Спільне проєктування застосунку</td>\n</tr>\n<tr>\n<td>UI</td>\n<td>User Interface</td>\n<td>Користувацький інтерфейс</td>\n</tr>\n<tr>\n<td>UX</td>\n<td>User Experience</td>\n<td>Користувацький досвід</td>\n</tr>\n<tr>\n<td>BA</td>\n<td>Business Analyst</td>\n<td>Бізнес-аналітик</td>\n</tr>\n<tr>\n<td>RE</td>\n<td>Requirements Engineering</td>\n<td>Інженерія вимог</td>\n</tr>\n<tr>\n<td>SRS</td>\n<td>Software Requirements Specification</td>\n<td>Специфікація вимог до програмного забезпечення</td>\n</tr>\n</tbody></table>\n"];let currentSlideIndex=0;
function renderMath(root){if(typeof renderMathInElement!=="function"||!root)return;try{renderMathInElement(root,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\[",right:"\\]",display:true},{left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false}],throwOnError:false,strict:"ignore",ignoredTags:["script","noscript","style","textarea","pre","code"]});}catch(e){console.warn("Math render error:",e);}}
function showSlide(i){if(i<0||i>=slides.length)return;currentSlideIndex=i;const el=document.getElementById("current-slide");el.innerHTML=slides[i];el.scrollTop=0;renderMath(el);document.getElementById("progress-bar").style.width=((i+1)/slides.length*100)+"%";document.getElementById("slide-number").textContent=(i+1)+" / "+slides.length;updateSidebarActive();}
function nextSlide(){if(currentSlideIndex<slides.length-1)showSlide(currentSlideIndex+1);}
function previousSlide(){if(currentSlideIndex>0)showSlide(currentSlideIndex-1);}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open");}
function toggleHelp(){document.getElementById("help-overlay").classList.toggle("hidden");}
function toggleFullscreen(){if(!document.fullscreenElement){const pc=document.getElementById("presentation-container");if(pc.requestFullscreen)pc.requestFullscreen();else if(pc.webkitRequestFullscreen)pc.webkitRequestFullscreen();else if(pc.msRequestFullscreen)pc.msRequestFullscreen();else if(pc.mozRequestFullScreen)pc.mozRequestFullScreen();}else{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();else if(document.msExitFullscreen)document.msExitFullscreen();else if(document.mozCancelFullScreen)document.mozCancelFullScreen();}}
function generateSidebar(){const sc=document.getElementById("sidebar-content");sc.innerHTML="";slides.forEach((html,idx)=>{const t=document.createElement("div");t.className="slide-thumbnail";if(idx===0)t.classList.add("active");const tmp=document.createElement("div");tmp.innerHTML=html;const title=tmp.querySelector("h1,h2");const titleText=title?title.textContent:("Слайд "+(idx+1));const textContent=tmp.textContent.replace(/s+/g," ").trim();const preview=textContent.substring(0,100)+(textContent.length>100?"...":"");t.innerHTML="<div class=\"slide-thumbnail-number\">"+(idx+1)+"</div><div class=\"slide-thumbnail-title\">"+titleText+"</div><div class=\"slide-thumbnail-content\">"+preview+"</div>";t.onclick=()=>{showSlide(idx);if(window.innerWidth<1024)toggleSidebar();};sc.appendChild(t);});}
function updateSidebarActive(){document.querySelectorAll(".slide-thumbnail").forEach((th,idx)=>{if(idx===currentSlideIndex){th.classList.add("active");th.scrollIntoView({behavior:"smooth",block:"nearest"});}else th.classList.remove("active");});}
document.addEventListener("keydown",e=>{switch(e.key){case"ArrowLeft":previousSlide();break;case"ArrowRight":case" ":e.preventDefault();nextSlide();break;case"f":case"F":toggleFullscreen();break;case"s":case"S":toggleSidebar();break;case"?":toggleHelp();break;case"Escape":const sb=document.getElementById("sidebar");const ho=document.getElementById("help-overlay");if(sb.classList.contains("open"))toggleSidebar();else if(!ho.classList.contains("hidden"))ho.classList.add("hidden");break;}});
generateSidebar();showSlide(0);</script></body></html>
