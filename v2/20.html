rd\">private</span> <span class=\"hljs-keyword\">final</span> <span class=\"hljs-type\">int</span> size;           <span class=\"hljs-comment\">// обов'язковий параметр</span>\n    <span class=\"hljs-keyword\">private</span> <span class=\"hljs-keyword\">final</span> <span class=\"hljs-type\">boolean</span> cheese;     <span class=\"hljs-comment\">// необов'язкові параметри</span>\n    <span class=\"hljs-keyword\">private</span> <span class=\"hljs-keyword\">final</span> <span class=\"hljs-type\">boolean</span> pepperoni;\n    <span class=\"hljs-keyword\">private</span> <span class=\"hljs-keyword\">final</span> <span class=\"hljs-type\">boolean</span> mushrooms;\n\n    <span class=\"hljs-comment\">// 🔒 Створити Pizza може лише Builder</span>\n    <span class=\"hljs-keyword\">private</span> <span class=\"hljs-title function_\">Pizza</span><span class=\"hljs-params\">(PizzaBuilder builder)</span> {\n        <span class=\"hljs-built_in\">this</span>.size = builder.size;\n        <span class=\"hljs-built_in\">this</span>.cheese = builder.cheese;\n        <span class=\"hljs-built_in\">this</span>.pepperoni = builder.pepperoni;\n        <span class=\"hljs-built_in\">this</span>.mushrooms = builder.mushrooms;\n    }\n\n    <span class=\"hljs-meta\">@Override</span>\n    <span class=\"hljs-keyword\">public</span> String <span class=\"hljs-title function_\">toString</span><span class=\"hljs-params\">()</span> {\n        <span class=\"hljs-keyword\">return</span> <span class=\"hljs-string\">\"🍕 Pizza [size=\"</span> + size + <span class=\"hljs-string\">\", cheese=\"</span> + cheese +\n               <span class=\"hljs-string\">\", pepperoni=\"</span> + pepperoni + <span class=\"hljs-string\">\", mushrooms=\"</span> + mushrooms + <span class=\"hljs-string\">\"]\"</span>;\n    }\n\n    <span class=\"hljs-comment\">// далі: вкладений клас PizzaBuilder</span></code></pre><div class=\"tip\"><strong>💡 Зверніть увагу</strong> <ul>\n<li>🔒 Усі поля оголошені як <code>final</code>: після створення об'єкт змінити неможливо</li>\n<li>📥 Конструктор приймає один параметр, сам Builder, замість довгого списку значень</li>\n<li>🚫 Клас не має set-методів: усі налаштування відбуваються до створення об'єкта</li>\n</ul>\n</div>\n\n","<h1>🧰 Builder: клас будівельника</h1>\n<p><strong>Головна ідея:</strong> вкладений статичний клас <code>PizzaBuilder</code> зберігає ті самі параметри, що й <code>Pizza</code>. Обов'язкові значення він отримує в конструкторі, а для необов'язкових має окремі методи.</p>\n<pre><code class=\"language-java hljs\" data-highlighted=\"yes\">    <span class=\"hljs-keyword\">public</span> <span class=\"hljs-keyword\">static</span> <span class=\"hljs-keyword\">class</span> <span class=\"hljs-title class_\">PizzaBuilder</span> {\n        <span class=\"hljs-keyword\">private</span> <span class=\"hljs-keyword\">final</span> <span class=\"hljs-type\">int</span> size;\n        <span class=\"hljs-keyword\">private</span> <span class=\"hljs-type\">boolean</span> <span class=\"hljs-variable\">cheese</span> <span class=\"hljs-operator\">=</span> <span class=\"hljs-literal\">false</span>;     <span class=\"hljs-comment\">// значення за замовчуванням</span>\n        <span class=\"hljs-keyword\">private</span> <span class=\"hljs-type\">boolean</span> <span class=\"hljs-variable\">pepperoni</span> <span class=\"hljs-operator\">=</span> <span class=\"hljs-literal\">false</span>;\n        <span class=\"hljs-keyword\">private</span> <span class=\"hljs-type\">boolean</span> <span class=\"hljs-variable\">mushrooms</span> <span class=\"hljs-operator\">=</span> <span class=\"hljs-literal\">false</span>;\n\n        <span class=\"hljs-keyword\">public</span> <span class=\"hljs-title function_\">PizzaBuilder</span><span class=\"hljs-params\">(<span class=\"hljs-type\">int</span> size)</span> {     <span class=\"hljs-comment\">// обов'язкове в конструкторі</span>\n            <span class=\"hljs-built_in\">this</span>.size = size;\n        }\n\n        <span class=\"hljs-keyword\">public</span> PizzaBuilder <span class=\"hljs-title function_\">withCheese</span><span class=\"hljs-params\">()</span> {\n            <span class=\"hljs-built_in\">this</span>.cheese = <span class=\"hljs-literal\">true</span>;\n            <span class=\"hljs-keyword\">return</span> <span class=\"hljs-built_in\">this</span>;                    <span class=\"hljs-comment\">// 🔗 дозволяє ланцюжок викликів</span>\n        }\n\n        <span class=\"hljs-keyword\">public</span> PizzaBuilder <span class=\"hljs-title function_\">withPepperoni</span><span class=\"hljs-params\">()</span> {\n            <span class=\"hljs-built_in\">this</span>.pepperoni = <span class=\"hljs-literal\">true</span>;\n            <span class=\"hljs-keyword\">return</span> <span class=\"hljs-built_in\">this</span>;\n        }\n\n        <span class=\"hljs-keyword\">public</span> PizzaBuilder <span class=\"hljs-title function_\">withMushrooms</span><span class=\"hljs-params\">()</span> {\n            <span class=\"hljs-built_in\">this</span>.mushrooms = <span class=\"hljs-literal\">true</span>;\n            <span class=\"hljs-keyword\">return</span> <span class=\"hljs-built_in\">this</span>;\n        }\n\n        <span class=\"hljs-keyword\">public</span> Pizza <span class=\"hljs-title function_\">build</span><span class=\"hljs-params\">()</span> {\n            <span class=\"hljs-keyword\">return</span> <span class=\"hljs-keyword\">new</span> <span class=\"hljs-title class_\">Pizza</span>(<span class=\"hljs-built_in\">this</span>);\n        }\n    }\n}</code></pre>","<h1>🎬 Builder у дії</h1>\n<p><strong>Головна ідея:</strong> код створення об'єкта сам пояснює, що саме створюється, а метод <code>build()</code> стає зручним місцем для перевірки коректності даних.</p>\n<pre><code class=\"language-java hljs\" data-highlighted=\"yes\"><span class=\"hljs-comment\">// ✅ Кожен параметр має назву, порядок викликів не важливий</span>\n<span class=\"hljs-type\">Pizza</span> <span class=\"hljs-variable\">margherita</span> <span class=\"hljs-operator\">=</span> <span class=\"hljs-keyword\">new</span> <span class=\"hljs-title class_\">Pizza</span>.PizzaBuilder(<span class=\"hljs-number\">30</span>)\n        .withCheese()\n        .build();\n\n<span class=\"hljs-type\">Pizza</span> <span class=\"hljs-variable\">special</span> <span class=\"hljs-operator\">=</span> <span class=\"hljs-keyword\">new</span> <span class=\"hljs-title class_\">Pizza</span>.PizzaBuilder(<span class=\"hljs-number\">40</span>)\n        .withCheese()\n        .withPepperoni()\n        .withMushrooms()\n        .build();</code></pre><h2>🛡️ Валідація перед створенням</h2>\n<pre><code class=\"language-java hljs\" data-highlighted=\"yes\"><span class=\"hljs-keyword\">public</span> Pizza <span class=\"hljs-title function_\">build</span><span class=\"hljs-params\">()</span> {\n    <span class=\"hljs-keyword\">if</span> (size &lt; <span class=\"hljs-number\">20</span> || size &gt; <span class=\"hljs-number\">50</span>) {\n        <span class=\"hljs-keyword\">throw</span> <span class=\"hljs-keyword\">new</span> <span class=\"hljs-title class_\">IllegalArgumentException</span>(\n            <span class=\"hljs-string\">\"Діаметр піци має бути від 20 до 50 см\"</span>);\n    }\n    <span class=\"hljs-keyword\">return</span> <span class=\"hljs-keyword\">new</span> <span class=\"hljs-title class_\">Pizza</span>(<span class=\"hljs-built_in\">this</span>);\n}</code></pre><div class=\"success\"><strong>✅ Що це дає</strong> <p>Об'єкт <code>Pizza</code> або створюється повністю коректним, або не створюється взагалі. Оскільки всі поля оголошені як <code>final</code>, після створення його стан уже не зміниться.</p>\n</div>\n\n","<h1>🎯 Builder: переваги та застосування</h1>\n<p><strong>Головна ідея:</strong> Builder додає до проєкту ще один клас, тому він виправданий лише для об'єктів зі справді складною конфігурацією.</p>\n<table>\n<thead>\n<tr>\n<th>Аспект</th>\n<th>Опис</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>📖 <strong>Читабельність</strong></td>\n<td>Назви методів пояснюють призначення кожного параметра</td>\n</tr>\n<tr>\n<td>🔧 <strong>Гнучкість</strong></td>\n<td>Новий необов'язковий параметр не ламає існуючі виклики</td>\n</tr>\n<tr>\n<td>🎨 <strong>Варіативність</strong></td>\n<td>Один Builder створює багато різних конфігурацій об'єкта</td>\n</tr>\n<tr>\n<td>🛡️ <strong>Надійність</strong></td>\n<td>Перевірки в <code>build()</code> не дозволяють створити некоректний об'єкт</td>\n</tr>\n<tr>\n<td>🔒 <strong>Незмінність</strong></td>\n<td>Готовий об'єкт можна зробити immutable</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Коли використовувати</strong> <ul>\n<li>Конструктор має <strong>чотири і більше параметрів</strong></li>\n<li>Значна частина параметрів <strong>необов'язкова</strong></li>\n<li>Кілька параметрів мають <strong>однаковий тип</strong>, і їх легко переплутати</li>\n<li>Об'єкт після створення має бути <strong>незмінним</strong></li>\n</ul>\n</div>\n\n\n\n\n\n<div class=\"success\"><strong>✅ Builder у стандартній бібліотеці Java</strong> <pre><code class=\"language-java hljs\" data-highlighted=\"yes\"><span class=\"hljs-comment\">// 📝 StringBuilder: покрокова побудова рядка</span>\n<span class=\"hljs-type\">String</span> <span class=\"hljs-variable\">text</span> <span class=\"hljs-operator\">=</span> <span class=\"hljs-keyword\">new</span> <span class=\"hljs-title class_\">StringBuilder</span>()\n        .append(<span class=\"hljs-string\">\"Hello, \"</span>)\n        .append(<span class=\"hljs-string\">\"World!\"</span>)\n        .toString();\n\n</code><p><code class=\"language-java hljs\" data-highlighted=\"yes\"><span class=\"hljs-comment\">// 🌐 HttpRequest (Java 11+): побудова HTTP-запитуHttpRequest request = HttpRequest.newBuilder()        .uri(URI.create(\"https://example.com/api/users\"))        .header(\"Accept\", \"application/json\")        .GET()        .build();</span></code></p></pre></div><p></p>\n","<h1>⚖️ Порівняння патернів</h1>\n<p><strong>Головна ідея:</strong> усі три патерни стосуються створення об'єктів, але вирішують різні задачі. Вибір патерну починається з визначення проблеми, а не навпаки.</p>\n<table>\n<thead>\n<tr>\n<th>Критерій</th>\n<th>👑 Singleton</th>\n<th>🏭 Simple Factory</th>\n<th>🔨 Builder</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Ключове питання</strong></td>\n<td>Скільки екземплярів?</td>\n<td>Який клас створити?</td>\n<td>Як зібрати об'єкт?</td>\n</tr>\n<tr>\n<td><strong>Проблема</strong></td>\n<td>Зайві копії спільного ресурсу</td>\n<td>Клієнт залежить від конкретних класів</td>\n<td>Забагато параметрів конструктора</td>\n</tr>\n<tr>\n<td><strong>Рішення</strong></td>\n<td>Приватний конструктор і <code>getInstance()</code></td>\n<td>Окремий клас із методом створення</td>\n<td>Ланцюжок методів і <code>build()</code></td>\n</tr>\n<tr>\n<td><strong>Основний ризик</strong></td>\n<td>Глобальний стан, складні тести</td>\n<td>Розростання <code>switch</code></td>\n<td>Додатковий клас і більше коду</td>\n</tr>\n<tr>\n<td><strong>Приклад</strong></td>\n<td>Logger, конфігурація</td>\n<td>Парсери, експортери</td>\n<td>HTTP-запит, складні налаштування</td>\n</tr>\n</tbody></table>\n<div class=\"warning\"><strong>⚠️ Коли патерн зайвий</strong> <ul>\n<li>👑 <strong>Singleton</strong> для звичайного класу, якому просто \"зручно\" бути доступним звідусіль</li>\n<li>🏭 <strong>Фабрика</strong> для єдиного класу, який не має і не матиме альтернативних реалізацій</li>\n<li>🔨 <strong>Builder</strong> для об'єкта з двома чи трьома обов'язковими параметрами</li>\n</ul>\n</div>\n\n\n\n\n\n<div class=\"tip\"><strong>💡 Патерни можна поєднувати</strong> <p>Наприклад, фабрика може всередині використовувати Builder для складання складного об'єкта, а сама існувати в застосунку в єдиному екземплярі.</p>\n</div>\n\n","<h1>🎯 Ключові висновки</h1>\n<div class=\"success\"><strong>✅ Головні тези лекції</strong> <p><strong>🧩 Патерни проєктування</strong></p>\n<ul>\n<li>Це перевірені рішення типових проблем, а не готовий код</li>\n<li>Вони формують спільну мову команди розробників</li>\n<li>Каталог GoF містить 23 патерни у трьох категоріях: породжувальні, структурні, поведінкові</li>\n</ul>\n<p><strong>👑 Singleton</strong></p>\n<ul>\n<li>Гарантує єдиний екземпляр класу і глобальний доступ до нього</li>\n<li>Має два базові варіанти: Lazy та Eager Initialization</li>\n<li>Створює глобальний стан та ускладнює тестування, тому часто поступається Dependency Injection</li>\n</ul>\n<p><strong>🏭 Simple Factory</strong></p>\n<ul>\n<li>Зосереджує логіку створення об'єктів в одному класі</li>\n<li>Клієнт працює з інтерфейсом і не знає про конкретні реалізації</li>\n</ul>\n<p><strong>🔨 Builder</strong></p>\n<ul>\n<li>Замінює телескопічний конструктор читабельним ланцюжком викликів</li>\n<li>Дозволяє перевірити дані перед створенням і отримати незмінний об'єкт</li>\n</ul>\n</div>\n\n\n\n\n\n<div class=\"tip\"><strong>💡 Практичні поради</strong> <ul>\n<li>🎯 Спочатку сформулюйте проблему, і лише потім обирайте патерн</li>\n<li>⚖️ Пам'ятайте, що кожен патерн має ціну: додаткові класи та складність</li>\n<li>📚 Шукайте знайомі патерни в стандартній бібліотеці та у відкритому коді</li>\n</ul>\n</div>\n\n","<h1>❓ Контрольні питання</h1>\n<ol>\n<li><p><strong>🧩 Що таке патерн проєктування і чим він відрізняється від алгоритму та бібліотеки?</strong></p>\n</li>\n<li><p><strong>📚 Назвіть три категорії патернів за класифікацією GoF.</strong> На яке питання відповідає кожна з них?</p>\n</li>\n<li><p><strong>👑 З яких трьох складових побудований Singleton?</strong> Яку роль виконує приватний конструктор?</p>\n</li>\n<li><p><strong>⚖️ Чим відрізняються Lazy та Eager Initialization?</strong> Чому ледача реалізація небезпечна в багатопоточній програмі?</p>\n</li>\n<li><p><strong>⚠️ Чому Singleton називають анти-патерном?</strong> Назвіть щонайменше три причини та поясніть, як Dependency Injection їх усуває.</p>\n</li>\n<li><p><strong>🏭 Яку проблему вирішує Simple Factory?</strong> Чому метод фабрики повертає інтерфейс, а не конкретний клас?</p>\n</li>\n<li><p><strong>🔨 Напишіть Builder для класу <code>Car</code></strong> з обов'язковими параметрами <code>brand</code>, <code>model</code> та необов'язковими <code>color</code>, <code>sunroof</code>, <code>navigationSystem</code>.</p>\n</li>\n</ol>\n","<h1>📖 Глосарій термінів</h1>\n<table>\n<thead>\n<tr>\n<th>Термін</th>\n<th>Пояснення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Design Pattern</strong></td>\n<td>Патерн проєктування: перевірене багаторазово використовуване рішення типової проблеми</td>\n</tr>\n<tr>\n<td><strong>Creational Patterns</strong></td>\n<td>Породжувальні патерни, що відповідають за створення об'єктів</td>\n</tr>\n<tr>\n<td><strong>Structural Patterns</strong></td>\n<td>Структурні патерни, що визначають способи поєднання класів та об'єктів</td>\n</tr>\n<tr>\n<td><strong>Behavioral Patterns</strong></td>\n<td>Поведінкові патерни, що описують взаємодію об'єктів і розподіл обов'язків</td>\n</tr>\n<tr>\n<td><strong>Singleton</strong></td>\n<td>Патерн, що гарантує єдиний екземпляр класу з глобальною точкою доступу</td>\n</tr>\n<tr>\n<td><strong>Lazy Initialization</strong></td>\n<td>Ледача ініціалізація: об'єкт створюється під час першого звернення</td>\n</tr>\n<tr>\n<td><strong>Eager Initialization</strong></td>\n<td>Завчасна ініціалізація: об'єкт створюється під час завантаження класу</td>\n</tr>\n<tr>\n<td><strong>Thread-Safe</strong></td>\n<td>Властивість коду коректно працювати за одночасного доступу з кількох потоків</td>\n</tr>\n<tr>\n<td><strong>Simple Factory</strong></td>\n<td>Клас, що централізує створення об'єктів і приховує від клієнта конкретні реалізації</td>\n</tr>\n<tr>\n<td><strong>Builder</strong></td>\n<td>Патерн, що дозволяє створювати складні об'єкти крок за кроком</td>\n</tr>\n<tr>\n<td><strong>Telescoping Constructor</strong></td>\n<td>Анти-патерн: набір перевантажених конструкторів із дедалі довшим списком параметрів</td>\n</tr>\n<tr>\n<td><strong>Fluent Interface</strong></td>\n<td>Стиль API, у якому методи повертають поточний об'єкт і утворюють ланцюжок викликів</td>\n</tr>\n<tr>\n<td><strong>Immutable Object</strong></td>\n<td>Незмінний об'єкт, стан якого не можна змінити після створення</td>\n</tr>\n<tr>\n<td><strong>Anti-pattern</strong></td>\n<td>Поширене рішення, яке здається зручним, але створює більше проблем, ніж вирішує</td>\n</tr>\n<tr>\n<td><strong>Mock</strong></td>\n<td>Тестова заглушка, що імітує поведінку реального об'єкта під час тестування</td>\n</tr>\n</tbody></table>\n","<h1>🔤 Глосарій абревіатур</h1>\n<table>\n<thead>\n<tr>\n<th>Абревіатура</th>\n<th>Розшифровка</th>\n<th>Пояснення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>GoF</strong></td>\n<td>Gang of Four / Банда чотирьох</td>\n<td>Автори каталогу 23 патернів: Gamma, Helm, Johnson, Vlissides</td>\n</tr>\n<tr>\n<td><strong>DI</strong></td>\n<td>Dependency Injection / Впровадження залежностей</td>\n<td>Передача залежностей об'єкту ззовні, зазвичай через конструктор</td>\n</tr>\n<tr>\n<td><strong>SRP</strong></td>\n<td>Single Responsibility Principle / Принцип єдиної відповідальності</td>\n<td>Клас повинен мати лише одну причину для змін</td>\n</tr>\n<tr>\n<td><strong>API</strong></td>\n<td>Application Programming Interface / Прикладний програмний інтерфейс</td>\n<td>Набір публічних методів, через які взаємодіють із класом чи системою</td>\n</tr>\n<tr>\n<td><strong>JVM</strong></td>\n<td>Java Virtual Machine / Віртуальна машина Java</td>\n<td>Середовище виконання програм, написаних мовою Java</td>\n</tr>\n<tr>\n<td><strong>ПЗ</strong></td>\n<td>Програмне забезпечення</td>\n<td>Сукупність програм та супровідної документації</td>\n</tr>\n<tr>\n<td><strong>БД</strong></td>\n<td>База даних</td>\n<td>Організоване сховище структурованих даних</td>\n</tr>\n</tbody></table>\n"];let currentSlideIndex=0;
function renderMath(root){if(typeof renderMathInElement!=="function"||!root)return;try{renderMathInElement(root,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\[",right:"\\]",display:true},{left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false}],throwOnError:false,strict:"ignore",ignoredTags:["script","noscript","style","textarea","pre","code"]});}catch(e){console.warn("Math render error:",e);}}
function showSlide(i){if(i<0||i>=slides.length)return;currentSlideIndex=i;const el=document.getElementById("current-slide");el.innerHTML=slides[i];el.scrollTop=0;renderMath(el);document.getElementById("progress-bar").style.width=((i+1)/slides.length*100)+"%";document.getElementById("slide-number").textContent=(i+1)+" / "+slides.length;updateSidebarActive();}
function nextSlide(){if(currentSlideIndex<slides.length-1)showSlide(currentSlideIndex+1);}
function previousSlide(){if(currentSlideIndex>0)showSlide(currentSlideIndex-1);}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open");}
function toggleHelp(){document.getElementById("help-overlay").classList.toggle("hidden");}
function toggleFullscreen(){if(!document.fullscreenElement){const pc=document.getElementById("presentation-container");if(pc.requestFullscreen)pc.requestFullscreen();else if(pc.webkitRequestFullscreen)pc.webkitRequestFullscreen();else if(pc.msRequestFullscreen)pc.msRequestFullscreen();else if(pc.mozRequestFullScreen)pc.mozRequestFullScreen();}else{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();else if(document.msExitFullscreen)document.msExitFullscreen();else if(document.mozCancelFullScreen)document.mozCancelFullScreen();}}
function generateSidebar(){const sc=document.getElementById("sidebar-content");sc.innerHTML="";slides.forEach((html,idx)=>{const t=document.createElement("div");t.className="slide-thumbnail";if(idx===0)t.classList.add("active");const tmp=document.createElement("div");tmp.innerHTML=html;const title=tmp.querySelector("h1,h2");const titleText=title?title.textContent:("Слайд "+(idx+1));const textContent=tmp.textContent.replace(/s+/g," ").trim();const preview=textContent.substring(0,100)+(textContent.length>100?"...":"");t.innerHTML="<div class=\"slide-thumbnail-number\">"+(idx+1)+"</div><div class=\"slide-thumbnail-title\">"+titleText+"</div><div class=\"slide-thumbnail-content\">"+preview+"</div>";t.onclick=()=>{showSlide(idx);if(window.innerWidth<1024)toggleSidebar();};sc.appendChild(t);});}
function updateSidebarActive(){document.querySelectorAll(".slide-thumbnail").forEach((th,idx)=>{if(idx===currentSlideIndex){th.classList.add("active");th.scrollIntoView({behavior:"smooth",block:"nearest"});}else th.classList.remove("active");});}
document.addEventListener("keydown",e=>{switch(e.key){case"ArrowLeft":previousSlide();break;case"ArrowRight":case" ":e.preventDefault();nextSlide();break;case"f":case"F":toggleFullscreen();break;case"s":case"S":toggleSidebar();break;case"?":toggleHelp();break;case"Escape":const sb=document.getElementById("sidebar");const ho=document.getElementById("help-overlay");if(sb.classList.contains("open"))toggleSidebar();else if(!ho.classList.contains("hidden"))ho.classList.add("hidden");break;}});
generateSidebar();showSlide(0);</script></body></html>
